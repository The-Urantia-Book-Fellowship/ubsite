<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="en-US" lang="en-US">
<head>
<meta charset="UTF-8"/>
<title>Contents</title>
<link rel="stylesheet" type="text/css" href="epub.css"/>
</head>
<body>
{% macro tree(nodes) %}
<ol>
{% for n in nodes %}
<li><a href="{{ n.href }}">{{ n.label }}</a>{% if n.kids %}{{ tree(n.kids) }}{% endif %}</li>
{% endfor %}
</ol>
{% endmacro %}
<nav epub:type="toc" id="toc">
<h1>Contents</h1>
{{ tree(toc) }}
</nav>
<nav epub:type="landmarks" id="landmarks" hidden="hidden">
<h2>Landmarks</h2>
<ol>
{% for kind, href, label in landmarks %}
<li><a epub:type="{{ kind }}" href="{{ href }}">{{ label }}</a></li>
{% endfor %}
</ol>
</nav>
</body>
</html>
