{% extends "_base.xhtml" %}
{% block title %}Appendix {{ app.letter }}. {{ app.title }}{% endblock %}
{% block body %}
<section epub:type="appendix" class="appendix">
<p class="papernum">Appendix {{ app.letter }}</p>
<h1>{{ app.title }}</h1>
<ul class="applist">
{% for r in rows %}
<li id="{{ r.id }}">{{ r.html|safe }}</li>
{% endfor %}
</ul>
</section>
{% endblock %}
