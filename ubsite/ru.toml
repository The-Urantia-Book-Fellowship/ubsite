"acct:fail:state" = { en = 'That sign-in had gone stale. Please try again.', ru = 'Эта попытка входа устарела. Пожалуйста, попробуйте ещё раз.' }
"acct:fail:unverified" = { en = 'Google says the email address of that account has not been verified, so it cannot be used to sign in here.', ru = 'Google сообщает, что адрес электронной почты этой учётной записи не подтверждён, поэтому войти с ней здесь нельзя.' }
"acct:fail:google" = { en = 'The sign-in with Google was not completed. Please try again.', ru = 'Вход через Google не был завершён. Пожалуйста, попробуйте ещё раз.' }
"One more step" = "Ещё один шаг"
"acct:welcome" = { en = 'Google says you are <b>{name}</b>, {email}. No account has been made for you yet.', ru = 'Google сообщает, что вы — <b>{name}</b>, {email}. Учётная запись для вас ещё не создана.' }
"acct:agree" = { en = 'I accept the <a href="/terms">Terms of use</a> and have read the <a href="/privacy">Privacy</a> page.', ru = 'Я принимаю <a href="/terms">Условия использования</a> и ознакомился со страницей <a href="/privacy">Конфиденциальность</a>.' }
"Create my account" = "Создать учётную запись"
"Signing you in…" = "Выполняется вход…"
"acct:delete?" = { en = 'Delete your account, and everything kept with it? This cannot be undone.', ru = 'Удалить вашу учётную запись и всё, что с ней хранится? Это нельзя отменить.' }
# What follows the account (static/account.js, 2026-11-19): what the menu
# says of it signed in, the offer with Sign out for a computer that is not
