# The interface in Russian (Tigran, 2026-10-25; ROADMAP item 15), read by
# ubsite/l10n.py, which says how: one line to a string, keyed by its English,
# a context after | where one English says two things, a plural as
# { en = [one, other], ru = [one, few, many] }, a long one by a name with its
# English beside it.  A key and its words are HTML.  {n:,} is a number grouped
# by thousands.  Not translated: the book, its index and appendices, the
# changelog, the API's documentation.
#
# The words chosen, for review:
#   The Urantia Book      Книга Урантии (the site's name; the book's own
#                         titles, "Foreword" among them, stay as printed:
#                         «Предисловие» is the Russian translation's, Tigran,
#                         2026-10-25; but where the interface describes, not
#                         lists, it is «Предисловие»: the home page's
#                         «Предисловие и документы 1–31», Settings, the
#                         tooltips, the quiz, Tigran, 2026-11-06)
#   Paper / section       документ / раздел;  paragraph  абзац
#   index entry           рубрика указателя;  subentry  подрубрика;
#                         headword  заглавное слово
#   1955 reading          разночтение 1955 года
#   study note            примечание
#   offline copy          офлайн-копия

