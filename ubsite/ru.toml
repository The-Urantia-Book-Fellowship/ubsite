"privacy:reading" = { en = 'Reading, searching, listening and keeping the site for reading offline need no account, and none of them puts a cookie in your browser.', ru = 'Чтение, поиск, прослушивание и хранение сайта для чтения без сети не требуют учётной записи, и ни одно из них не оставляет в вашем браузере cookie.' }
"What the server records of a visit" = "Что сервер записывает о посещении"
"privacy:visit:1" = { en = 'Each page asked of the server is counted. The record holds the time; the page’s address, with the words searched for where it is a search; the address of the page you came from, without anything after its question mark; your browser’s name, as it gives it; the first language your browser asks for; a country, region and city; and a visitor number.', ru = 'Каждая страница, запрошенная у сервера, учитывается. В записи: время; адрес страницы, а если это поиск, то и искомые слова; адрес страницы, с которой вы пришли, без того, что стоит после вопросительного знака; название вашего браузера, как он сам себя называет; первый язык, который запрашивает ваш браузер; страна, регион и город; и номер посетителя.' }
"privacy:visit:2" = { en = 'Your IP address is not written down. It is looked up in a database kept on the server itself (DB-IP’s City Lite) to find the place, and is sent nowhere for that. It is then mixed with your browser’s name and a secret that is replaced every day, to make the visitor number, and dropped. The number tells one day’s visitors apart. It cannot be followed from one day to the next, nor turned back into an address.', ru = 'Ваш IP-адрес не записывается. По базе данных, которая хранится на самом сервере (DB-IP City Lite), по нему определяется место, и для этого он никуда не отправляется. Затем из него, названия вашего браузера и секрета, который меняется каждый день, получается номер посетителя, и адрес отбрасывается. Номер отличает посетителей одного дня друг от друга. По нему нельзя ни проследить посетителя от одного дня к другому, ни восстановить адрес.' }
"privacy:visit:3" = { en = 'Calls to the <a href="/api">text API</a> are counted in the same way, and so is the fact that a recording was heard, once a day for a visitor. A page read from the offline copy is not asked of the server and is not counted at all. These records name no one, and are kept without a limit of time.', ru = 'Так же учитываются обращения к <a href="/api">API текста</a> и то, что запись была прослушана, — один раз в день для посетителя. Страница, прочитанная из офлайн-копии, у сервера не запрашивается и не учитывается вовсе. Эти записи никого не называют и хранятся без ограничения срока.' }
"The web server’s own log" = "Собственный журнал веб-сервера"
"privacy:log" = { en = 'In front of the site stands a web server, nginx, which keeps an ordinary log of its own: for each request the IP address, the time, the address asked for and the browser’s name. It is kept for 14 days and then deleted, and is read only to find a fault or an abuse.', ru = 'Перед сайтом стоит веб-сервер nginx, который ведёт собственный обычный журнал: для каждого запроса — IP-адрес, время, запрошенный адрес и название браузера. Журнал хранится 14 дней, затем удаляется, и читают его только чтобы найти неисправность или злоупотребление.' }
"What stays in your browser" = "Что остаётся в вашем браузере"
"privacy:browser" = { en = 'Your settings, the place you last read, your bookmarks, your answers in the quiz and the copy of the site kept for reading offline are stored by your browser, on your device. They are not sent to the server, unless you sign in: your settings, the place you last read and your bookmarks are then kept with your account too, as said below. Your answers in the quiz and the offline copy stay in the browser either way. Clearing the site’s data in your browser removes them from it.', ru = 'Ваши настройки, место, где вы читали в последний раз, ваши закладки, ваши ответы в викторине и копия сайта для чтения без сети хранятся вашим браузером на вашем устройстве. На сервер они не отправляются, если вы не вошли; если вошли, то ваши настройки, место, где вы читали в последний раз, и ваши закладки хранятся также вместе с вашей учётной записью, как сказано ниже. Ваши ответы в викторине и копия сайта для чтения без сети остаются в браузере в любом случае. Если очистить данные сайта в браузере, они будут удалены из него.' }
"The quiz’s board" = "Доска викторины"
"privacy:board" = { en = 'The board is the one thing the site takes from a reader who has no account, and only if you ask: after a quiz you may put a name of your choosing on it. The server then keeps that name, the answers you gave first and their times. It tells your browser from others by a random number your browser made, of which it keeps only a fingerprint; no address and nothing about your device is kept with it. To have a name taken off the board, write to the address above.', ru = 'Доска — единственное, что сайт принимает от читателя без учётной записи, и только по вашей просьбе: после викторины вы можете поместить на неё любое выбранное вами имя. Тогда сервер хранит это имя, ваши первые ответы и их время. Ваш браузер он отличает от других по случайному числу, которое создал сам браузер и от которого сервер хранит только отпечаток; ни адрес, ни что-либо о вашем устройстве вместе с ним не хранится. Чтобы имя убрали с доски, напишите по адресу, указанному выше.' }
"Signing in with Google" = "Вход через Google"
"privacy:account:1" = { en = 'Signing in is optional, and reading needs no account. It is offered at ubsite.sigmaai.au, from the menu at the corner of the page, and is done with a Google account; ubsite.ddns.net has no accounts. This part applies only once you have signed in.', ru = 'Вход необязателен, и чтобы читать, учётная запись не нужна. Войти можно на ubsite.sigmaai.au, в меню в углу страницы, с учётной записью Google; на ubsite.ddns.net учётных записей нет. Этот раздел действует, только когда вы вошли.' }
"privacy:account:2" = { en = 'When you sign in, Google tells the site four things about your Google account: a number that identifies it, your email address, your name and your picture. The site asks Google for nothing else, and can neither see nor change anything in your Google account. The picture is copied to the site as you sign in and shown to you from there: no page of the site loads it from Google.', ru = 'Когда вы входите, Google сообщает сайту о вашей учётной записи Google четыре вещи: номер, который её идентифицирует, ваш адрес электронной почты, ваше имя и ваше фото. Больше сайт у Google ничего не запрашивает и не может ни видеть, ни изменять что-либо в вашей учётной записи Google. Фото копируется на сайт при входе и показывается вам оттуда: ни одна страница сайта не загружает его с серверов Google.' }
"privacy:account:3" = { en = 'The site keeps those four, the times the account was made and last used, and what you keep with it so that it follows you from one device to another: your settings, the place you last read and your bookmarks. They are used for that and for nothing else. They are not sold, not shared with anyone and not used for advertising.', ru = 'Сайт хранит эти четыре сведения, время создания учётной записи и последнего входа, и то, что вы храните вместе с ней, чтобы оно следовало за вами с устройства на устройство: ваши настройки, место, где вы читали в последний раз, и ваши закладки. Они используются для этого и ни для чего другого. Они не продаются, никому не передаются и не используются для рекламы.' }
"privacy:account:4" = { en = 'While you are signed in, your browser holds cookies that say it is you. They are the only cookies the site puts in a reader’s browser, and they are not used to follow what you read.', ru = 'Пока вы вошли, ваш браузер хранит cookie, которые говорят сайту, что это вы. Это единственные cookie, которые сайт оставляет в браузере читателя, и они не используются, чтобы следить за тем, что вы читаете.' }
"privacy:account:5" = { en = 'You can sign out, or delete your account with everything kept for it, at any time, from the menu under your picture at the corner of the page. Copies of the accounts made for safekeeping are deleted within 30 days.', ru = 'Выйти или удалить учётную запись со всем, что для неё хранится, можно в любое время в меню под вашим фото в углу страницы. Резервные копии учётных записей удаляются в течение 30 дней.' }
"What the site does not do" = "Чего сайт не делает"
"privacy:not" = { en = 'There is no advertising, no analytics service and no social network’s button, and no script, font or picture is loaded from any other site: everything a page needs comes from this one. So there is no consent banner: nothing is stored on your device in order to follow you.', ru = 'Здесь нет ни рекламы, ни аналитических сервисов, ни кнопок социальных сетей, и ни один скрипт, шрифт или изображение не загружается с других сайтов: всё, что нужно странице, приходит с этого. Поэтому нет и баннера о согласии: на вашем устройстве не хранится ничего, что служило бы для слежения за вами.' }
"Why, and on what ground" = "Зачем и на каком основании"
"privacy:why" = { en = 'The counts show which parts of the site are read and from where, and help to find faults and abuse. Under the data protection law of the United Kingdom and of the European Union the ground for this is legitimate interest; for an account, it is providing what you asked for.', ru = 'Подсчёты показывают, какие части сайта читают и откуда, и помогают находить неисправности и злоупотребления. По законодательству о защите данных Великобритании и Европейского союза основанием для этого служит законный интерес; для учётной записи — предоставление того, о чём вы просили.' }
"Your rights" = "Ваши права"
"privacy:rights" = { en = 'You may ask what the site holds about you, and have it corrected or deleted. For an account that is what is listed above, and you can delete it yourself. Of a visit without an account the site holds nothing it can tie to you, by design, so there is nothing for it to look up, and the web server’s log is gone after 14 days. A request is answered within 30 days. You may also complain to the data protection authority of your country: in the United Kingdom, the Information Commissioner’s Office.', ru = 'Вы можете спросить, что сайт хранит о вас, и потребовать это исправить или удалить. Для учётной записи это перечисленное выше, и удалить её вы можете сами. О посещении без учётной записи сайт намеренно не хранит ничего, что он мог бы связать с вами, так что искать ему нечего, а журнал веб-сервера исчезает через 14 дней. На запрос отвечают в течение 30 дней. Вы также можете подать жалобу в орган по защите данных своей страны; в Великобритании это Information Commissioner’s Office.' }
"Children" = "Дети"
"privacy:children" = { en = 'The site is not directed at children under 13, and an account is not meant for them.', ru = 'Сайт не предназначен для детей младше 13 лет, и учётная запись не рассчитана на них.' }
"Changes to this page" = "Изменения этой страницы"
"privacy:changes" = { en = 'When this page changes, the date at its head changes with it, and the change is listed in the <a href="/changelog">Changelog</a>.', ru = 'Когда эта страница меняется, меняется и дата в её начале, а изменение указывается в <a href="/changelog">Истории изменений</a>.' }
"terms:lead" = { en = 'Last changed November 18, 2026.', ru = 'Последнее изменение: 18 ноября 2026 г.' }
"These terms" = "Эти условия"
"terms:accept" = { en = 'Using the site means accepting these terms and what the <a href="/privacy">Privacy</a> page says. If you do not accept them, please do not use it.', ru = 'Пользуясь сайтом, вы принимаете эти условия и то, что сказано на странице <a href="/privacy">Конфиденциальность</a>. Если вы их не принимаете, пожалуйста, не пользуйтесь сайтом.' }
"What the site is" = "Что это за сайт"
"terms:what" = { en = 'The site presents <i>The Urantia Book</i> in the Uversa Press edition, with its Index and Appendices, free of charge, for reading and study. It is run by Tigran Aivazian, and is not affiliated with Urantia Foundation.', ru = 'Сайт представляет <i>The Urantia Book</i> в издании Uversa Press, с Указателем и Приложениями, бесплатно, для чтения и изучения. Сайт ведёт Тигран Айвазян; с Фондом Урантия сайт не связан.' }
"What you may do with what is here" = "Что можно делать с тем, что здесь есть"
"terms:licence:1" = { en = 'The text of <i>The Urantia Book</i> is in the public domain. The Uversa Press edition as a whole, with the Index and Appendices as revised for the third edition, is licensed under <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC&nbsp;BY-NC-SA&nbsp;4.0</a>: it may be copied, shared and built upon for purposes that are not commercial, with credit, and under the same licence.', ru = 'Текст <i>The Urantia Book</i> является общественным достоянием. Издание Uversa Press целиком, вместе с Указателем и Приложениями в редакции третьего издания, распространяется по лицензии <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC&nbsp;BY-NC-SA&nbsp;4.0</a>: его можно копировать, распространять и использовать в своих работах в некоммерческих целях, с указанием источника и на условиях той же лицензии.' }
"terms:licence:2" = { en = 'Whatever else the site shows or plays, the translations, the recordings and the chart of the personalities, belongs to those credited for it where it is offered, and is here by their permission or under their own licences.', ru = 'Всё остальное, что сайт показывает или воспроизводит, — переводы, аудиозаписи и схема личностей — принадлежит тем, кто указан там, где это предлагается, и находится здесь с их разрешения или по их собственным лицензиям.' }
"terms:licence:3" = { en = 'Keeping the site in your browser for reading offline, and taking the text through the <a href="/api">text API</a>, are what the site is for, and are welcome.', ru = 'Хранить сайт в своём браузере для чтения без сети и брать текст через <a href="/api">API текста</a> — для этого сайт и существует, и это приветствуется.' }
"Fair use of the site" = "Добросовестное пользование сайтом"
"terms:use" = { en = 'Do not try to break the site, to get at what is not yours, or to burden it. A program that asks too often is refused for a while.', ru = 'Не пытайтесь вывести сайт из строя, получить доступ к тому, что вам не принадлежит, или перегрузить его. Программе, которая обращается слишком часто, на время отказывают.' }
"Accounts" = "Учётные записи"
"terms:accounts" = { en = 'An account is optional and free of charge, and you may delete it at any time. An account used to abuse the site may be closed.', ru = 'Учётная запись необязательна и бесплатна, и удалить её можно в любое время. Учётная запись, которую используют во вред сайту, может быть закрыта.' }
"terms:board" = { en = 'A name put on the quiz’s board is seen by everyone. A name that is offensive, or that passes for someone else’s, may be hidden.', ru = 'Имя, помещённое на доску викторины, видят все. Имя оскорбительное или выдающее себя за чужое может быть скрыто.' }
"No warranty" = "Без гарантий"
"terms:warranty" = { en = 'The site is offered as it is. Care is taken that the text is exact, and an error found is corrected and listed in the <a href="/changelog">Changelog</a>; but nothing is promised about its accuracy, nor that the site will always be there. As far as the law allows, the one who runs it is not liable for loss arising from its use.', ru = 'Сайт предоставляется как есть. О точности текста заботятся, и найденная ошибка исправляется и указывается в <a href="/changelog">Истории изменений</a>; но ничего не обещается ни о его точности, ни о том, что сайт будет доступен всегда. В той мере, в какой это допускает закон, тот, кто ведёт сайт, не несёт ответственности за ущерб, возникший из-за его использования.' }
"Changes, and the law" = "Изменения и применимое право"
"terms:changes" = { en = 'When these terms change, the date at their head changes with them, and the change is listed in the <a href="/changelog">Changelog</a>; going on using the site after that means accepting them. They are governed by the laws of the United Kingdom.', ru = 'Когда эти условия меняются, меняется и дата в их начале, а изменение указывается в <a href="/changelog">Истории изменений</a>; продолжая пользоваться сайтом после этого, вы их принимаете. К ним применяется законодательство Великобритании.' }
"Questions" = "Вопросы"
"terms:contact" = { en = 'Write to <a href="mailto:{mail}">{mail}</a>.', ru = 'Пишите на <a href="mailto:{mail}">{mail}</a>.' }

