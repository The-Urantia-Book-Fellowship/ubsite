"bible:intro" = { en = "The versions of the Bible’s pages, in this order: each verse’s first stands in its row, the others beside it in columns where the window has room, and in a fold under it where it has not.", ru = "Переводы на страницах Библии, в этом порядке: первый стоит в строке каждого стиха, остальные — рядом в колонках, где окну хватает места, и в свёртке под ним, где не хватает." }
