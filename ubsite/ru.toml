"chart|mark" = "схема"
"help:units:1" = { en = '<a href="/units">Unit conversions</a> is a table for each kind of measure the papers speak in: time, distance, speed, weight and temperature. Each row is a unit, the papers’ own (the Paradise-Havona standard day, the Jerusem day, the standard mile of Jerusem, the gradant) in their words with their paragraph, and the familiar ones beside them. Type a number in any row and every other row of the table follows; the time is also given in Urantia years, days, hours, minutes and seconds. Under each table are figures from the text, and a tap on one puts it in the table. The address names what is shown, as <code>/units#jday=3</code>, to send it to someone.', ru = '<a href="/units">Пересчёт единиц</a> — таблица для каждого рода мер, которыми говорят документы: время, расстояние, скорость, вес и температура. Каждая строка — единица: собственные единицы документов (стандартный день системы Рай-Хавона, иерусемский день, стандартная иерусемская миля, градант) — их словами и со ссылкой на абзац, и рядом привычные. Введите число в любую строку, и все остальные строки таблицы пересчитаются; время дано ещё и в урантийских годах, днях, часах, минутах и секундах. Под каждой таблицей — числа из текста; нажатие на одно из них ставит его в таблицу. Адрес называет то, что показано, например <code>/units#jday=3</code>, — чтобы отправить его кому-нибудь.' }
"help:chart:1" = { en = '<a href="/cosmology">Cosmology of Personalities</a> is a chart drawn from Alexander Alyuev’s data: the orders of personalities, each a card where it has its origin, in the units of the universe from Paradise to Urantia, with a line from what a personality comes of, to where it serves, and along the way of ascent. Choose a card, or a unit’s title, and what it is joined to stays lit while the rest stands back; its entry, over the chart, says what it is, where the book speaks of it, each a link into the text, and its headword in the index. The same card again, or <kbd>Esc</kbd>, lets go. The chart is moved as a page of the text is, by scrolling, by the keys or by a mouse’s drag, and as the page goes up one line stays at the top: the search box, which finds a personality by any of its names; the buttons that make the chart smaller and larger, as <kbd>Ctrl</kbd> and the wheel or two fingers do, and the one after them that shows its whole width; four arrows that move it; and <b>Legend</b>, which names the signs and the lines, each of its chips lighting every card of that kind. On a wide screen a small map in the corner shows where the window stands on the chart, and a click in it goes there. A headword’s page in the index, and a row of Appendix B, link to their card.', ru = '<a href="/cosmology">Космология личностей</a> — схема, построенная по данным Александра Алюева: категории личностей, каждая — карточка там, где её происхождение, в единицах вселенной от Рая до Урантии, с линиями от того, от кого личность происходит, туда, где она служит, и по пути восхождения. Выберите карточку или название единицы — и то, с чем она соединена, останется ярким, а остальное отступит; её описание поверх схемы говорит, что это, где о ней говорит книга (каждое место — ссылка в текст) и её заглавное слово в указателе. Та же карточка ещё раз или <kbd>Esc</kbd> — отпустить. Схема передвигается, как страница текста: прокруткой, клавишами или мышью, — и когда страница уходит вверх, наверху остаётся одна строка: поиск, который находит личность по любому из её имён; кнопки, уменьшающие и увеличивающие схему, как колесо с <kbd>Ctrl</kbd> или два пальца, и за ними кнопка, показывающая схему во всю ширину; четыре стрелки, которые её двигают; и <b>Легенда</b>, которая называет пиктограммы и связи, а каждая её метка высвечивает все карточки этого рода. На широком экране маленькая карта в углу показывает, где на схеме находится окно, и щелчок по ней переносит туда. Страница заглавного слова в указателе и строка Приложения B ведут к своей карточке.' }

