# About (ub.js openAbout): a small window from the ?'s menu.
"About this site" = "Об этом сайте"
"about:1" = { en = "<i>The Urantia Book</i> in the Uversa Press edition, read together with its index, so that the index works in both directions: from a concept into the text, and from any paragraph back to everything the index says about it.", ru = "<i>Книга Урантии</i> в издании Uversa Press вместе с её указателем, который работает в обе стороны: от понятия — к тексту и от любого абзаца — ко всему, что говорит о нём указатель." }
"about:repo" = { en = "The site’s source is on GitHub: {a}", ru = "Исходный код сайта — на GitHub: {a}" }
"about:more" = { en = "The edition, its licence and the changelog", ru = "Издание, его лицензия и история изменений" }
"Take the tour" = "Экскурсия по сайту"
"Show me" = "Показать"
"help:intro" = { en = "This is <i>The Urantia Book</i> in the Uversa Press edition, read together with its index: beside every paragraph stands everything the index says about it, and from any entry you can go back to every passage it cites. This page says what each part of the page does. The tour shows it on the page itself.", ru = "Это <i>Книга Урантии</i> в издании Uversa Press вместе с её указателем: рядом с каждым абзацем стоит всё, что о нём говорит указатель, а из любой рубрики можно вернуться ко всем отрывкам, на которые она ссылается. Эта страница объясняет, что делает каждая часть страницы. Экскурсия показывает это на самой странице." }
"The text on the page" = "Текст на странице"
"The index beside the text" = "Указатель рядом с текстом"
"Moving about" = "Перемещение по книге"
"Search|help" = "Поиск"
"Audio|help" = "Аудио"
"Notes and 1955 readings" = "Примечания и разночтения 1955 года"
"Settings|help" = "Настройки"
"Working offline, and the app" = "Работа офлайн и приложение"
"The quiz|help" = "Викторина"
"The interface in Russian" = "Интерфейс на русском"
"Keys" = "Клавиши"
"About this edition|help" = "Об этом издании"
"help:text:1" = { en = "Each paragraph begins with its reference, <i>1:1.2</i>: paper 1, section 1, paragraph 2. It is the address of the paragraph everywhere: in the index, in the search box, in a link. A click or a tap on it copies the paragraph’s link, its address on this site, to send or keep. Under it {play} plays the paragraph aloud, and the figures beside it, <i>0:47</i>, are the time the recording takes over it.", ru = "Каждый абзац начинается со своего номера, <i>1:1.2</i>: документ 1, раздел 1, абзац 2. Это адрес абзаца всюду: в указателе, в строке поиска, в ссылке. Нажатие на номер копирует ссылку на абзац, его адрес на этом сайте, чтобы отправить или сохранить её. Под ним {play} читает абзац вслух, а цифры рядом, <i>0:47</i>, — время, за которое запись его читает." }
"help:text:2" = { en = "A pilcrow ¶ marks where the 1955 printing left a blank line: a new group of paragraphs begins. The words of Jesus are set in red. A paper’s first letter is dropped, as in the printed book. Settings can show the page and paragraph of the 1955 printing beside the reference, <i>(24.3)</i>, and can hide any of this.", ru = "Знак ¶ отмечает место, где в издании 1955 года была пустая строка: начинается новая группа абзацев. Слова Иисуса набраны красным. Первая буква документа — буквица, как в печатной книге. В Настройках можно показать рядом с номером страницу и абзац издания 1955 года, <i>(24.3)</i>, и можно скрыть всё это." }
"help:text:cap" = { en = "A paragraph as the page sets it, with its reference and {play}.", ru = "Абзац, как его набирает страница: с номером и {play}." }
"help:text:3" = { en = "By default a page is one section. With <b>Whole paper</b> in Settings, a paper is one page, section after section, for reading straight through.", ru = "По умолчанию страница — это один раздел. С настройкой <b>Документ целиком</b> документ занимает одну страницу, раздел за разделом, для сплошного чтения." }
"help:index:1" = { en = "The Uversa Press index, revised for the third edition, has about 50,000 references to the text. Here it is turned round: beside each paragraph stand the entries that cite it. An entry reads from its headword down, <i>Universal Father › also known as › other titles</i>. Tap it to open the headword’s page, with every subentry and every passage it points to; the entry you came from is marked.", ru = "В указателе Uversa Press, пересмотренном для третьего издания, около 50 000 ссылок на текст. Здесь он перевёрнут: рядом с каждым абзацем стоят рубрики, которые на него ссылаются. Рубрика читается от заглавного слова вниз, <i>Universal Father › also known as › other titles</i>. Нажмите на неё, чтобы открыть страницу заглавного слова со всеми подрубриками и всеми отрывками; рубрика, с которой вы пришли, отмечена." }
"help:index:cap" = { en = "A paragraph with the entries that cite it. On a phone they fold to one line under the paragraph; a tap on any such line opens or folds them under every paragraph, and they stay so.", ru = "Абзац с рубриками, которые на него ссылаются. На телефоне они сворачиваются в одну строку под абзацем; нажатие на любую такую строку раскрывает или сворачивает их под всеми абзацами, и они остаются такими." }
"help:index:2" = { en = "What the index cites across a whole section or paper is listed once, above the text, in a box headed <i>Cited across this whole section</i>, rather than repeated under every paragraph. An entry that cites a range of paragraphs stands beside the first of them.", ru = "То, на что указатель ссылается целиком, на раздел или на документ, перечислено один раз, над текстом, в рамке с заголовком <i>Ссылки на весь раздел</i>, а не повторяется под каждым абзацем. Рубрика, ссылающаяся на несколько абзацев подряд, стоит у первого из них." }
"help:index:3" = { en = "The index can be read on its own, letter by letter, on <a href=\"/index\">its own pages</a>, named on the home page under Other ways in, and the <a href=\"/appendix\">appendices</a> A–F (the chronology, the celestial beings, the persons and the places) each have a page. A headword cited in three paragraphs or more has a <b>reading path</b>: its passages, in the order of the book, as a topical anthology. The <b>Index</b> button at the head of the margin folds the whole index away, and the folded chevron brings it back.", ru = "Указатель можно читать и сам по себе, по буквам, на <a href=\"/index\">его собственных страницах</a>, названных на главной странице в разделе «Другие пути в книгу», а у <a href=\"/appendix\">приложений</a> A–F (хронология, небесные существа, лица и места) есть свои страницы. У заглавного слова, на которое ссылаются три абзаца и больше, есть <b>путь чтения</b>: его отрывки в порядке книги, как тематическая хрестоматия. Кнопка <b>Указатель</b> над полем сворачивает весь указатель; свёрнутая стрелка возвращает его." }
"help:moving:1" = { en = "<b>The search box is also the address box.</b> Type a reference and the page opens there: <i>1:4.2</i> a paragraph, <i>12:4.2-3</i> a range, <i>Paper 12</i> a paper, <i>12:4sec</i> a section.", ru = "<b>Строка поиска — это и строка адреса.</b> Введите ссылку, и страница откроется там: <i>1:4.2</i> — абзац, <i>12:4.2-3</i> — несколько абзацев, <i>Paper 12</i> — документ, <i>12:4sec</i> — раздел." }
"help:moving:2" = { en = "<b>The contents</b> stand at the left: the whole book, the parts and papers, and the sections of the paper being read. A title opens it; the chevron beside a paper opens its list of sections. The <b>Contents</b> heading folds the whole list away; on a phone it starts folded, as one line above the text.", ru = "<b>Содержание</b> стоит слева: вся книга, части и документы, и разделы читаемого документа. Название открывает его; стрелка рядом с документом раскрывает список его разделов. Заголовок <b>Содержание</b> сворачивает весь список; на телефоне он с самого начала свёрнут в одну строку над текстом." }
"help:moving:3" = { en = "<b>At the end of a section</b> four buttons step through the book: a paper back, a section back, a section on, a paper on. On a page of the whole paper only the paper buttons remain.", ru = "<b>В конце раздела</b> четыре кнопки ведут по книге: документ назад, раздел назад, раздел вперёд, документ вперёд. На странице целого документа остаются только кнопки документов." }
"help:moving:4" = { en = "<b>From a keyboard</b>, <kbd>Space</kbd>, <kbd>Page Down</kbd> and <kbd>→</kbd> go on a screen, and <kbd>Shift</kbd>+<kbd>Space</kbd>, <kbd>Page Up</kbd> and <kbd>←</kbd> go back; the last whole line comes to the top, so no line is cut.", ru = "<b>С клавиатуры</b> <kbd>Space</kbd>, <kbd>Page Down</kbd> и <kbd>→</kbd> листают экран вперёд, а <kbd>Shift</kbd>+<kbd>Space</kbd>, <kbd>Page Up</kbd> и <kbd>←</kbd> — назад; последняя целая строка поднимается наверх, так что ни одна строка не обрезается." }
"help:moving:5" = { en = "<b>A tap on the text</b> brings down the running head, as in the printed book: the reference of the paragraph you tapped, which opens the contents at this paper; the paper and its author; and Settings and Home. The next tap, Escape, or a little scrolling takes it away. On a phone, a tap on the <b>Contents</b> heading then takes you back to the paragraph. Over a translation’s paragraph the running head is in that translation, and so are the contents its reference opens.", ru = "<b>Касание текста</b> показывает колонтитул, как в печатной книге: номер абзаца, которого вы коснулись (он открывает содержание на этом документе), документ и его автора, Настройки и Домой. Следующее касание, Escape или небольшая прокрутка убирают его. На телефоне касание заголовка <b>Содержание</b> возвращает затем к абзацу. Над абзацем перевода колонтитул дан в этом переводе, как и содержание, которое открывает его номер." }
"help:moving:cap" = { en = "The running head, as a tap on the text shows it.", ru = "Колонтитул, каким его показывает касание текста." }
"help:moving:6" = { en = "<b>Continue reading</b>, in the bar along the foot of the home page and of every page but the text’s own, goes back to the paragraph you were last reading: the one at the top of the screen once you have stayed on a page of the text a few seconds or scrolled it, or, where you were listening, the paragraph last read to you. Until then it says <b>Begin reading</b> and opens the Foreword. The place is kept in this browser<span class=\"acctnone\"> only</span><span class=\"acctonly\">, and with your account if you are signed in</span>.", ru = "<b>Продолжить чтение</b> — в полосе внизу главной страницы и всех страниц, кроме страниц самого текста, — возвращает к абзацу, который вы читали последним: к тому, что был вверху экрана, когда вы задержались на странице текста на несколько секунд или прокрутили её, а если вы слушали — к абзацу, который вам читали последним. До тех пор там написано <b>Начать чтение</b>, и открывается Предисловие. Это место хранится <span class=\"acctnone\">только </span>в этом браузере<span class=\"acctonly\">, а если вы вошли — и вместе с вашей учётной записью</span>." }
"help:moving:7" = { en = "<b>Bookmarks.</b> A tap on a paragraph also brings a bar along the foot of the screen. <b>Bookmark this paragraph</b> keeps the place, and a small ribbon then stands in the margin beside the paragraph; tap the paragraph and the button again to take it off. Beside it, <b>Copy link</b> puts the paragraph’s address on the clipboard, with the references shown or not; on a phone it is the drawing of a link alone. The ribbon with a number, at the right end of that bar and beside Continue reading on every other page, opens your bookmarks in the book’s order: tap one to go there, or its cross to remove it, with Undo until the list is closed. Bookmarks are kept in this browser<span class=\"acctnone\"> only</span><span class=\"acctonly\">, and with your account if you are signed in</span>.", ru = "<b>Закладки.</b> Касание абзаца показывает также полосу внизу экрана. <b>Поставить закладку</b> сохраняет это место, и на поле рядом с абзацем появляется ленточка; чтобы снять закладку, коснитесь абзаца и той же кнопки ещё раз. Рядом с этой кнопкой <b>Копировать ссылку</b> помещает адрес абзаца в буфер обмена, показаны номера абзацев или нет; на телефоне это только значок ссылки. Ленточка с числом в правом конце этой полосы, а на остальных страницах рядом с «Продолжить чтение», открывает ваши закладки в порядке книги: коснитесь одной, чтобы перейти к ней, или её крестика, чтобы удалить; пока список открыт, удалённую можно вернуть. Закладки хранятся <span class=\"acctnone\">только </span>в этом браузере<span class=\"acctonly\">, а если вы вошли — и вместе с вашей учётной записью</span>." }
"help:search:1" = { en = "A word or a phrase is looked for in the index first, then in the text. The results come in lists: <b>headwords</b> that match (an exact one first), <b>in the index</b>, <b>in the text</b>, in the study notes, in each translation you have ticked, and, if you turn them on, in the 1955 readings. Each list can be opened whole, and Settings can leave any of them out.", ru = "Слово или фразу ищут сначала в указателе, потом в тексте. Результаты идут списками: подходящие <b>заглавные слова</b> (точное совпадение первым), <b>в указателе</b>, <b>в тексте</b>, в примечаниях, в каждом отмеченном вами переводе и, если их включить, в разночтениях 1955 года. Каждый список можно раскрыть целиком, а в Настройках — убрать любой из них." }
"help:search:2" = { en = "With words selected on any page, <kbd>Ctrl</kbd>+<kbd>X</kbd> puts them into the search box; <kbd>Escape</kbd> there puts back what it held.", ru = "Выделите слова на любой странице и нажмите <kbd>Ctrl</kbd>+<kbd>X</kbd> — они попадут в строку поиска; <kbd>Escape</kbd> в ней вернёт то, что там было." }
"help:listening:1" = { en = "Merritt Horn’s reading of the whole book is here, cut at the paragraph. The {play} under any paragraph’s reference starts it there, and the page follows the voice, paragraph by paragraph. Instead of the recording, Settings can choose your browser’s own voice, which can read the translations too. Each translation has a {play} of its own, under the paragraph where it is opened and in its column in parallel columns: the Urantia Book Society of Greater New York’s is read by Grigory Voyner, a recording of the whole book too, but for the introductions to Papers 19 and 50, cut at the paragraph (made in 2012–2014, since when the translation has been corrected, so here and there he says other words than the page’s); the others by your browser’s voice.", ru = "Здесь есть чтение всей книги Мерриттом Хорном, разрезанное по абзацам. {play} под номером любого абзаца начинает чтение с него, и страница следует за голосом, абзац за абзацем. Вместо записи в Настройках можно выбрать голос вашего браузера, который может читать и переводы. У каждого перевода свой {play} — и под абзацем, где перевод раскрыт, и в его параллельной колонке: перевод Общества Книги Урантии Большого Нью-Йорка читает Григорий Войнер — это тоже запись всей книги, кроме вступлений к Документам 19 и 50, разрезанная по абзацам (сделана в 2012–2014 годах; перевод с тех пор исправлялся, поэтому кое-где он произносит не те слова, что на странице); остальные читает голос вашего браузера." }
"help:listening:cap" = { en = "The player, left to right: back to the start of the section (pressed twice, the one before); back to the start of the paragraph (pressed twice, the one before); play and pause; the next paragraph; the next section; the paragraph being read, which a tap brings into view; the voice, a menu; ↓ keeps this paper’s recording for reading offline; the time left in the section, on a little screen as a watch's; the speed, a menu; and stop. On a phone, and wherever one line would leave the voice's name too little room, the paragraph and the voice are a line over the buttons.", ru = "Проигрыватель слева направо: в начало раздела (нажать дважды — к предыдущему); в начало абзаца (нажать дважды — к предыдущему); воспроизведение и пауза; следующий абзац; следующий раздел; читаемый абзац, касание которого показывает его на экране; голос — меню; ↓ сохраняет запись этого документа для чтения офлайн; сколько осталось до конца раздела — на маленьком экранчике, как у часов; скорость — меню; и стоп. На телефоне, и везде, где в одной строке имени голоса не хватит места, абзац и голос стоят строкой над кнопками." }
"help:listening:2" = { en = "At the end of a section the player offers the next; with <b>Carry on into the next section</b> in Settings it goes on by itself through the book. The keys on headphones and the lock screen work: play, pause, the paragraph before or after.", ru = "В конце раздела проигрыватель предлагает следующий; с настройкой <b>Продолжать в следующем разделе</b> он сам идёт дальше по книге. Работают кнопки наушников и экрана блокировки: воспроизведение, пауза, предыдущий и следующий абзац." }
"help:notes:1" = { en = "A small raised number after a word is a <b>study note</b>: the human sources the paper draws on, a word explained, a figure. A tiny ring marks words the <b>1955 printing</b> had otherwise, with the reasons the committee gave for the change. Tap either, and a card opens under the line; tap again, or press Escape, to close it. Every note and every reading is also listed under <a href=\"/lists\">Lists</a> on the home page. With <b>Paragraph previews</b> on in Settings, a reference in a note, such as 15:4.7, shows the paragraph it points to in a card where the pointer rests; on a phone a tap shows it, and the reference at the card’s head goes there; in a translator’s note the card shows the translation’s own paragraph.", ru = "Маленькая приподнятая цифра после слова — <b>примечание</b>: человеческие источники, на которые опирается документ, объяснение слова, рисунок. Крошечное кольцо отмечает слова, которые в <b>издании 1955 года</b> читались иначе, с доводами комитета за изменение. Нажмите на то или другое — под строкой откроется карточка; нажмите снова или Escape, чтобы закрыть. Все примечания и все разночтения перечислены и в <a href=\"/lists\">Списках</a> на главной странице. Если в Настройках включён <b>Просмотр абзацев</b>, ссылка в примечании, например 15:4.7, показывает абзац, на который она указывает, в карточке под указателем мыши; на телефоне его показывает касание, а номер в заголовке карточки ведёт к нему; в примечании переводчика карточка показывает абзац самого перевода." }
"help:notes:cap" = { en = "A paragraph with a 1955 reading’s ring and a study note’s number. Tap them.", ru = "Абзац с кольцом разночтения 1955 года и номером примечания. Нажмите на них." }
"help:translations:1" = { en = "Three Russian translations can be read with the English: Tigran Aivazian’s <i>Урантийские документы</i>, with notes of its own; the translation of the Urantia Book Society of Greater New York; and Urantia Foundation’s. Tick them in Settings, in the <b>Texts</b> tab, where the English is one of the texts, and put them in the order you want: the first of them that a paragraph has stands where the English stands now, and any of them can be hidden, the English too. Where the window has room for them they then stand side by side, a column each, paragraph against paragraph; where it has not, each paragraph has a line under it that opens the others, in tabs, and so has each title, for their titles. A tap on any one of those lines opens them under every paragraph, and a tap again folds them all; they stay as you leave them, from page to page<span class=\"acctonly\">, and on your other devices when you are signed in</span>. A tab chosen in one is chosen in all.", ru = "Вместе с английским можно читать три русских перевода: <i>Урантийские документы</i> Тиграна Айвазяна, со своими примечаниями; перевод Общества Книги Урантии Большого Нью-Йорка; и перевод Фонда Урантия. Отметьте их в Настройках, на вкладке <b>Тексты</b>, где английский — один из текстов, и расставьте в нужном вам порядке: первый из них, какой есть у абзаца, стоит там, где сейчас стоит английский, и любой из них можно скрыть, в том числе английский. Где в окне хватает места, они встанут рядом, каждый своей колонкой, абзац против абзаца; где не хватает — под каждым абзацем появится строка, которая раскрывает остальные во вкладках, и такая же под каждым заголовком — для их заголовков. Нажатие на любую такую строку раскрывает их под всеми абзацами, а повторное — сворачивает их все; они остаются такими, какими вы их оставили, со страницы на страницу<span class=\"acctonly\">, а если вы вошли в учётную запись — и на других ваших устройствах</span>. Вкладка, выбранная в одном месте, выбирается везде." }
"help:translations:cap" = { en = "The fold under a paragraph, where the window has no room for columns.", ru = "Строка под абзацем там, где в окне нет места для колонок." }
"help:translations:2" = { en = "<b>Columns need room</b>: each must be wide enough to read, about half a full line of the text or more, and they come all together or not at all. To have them where the translations are in folds, fold the Contents or the index away, choose a smaller Text size, widen the window, or tick fewer translations; a tablet may have room for two columns, and a phone lying down. The × at the corner of a column stops showing its text, the English too. The contents can be shown in a translation too, from the list on the Contents line. A part’s title page shows the texts you have ticked as well, in the same order, one under another, or side by side in columns.", ru = "<b>Колонкам нужно место</b>: каждая должна быть достаточно широкой для чтения, примерно в половину полной строки текста или шире, и появляются они все вместе или не появляются вовсе. Чтобы увидеть их там, где переводы свёрнуты под абзацами, сверните Содержание или указатель, выберите меньший размер текста, расширьте окно или отметьте меньше переводов; для двух колонок места может хватить и на планшете, и на телефоне, повёрнутом набок. × в углу колонки перестаёт показывать её текст, в том числе английский. Содержание тоже можно показать по переводу — из списка в строке Содержания. Титульная страница части тоже показывает отмеченные тексты в том же порядке: один под другим или в колонках рядом." }
"help:settings:1" = { en = "The gear in the header, or <kbd>Ctrl</kbd>+<kbd>,</kbd>, opens Settings, in five tabs: <b>Reading</b> (the interface’s language, theme, the interface’s text size and the text’s, line spacing, typeface, width, alignment, the whole paper on one page, paragraph previews), <b>Show</b> (what stands beside the text: the index, red letter, references, pilcrows, notes, the 1955 readings, the quiz, tooltips), <b>Texts</b>, <b>Audio</b> (the voice, its speed, following along) and <b>Offline</b>. The button beside the title restores the defaults. The half-disc beside the gear switches between the light theme and the dark at once. Everything is kept in this browser<span class=\"acctnone\"> only; nothing is sent anywhere</span><span class=\"acctonly\">, and nothing is sent anywhere unless you sign in (Your account, below)</span>.", ru = "Шестерёнка в шапке или <kbd>Ctrl</kbd>+<kbd>,</kbd> открывает Настройки в пяти вкладках: <b>Чтение</b> (язык интерфейса, тема, размер интерфейса и размер текста, межстрочный интервал, шрифт, ширина, выравнивание, документ целиком на одной странице, просмотр абзацев), <b>Показ</b> (что стоит рядом с текстом: указатель, красные слова, номера, знаки абзаца, примечания, разночтения 1955 года, викторина, подсказки), <b>Тексты</b>, <b>Аудио</b> (голос, скорость, слежение за чтением) и <b>Офлайн</b>. Кнопка рядом с заголовком восстанавливает настройки по умолчанию. Полукруг рядом с шестерёнкой сразу переключает светлую и тёмную тему. Всё хранится в этом браузере<span class=\"acctnone\">, и только в нём; никуда ничего не отправляется</span><span class=\"acctonly\">, и никуда ничего не отправляется, пока вы не вошли (см. «Ваша учётная запись» ниже)</span>." }
"help:full:1" = { en = "The four corners beside the half-disc fill the screen with the page, hiding the browser’s bars, and on a phone the system’s too: most useful in the app. Tap them again, or press Back or <kbd>Esc</kbd>, to leave full screen. While it is on, the browser leaves it whenever a new page opens, and your first tap on that page, anywhere but on a link, brings it back. An iPhone cannot show a page in full screen, so there the corners are not shown.", ru = "Четыре уголка рядом с полукругом разворачивают страницу во весь экран, скрывая панели браузера, а на телефоне и системные: удобнее всего в приложении. Нажмите на них ещё раз, кнопку «Назад» или <kbd>Esc</kbd>, чтобы выйти из полноэкранного режима. Пока он включён, браузер покидает его при открытии каждой новой страницы, и первое касание на ней, где угодно, кроме ссылки, возвращает его. iPhone не умеет показывать страницу во весь экран, поэтому там уголков нет." }
# Your account (help.html #account, 2026-11-19): shown on the hosts that have
# accounts alone, the page being one for every host (the head script's
# hasacct; ub.css .acctonly, .acctnone, which the three sentences above use).
"Your account" = "Ваша учётная запись"
"help:account:1" = { en = "The head and shoulders at the header’s corner opens your account. <b>Sign in with Google</b> there, and your settings, your bookmarks and the place you last read are kept with your account, and are the same on every device where you sign in: a phone, a tablet, another computer. Reading needs no account, and nothing changes for a reader who has none.", ru = "Значок с головой и плечами в углу шапки открывает вашу учётную запись. Нажмите там <b>Войти через Google</b> — и ваши настройки, закладки и место, где вы читали в последний раз, будут храниться вместе с учётной записью и станут одинаковыми на всех устройствах, где вы вошли: на телефоне, планшете, другом компьютере. Чтобы читать, учётная запись не нужна, и для читателя без неё ничего не меняется." }
"help:account:2" = { en = "All your settings follow you but those chosen for a screen, of which each device keeps its own: the two text sizes, the line spacing, the width, the browser’s voices, and whether the Contents and the index are folded away. A change made on one device reaches another the next time a page is opened there, or at once when you open the account’s menu. The first time you sign in on a device that already has settings and bookmarks, its bookmarks are added to yours, and its settings give way to your account’s.", ru = "За вами следуют все настройки, кроме тех, что выбираются под экран и на каждом устройстве свои: два размера текста, межстрочный интервал, ширина, голоса браузера и то, свёрнуты ли содержание и указатель. Изменение, сделанное на одном устройстве, появляется на другом, когда там в следующий раз открывается страница, или сразу, если открыть меню учётной записи. Когда вы впервые входите на устройстве, где уже есть настройки и закладки, его закладки добавляются к вашим, а его настройки уступают настройкам учётной записи." }
"help:account:3" = { en = "<b>Sign out</b> leaves the browser as it is. On a computer that is not yours, tick the box under it first, and your settings, bookmarks and place are taken out of that browser as well. <b>Delete my account</b> removes the account and everything kept with it; what this browser holds stays in it. What the site keeps is said in full under <a href=\"/privacy\">Privacy</a>.", ru = "<b>Выйти</b> — браузер остаётся как есть. На чужом компьютере сначала поставьте галочку под этой кнопкой, и ваши настройки, закладки и место чтения будут удалены и из этого браузера. <b>Удалить мою учётную запись</b> — удаляет учётную запись и всё, что с ней хранится; то, что хранит этот браузер, остаётся в нём. Что именно хранит сайт, подробно сказано на странице <a href=\"/privacy\">Конфиденциальность</a>." }
"help:offline:1" = { en = "The whole site, about 48 MB, downloads into this browser by itself on your first visit and keeps itself up to date; the site then reads from it, so pages and search open at once, and go on working without a connection. Open Settings’ <b>Offline</b> tab to see it, as <b>Base</b>; translations and the recordings, a paper or a part at a time, can be kept there too. <b>Automatic updates</b>, a switch under it, can be turned off: the copy then stays as it is, and the site goes on reading from it, until you tap <b>Update now</b>. <b>Install as an app</b> puts it on the home screen or in the dock, where it opens on its own; the home page offers it too, in a line over the header whose cross puts it away for good. On the home page, the right end of the bar at the foot says how the copy stands, and opens this tab.", ru = "Весь сайт, около 48 МБ, сам загружается в этот браузер при первом посещении и сам обновляется; после этого сайт читает из копии, так что страницы и поиск открываются сразу и продолжают работать без связи. Откройте вкладку <b>Офлайн</b> в Настройках, чтобы увидеть её: она называется <b>База</b>; там же можно сохранить переводы и записи, по документу или по части. <b>Автоматическое обновление</b>, переключатель под ней, можно выключить: тогда копия остаётся как есть, и сайт продолжает читать из неё, пока вы не нажмёте <b>Обновить</b>. <b>Установить как приложение</b> помещает сайт на главный экран или в док, откуда он открывается сам по себе; то же предлагает главная страница, строкой над шапкой, крестик которой убирает её навсегда. На главной странице правый край панели внизу сообщает, в каком состоянии копия, и открывает эту вкладку." }
"help:offline:2" = { en = "On an iPhone, Safari deletes what a site keeps after seven days without a visit, unless the site is added to the Home Screen; so add it.", ru = "На iPhone Safari удаляет всё, что хранит сайт, через семь дней без посещений, если только сайт не добавлен на экран «Домой»; поэтому добавьте его." }
"help:quiz:1" = { en = "At the end of each paper the Cosmic Citizenship Quiz asks its questions on that paper, one at a time, the questions and their answers in a new order each time; some have more than one right answer. Each answer shows the passage that settles it. <a href=\"/quiz\">Quiz</a> on the home page gathers them all, ten at random from the whole book or a part, and keeps your best score in this browser. A board, if you wish, puts your name beside your score.", ru = "В конце каждого документа викторина «Космическое гражданство» задаёт вопросы по нему, по одному, каждый раз в новом порядке, как и ответы; у некоторых больше одного правильного ответа. Каждый ответ показывает отрывок, который его решает. <a href=\"/quiz\">Викторина</a> на главной странице собирает их все, десять наугад по всей книге или по части, и хранит ваш лучший результат в этом браузере. Таблица результатов, если хотите, поставит ваше имя рядом с вашим результатом." }
"help:russian:1" = { en = "The flag at the header’s corner opens the list of languages, each named in its own words; or <b>Interface language</b>, first in Settings’ Reading tab, which does the same on a narrow screen where the list does not fit. Either switches everything the site says between English and Russian: the header, Settings, the folds, the player, the quiz’s words, this page. The book itself, its index and appendices stay in English; the Russian translations are read beside the text, as above. Until one is chosen, the site follows the language of your browser.", ru = "Флаг в углу шапки открывает список языков, каждый из которых назван на нём самом, или <b>Язык интерфейса</b>, первая строка вкладки «Чтение» в Настройках (на узком экране, где списку нет места, вместо него). И то и другое переключает всё, что говорит сайт, между английским и русским: шапку, Настройки, свёрнутые строки, проигрыватель, слова викторины, эту страницу. Сама книга, её указатель и приложения остаются на английском; русские переводы читаются рядом с текстом, как описано выше. Пока язык не выбран, сайт следует языку вашего браузера." }
