"About this edition" = "Об этом издании"
"home:edition" = { en = "The text is the Uversa Press edition of <i>The Urantia Book</i>, published by the Urantia Book Fellowship: {p} papers in {s:,} sections and {g:,} paragraphs, each with a reference of its own. This site shows the words of Jesus in red, in {r:,} paragraphs; the printed book does not. The edition's textual apparatus notes every place where the text differs from the first printing of 1955, {v} in all, and gives the 1955 reading beneath each.", ru = "Текст — издание <i>The Urantia Book</i> от Uversa Press, выпущенное Urantia Book Fellowship: документов — {p}, разделов — {s:,}, абзацев — {g:,}, и у каждого своя ссылка. Этот сайт выделяет слова Иисуса красным (абзацев с ними: {r:,}); в печатной книге этого нет. Текстологический аппарат издания отмечает каждое место, где текст отличается от первого издания 1955 года (всего их {v}), и под каждым даёт чтение 1955 года." }
"home:the-index" = { en = "The index is the Uversa Press index, revised with numerous corrections for the third edition, 2026, where it is bound together with the text in a single volume. Its {c:,} references, reaching {x:,} places in the text, compiled and checked over many years, are what make the margins of this reader possible. The printed volume remains the book; this is an additional way to move through it.", ru = "Указатель — это указатель Uversa Press, выверенный с многочисленными исправлениями для третьего издания 2026 года, где он переплетён вместе с текстом в одном томе. Его ссылки ({c:,}), ведущие к местам текста ({x:,}), собранные и проверенные за многие годы, — вот что делает возможными поля этой читалки. Книгой остаётся печатный том; это ещё один способ двигаться по ней." }

