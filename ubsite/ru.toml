# --- Help (help.html) and the tour (static/help.js), 2026-11-06.  Every word
# of both is Tigran's to revise; the keys stay.

"Help" = "Справка"
"Help and tour" = "Справка и экскурсия"
"Take the tour" = "Экскурсия по сайту"
"Show me" = "Показать"
"help:intro" = { en = "This is <i>The Urantia Book</i> in the Uversa Press edition, read together with its index: beside every paragraph stands everything the index says about it, and from any entry you can go back to every passage it cites. This page says what each part of the page does. The tour shows it on the page itself.", ru = "Это <i>Книга Урантии</i> в издании Uversa Press вместе с её указателем: рядом с каждым абзацем стоит всё, что о нём говорит указатель, а из любой рубрики можно вернуться ко всем отрывкам, на которые она ссылается. Эта страница объясняет, что делает каждая часть страницы. Экскурсия показывает это на самой странице." }
"The text on the page" = "Текст на странице"
"The index beside the text" = "Указатель рядом с текстом"
"Moving about" = "Перемещение по книге"
"Search|help" = "Поиск"
"Listening|help" = "Аудио"
"Notes and 1955 readings" = "Примечания и разночтения 1955 года"
"Translations and Compare" = "Переводы и сравнение"
"Settings|help" = "Настройки"
"Working offline, and the app" = "Работа офлайн и приложение"
"The quiz|help" = "Викторина"
"The interface in Russian" = "Интерфейс на русском"
"Keys" = "Клавиши"
"About this edition|help" = "Об этом издании"
"help:text:1" = { en = "Each paragraph begins with its reference, <i>1:1.2</i>: paper 1, section 1, paragraph 2. It is the address of the paragraph everywhere: in the index, in the search box, in a link. Under it {play} plays the paragraph aloud.", ru = "Каждый абзац начинается со своего номера, <i>1:1.2</i>: документ 1, раздел 1, абзац 2. Это адрес абзаца всюду: в указателе, в строке поиска, в ссылке. Под ним {play} читает абзац вслух." }
"help:text:2" = { en = "A pilcrow ¶ marks where the 1955 printing left a blank line: a new group of paragraphs begins. The words of Jesus are set in red. A paper’s first letter is dropped, as in the printed book. Settings can show the page and paragraph of the 1955 printing beside the reference, <i>(24.3)</i>, and can hide any of this.", ru = "Знак ¶ отмечает место, где в издании 1955 года была пустая строка: начинается новая группа абзацев. Слова Иисуса набраны красным. Первая буква документа — буквица, как в печатной книге. В Настройках можно показать рядом с номером страницу и абзац издания 1955 года, <i>(24.3)</i>, и можно скрыть всё это." }
"help:text:cap" = { en = "A paragraph as the page sets it, with its reference and {play}.", ru = "Абзац, как его набирает страница: с номером и {play}." }
"help:text:3" = { en = "By default a page is one section. With <b>Whole paper</b> in Settings, a paper is one page, section after section, for reading straight through.", ru = "По умолчанию страница — это один раздел. С настройкой <b>Документ целиком</b> документ занимает одну страницу, раздел за разделом, для сплошного чтения." }
"help:index:1" = { en = "The Uversa Press index, revised for the third edition, has about 50,000 references to the text. Here it is turned round: beside each paragraph stand the entries that cite it. An entry reads from its headword down, <i>Universal Father › also known as › other titles</i>. Tap it to open the headword’s page, with every subentry and every passage it points to; the entry you came from is marked.", ru = "В указателе Uversa Press, пересмотренном для третьего издания, около 50 000 ссылок на текст. Здесь он перевёрнут: рядом с каждым абзацем стоят рубрики, которые на него ссылаются. Рубрика читается от заглавного слова вниз, <i>Universal Father › also known as › other titles</i>. Нажмите на неё, чтобы открыть страницу заглавного слова со всеми подрубриками и всеми отрывками; рубрика, с которой вы пришли, отмечена." }
"help:index:cap" = { en = "A paragraph with the entries that cite it. On a phone they fold to one line under the paragraph.", ru = "Абзац с рубриками, которые на него ссылаются. На телефоне они сворачиваются в одну строку под абзацем." }
"help:index:2" = { en = "What the index cites across a whole section or paper is listed once, above the text, in a box headed <i>Cited across this whole section</i>, rather than repeated under every paragraph. An entry that cites a range of paragraphs stands beside the first of them.", ru = "То, на что указатель ссылается целиком, на раздел или на документ, перечислено один раз, над текстом, в рамке с заголовком <i>Ссылки на весь раздел</i>, а не повторяется под каждым абзацем. Рубрика, ссылающаяся на несколько абзацев подряд, стоит у первого из них." }
"help:index:3" = { en = "The index can be read on its own: the <a href=\"/index\">Index</a> link in the header lists it letter by letter, and the <a href=\"/appendix\">appendices</a> A–F (the chronology, the celestial beings, the persons and the places) each have a page. A headword cited in three paragraphs or more has a <b>reading path</b>: its passages, in the order of the book, as a topical anthology. The <b>Index</b> button at the head of the margin folds the whole index away, and the folded chevron brings it back.", ru = "Указатель можно читать и сам по себе: ссылка <a href=\"/index\">Указатель</a> в шапке открывает его по буквам, а у <a href=\"/appendix\">приложений</a> A–F (хронология, небесные существа, лица и места) есть свои страницы. У заглавного слова, на которое ссылаются три абзаца и больше, есть <b>путь чтения</b>: его отрывки в порядке книги, как тематическая хрестоматия. Кнопка <b>Указатель</b> над полем сворачивает весь указатель; свёрнутая стрелка возвращает его." }
"help:moving:1" = { en = "<b>The search box is also the address box.</b> Type a reference and the page opens there: <i>1:4.2</i> a paragraph, <i>12:4.2-3</i> a range, <i>Paper 12</i> a paper, <i>12:4sec</i> a section.", ru = "<b>Строка поиска — это и строка адреса.</b> Введите ссылку, и страница откроется там: <i>1:4.2</i> — абзац, <i>12:4.2-3</i> — несколько абзацев, <i>Paper 12</i> — документ, <i>12:4sec</i> — раздел." }
"help:moving:2" = { en = "<b>The contents</b> stand at the left: the whole book, the parts and papers, and the sections of the paper being read. A title opens it; the chevron beside a paper opens its list of sections. The <b>Contents</b> heading folds the whole list away; on a phone it starts folded, as one line above the text.", ru = "<b>Содержание</b> стоит слева: вся книга, части и документы, и разделы читаемого документа. Название открывает его; стрелка рядом с документом раскрывает список его разделов. Заголовок <b>Содержание</b> сворачивает весь список; на телефоне он с самого начала свёрнут в одну строку над текстом." }
"help:moving:3" = { en = "<b>At the end of a section</b> four buttons step through the book: a paper back, a section back, a section on, a paper on. On a page of the whole paper only the paper buttons remain.", ru = "<b>В конце раздела</b> четыре кнопки ведут по книге: документ назад, раздел назад, раздел вперёд, документ вперёд. На странице целого документа остаются только кнопки документов." }
"help:moving:4" = { en = "<b>From a keyboard</b>, <kbd>Space</kbd>, <kbd>Page Down</kbd> and <kbd>→</kbd> go on a screen, and <kbd>Shift</kbd>+<kbd>Space</kbd>, <kbd>Page Up</kbd> and <kbd>←</kbd> go back; the last whole line comes to the top, so no line is cut. On a phone, <b>Tap to turn the page</b> in Settings makes a tap on the lower half of the screen go on and on the upper half go back.", ru = "<b>С клавиатуры</b> <kbd>Space</kbd>, <kbd>Page Down</kbd> и <kbd>→</kbd> листают экран вперёд, а <kbd>Shift</kbd>+<kbd>Space</kbd>, <kbd>Page Up</kbd> и <kbd>←</kbd> — назад; последняя целая строка поднимается наверх, так что ни одна строка не обрезается. На телефоне настройка <b>Листать касанием</b> делает так, что касание нижней половины экрана листает вперёд, а верхней — назад." }
"help:moving:5" = { en = "<b>A tap on the text</b> brings down the running head, as in the printed book: the reference of the paragraph you tapped, which opens the contents at this paper; the paper and its author; and Home and Settings. The next tap, Escape, or a little scrolling takes it away.", ru = "<b>Касание текста</b> показывает колонтитул, как в печатной книге: номер абзаца, которого вы коснулись (он открывает содержание на этом документе), документ и его автора, Домой и Настройки. Следующее касание, Escape или небольшая прокрутка убирают его." }
"help:moving:cap" = { en = "The running head, as a tap on the text shows it.", ru = "Колонтитул, каким его показывает касание текста." }
"help:search:1" = { en = "A word or a phrase is looked for in the index first, then in the text. The results come in lists: <b>headwords</b> that match (an exact one first), <b>in the index</b>, <b>in the text</b>, in the study notes, in each translation you have ticked, and, if you turn them on, in the 1955 readings. Each list can be opened whole, and Settings can leave any of them out.", ru = "Слово или фразу ищут сначала в указателе, потом в тексте. Результаты идут списками: подходящие <b>заглавные слова</b> (точное совпадение первым), <b>в указателе</b>, <b>в тексте</b>, в примечаниях, в каждом отмеченном вами переводе и, если их включить, в разночтениях 1955 года. Каждый список можно раскрыть целиком, а в Настройках — убрать любой из них." }
"help:search:2" = { en = "With words selected on any page, <kbd>Ctrl</kbd>+<kbd>X</kbd> puts them into the search box; <kbd>Escape</kbd> there puts back what it held.", ru = "Выделите слова на любой странице и нажмите <kbd>Ctrl</kbd>+<kbd>X</kbd> — они попадут в строку поиска; <kbd>Escape</kbd> в ней вернёт то, что там было." }
"help:listening:1" = { en = "Merritt Horn’s reading of the whole book is here, cut at the paragraph. The {play} under any paragraph’s reference starts it there, and the page follows the voice, paragraph by paragraph. Instead of the recording, Settings can choose your browser’s own voice, which can read the translations too.", ru = "Здесь есть чтение всей книги Мерриттом Хорном, разрезанное по абзацам. {play} под номером любого абзаца начинает чтение с него, и страница следует за голосом, абзац за абзацем. Вместо записи в Настройках можно выбрать голос вашего браузера, который может читать и переводы." }
"help:listening:cap" = { en = "The player, left to right: back to the start of the paragraph (pressed twice, the one before); play and pause; the next paragraph; the paragraph being read, which a tap brings into view; the voice, a menu; ↓ keeps this paper’s recording for reading offline; the speed, a menu; and stop.", ru = "Проигрыватель слева направо: в начало абзаца (нажать дважды — к предыдущему); воспроизведение и пауза; следующий абзац; читаемый абзац, касание которого показывает его на экране; голос — меню; ↓ сохраняет запись этого документа для чтения офлайн; скорость — меню; и стоп." }
"help:listening:2" = { en = "At the end of a section the player offers the next; with <b>Carry on into the next section</b> in Settings it goes on by itself through the book. The keys on headphones and the lock screen work: play, pause, the paragraph before or after.", ru = "В конце раздела проигрыватель предлагает следующий; с настройкой <b>Продолжать в следующем разделе</b> он сам идёт дальше по книге. Работают кнопки наушников и экрана блокировки: воспроизведение, пауза, предыдущий и следующий абзац." }
"help:notes:1" = { en = "A small raised number after a word is a <b>study note</b>: the human sources the paper draws on, a word explained, a figure. A tiny ring marks words the <b>1955 printing</b> had otherwise, with the reasons the committee gave for the change. Tap either, and a card opens under the line; tap again, or press Escape, to close it. Every note and every reading is also listed under <a href=\"/lists\">Lists</a> on the home page.", ru = "Маленькая приподнятая цифра после слова — <b>примечание</b>: человеческие источники, на которые опирается документ, объяснение слова, рисунок. Крошечное кольцо отмечает слова, которые в <b>издании 1955 года</b> читались иначе, с доводами комитета за изменение. Нажмите на то или другое — под строкой откроется карточка; нажмите снова или Escape, чтобы закрыть. Все примечания и все разночтения перечислены и в <a href=\"/lists\">Списках</a> на главной странице." }
"help:notes:cap" = { en = "A paragraph with a 1955 reading’s ring and a study note’s number. Tap them.", ru = "Абзац с кольцом разночтения 1955 года и номером примечания. Нажмите на них." }
"help:translations:1" = { en = "Three Russian translations can be read with the English: Tigran Aivazian’s <i>Урантийские документы</i>, with notes of its own; the translation of the Urantia Book Society of Greater New York; and Urantia Foundation’s. Tick them in Settings, in the <b>Translations</b> tab, in the order you want. Each paragraph then has a line under it that opens them in tabs.", ru = "Вместе с английским можно читать три русских перевода: <i>Урантийские документы</i> Тиграна Айвазяна, со своими примечаниями; перевод Общества Книги Урантии Большого Нью-Йорка; и перевод Фонда Урантия. Отметьте их в Настройках, на вкладке <b>Переводы</b>, в нужном вам порядке. Тогда под каждым абзацем появится строка, которая раскрывает их во вкладках." }
"help:translations:cap" = { en = "The fold under a paragraph, once a translation is ticked.", ru = "Строка под абзацем, когда отмечен перевод." }
"help:translations:2" = { en = "<b>Compare</b>, a button at the head of the text, sets the English and the translations side by side, a column each, paragraph against paragraph, and stays on as you move through the book until you turn it off. The contents can be shown in a translation too, from the list on the Contents line.", ru = "<b>Сравнение</b>, кнопка над текстом, ставит английский и переводы рядом, по колонке каждому, абзац против абзаца, и остаётся включённым, пока вы идёте по книге, пока вы его не выключите. Содержание тоже можно показать по переводу — из списка в строке Содержания." }
"help:settings:1" = { en = "The gear in the header, or <kbd>Ctrl</kbd>+<kbd>,</kbd>, opens Settings, in five tabs: <b>Reading</b> (theme, size, line spacing, typeface, width, alignment, tapping to turn the page, the whole paper on one page), <b>Show</b> (what stands beside the text: the index, red letter, references, pilcrows, notes, the 1955 readings, the quiz, tooltips), <b>Translations</b>, <b>Listening</b> (the voice, its speed, following along) and <b>Offline</b>. The button beside the title restores the defaults. Everything is kept in this browser only; nothing is sent anywhere.", ru = "Шестерёнка в шапке или <kbd>Ctrl</kbd>+<kbd>,</kbd> открывает Настройки в пяти вкладках: <b>Чтение</b> (тема, размер, межстрочный интервал, шрифт, ширина, выравнивание, листание касанием, документ целиком на одной странице), <b>Показ</b> (что стоит рядом с текстом: указатель, красные слова, номера, знаки абзаца, примечания, разночтения 1955 года, викторина, подсказки), <b>Переводы</b>, <b>Аудио</b> (голос, скорость, слежение за чтением) и <b>Офлайн</b>. Кнопка рядом с заголовком восстанавливает настройки по умолчанию. Всё хранится только в этом браузере; никуда ничего не отправляется." }
"Light or dark" = "Светлая или тёмная"
"help:offline:1" = { en = "The cloud in the header is the sign of the offline copy. Tap it, or open Settings’ <b>Offline</b> tab, and tick <b>Base</b>: the whole site, about 48 MB, is kept in this browser and opens without a connection, and keeps itself up to date. Translations and the recordings, a paper or a part at a time, can be kept too. <b>Install as an app</b> puts it on the home screen or in the dock, where it opens on its own.", ru = "Облако в шапке — знак офлайн-копии. Нажмите на него или откройте вкладку <b>Офлайн</b> в Настройках и отметьте <b>Основа</b>: весь сайт, около 48 МБ, сохранится в этом браузере, будет открываться без связи и сам обновляться. Переводы и записи, по документу или по части, тоже можно сохранить. <b>Установить как приложение</b> помещает сайт на главный экран или в док, откуда он открывается сам по себе." }
"Online, no copy" = "В сети, без копии"
"A copy is kept" = "Копия сохранена"
"Downloading|cloud" = "Загружается"
"An update is waiting" = "Ждёт обновление"
"Offline, reading the copy" = "Офлайн, читается копия"
"help:offline:2" = { en = "On an iPhone, Safari deletes what a site keeps after seven days without a visit, unless the site is added to the Home Screen; so add it.", ru = "На iPhone Safari удаляет всё, что хранит сайт, через семь дней без посещений, если только сайт не добавлен на экран «Домой»; поэтому добавьте его." }
"help:quiz:1" = { en = "At the end of each paper the Cosmic Citizenship Quiz asks its questions on that paper, one at a time; some have more than one right answer. Each answer shows the passage that settles it. <a href=\"/quiz\">Quiz</a> on the home page gathers them all, ten at random from the whole book or a part, and keeps your best score in this browser. A board, if you wish, puts your name beside your score.", ru = "В конце каждого документа викторина «Космическое гражданство» задаёт вопросы по нему, по одному; у некоторых больше одного правильного ответа. Каждый ответ показывает отрывок, который его решает. <a href=\"/quiz\">Викторина</a> на главной странице собирает их все, десять наугад по всей книге или по части, и хранит ваш лучший результат в этом браузере. Таблица результатов, если хотите, поставит ваше имя рядом с вашим результатом." }
"help:russian:1" = { en = "The two flags at the corner switch everything the site says between English and Russian: the header, Settings, the folds, the player, the quiz’s words, this page. The book itself, its index and appendices stay in English; the Russian translations are read beside the text, as above. Until a flag is tapped, the site follows the language of your browser.", ru = "Два флага в углу переключают всё, что говорит сайт, между английским и русским: шапку, Настройки, свёрнутые строки, проигрыватель, слова викторины, эту страницу. Сама книга, её указатель и приложения остаются на английском; русские переводы читаются рядом с текстом, как описано выше. Пока флаг не нажат, сайт следует языку вашего браузера." }
"On a screen" = "Экран вперёд"
"Back a screen" = "Экран назад"
"Search for the words selected; with none, go to the search box" = "Искать выделенные слова; без выделения — перейти в строку поиска"
"Open or close Settings" = "Открыть или закрыть Настройки"
"Close a card, the running head or a dialog" = "Закрыть карточку, колонтитул или диалог"
"In Settings: the tabs" = "В Настройках: вкладки"
"In the quiz: choose an answer; check, or go on" = "В викторине: выбрать ответ; проверить или идти дальше"
"In the tour: back, next, end it" = "В экскурсии: назад, дальше, закончить"
"Headphones" = "Наушники"
"Play, pause, the paragraph before or after, stop" = "Воспроизведение, пауза, предыдущий и следующий абзац, стоп"
"help:about:1" = { en = "The text is the Uversa Press edition of <i>The Urantia Book</i>, with the Index and Appendices as revised for the third edition, in which the index is bound with the text. The text of the book is in the public domain; the edition as a whole, with its index, is licensed CC BY-NC-SA 4.0. The site is not affiliated with Urantia Foundation, whose translations are its copyright and used by permission.", ru = "Текст — издание <i>Книги Урантии</i> от Uversa Press, с Указателем и Приложениями в редакции третьего издания, где указатель переплетён вместе с текстом. Текст книги является общественным достоянием; издание в целом, с указателем, распространяется по лицензии CC BY-NC-SA 4.0. Сайт не связан с Фондом Урантия; переводы Фонда защищены его авторским правом и используются с его разрешения." }
"help:about:2" = { en = "What changed on the site, and when, is in the <a href=\"/changelog\">Changelog</a>. Other sites can take the text through the <a href=\"/api\">text API</a>.", ru = "Что и когда менялось на сайте — в <a href=\"/changelog\">Истории изменений</a>. Другие сайты могут брать текст через <a href=\"/api\">API текста</a>." }
"home:help" = { en = "<a href=\"/help\">Help</a> — what each part of the page does, with a short tour of it on the page itself.", ru = "<a href=\"/help\">Справка</a> — что делает каждая часть страницы, с короткой экскурсией по самой странице." }

# The tour's cards (static/help.js).
"Welcome|tour" = "Добро пожаловать"
"tour:welcome" = { en = "This is <i>The Urantia Book</i> in the Uversa Press edition, read together with its index: beside every paragraph, everything the index says about it. A two-minute tour shows what the page can do; you can take it again from Help, the {q} at the corner.", ru = "Это <i>Книга Урантии</i> в издании Uversa Press вместе с её указателем: у каждого абзаца — всё, что о нём говорит указатель. Двухминутная экскурсия покажет, что умеет страница; её можно повторить из Справки — знак {q} в углу." }
"tour:welcome:open" = { en = "The tour runs on a page of the book, so it opens Paper 1 first.", ru = "Экскурсия проходит на странице книги, поэтому сначала откроется Документ 1." }
"tour:keys" = { en = "<kbd>→</kbd> next, <kbd>←</kbd> back, <kbd>Esc</kbd> ends it", ru = "<kbd>→</kbd> дальше, <kbd>←</kbd> назад, <kbd>Esc</kbd> закрыть" }
"Begin|tour" = "Начать"
"Open the book" = "Открыть книгу"
"Skip the tour" = "Пропустить"
"More in Help" = "Подробнее в Справке"
"Back|tour" = "Назад"
"Next|tour" = "Дальше"
"Done|tour" = "Готово"
"{a} of {b}|tour" = "{a} из {b}"
"tour:chips:title" = { en = "The index beside the text", ru = "Указатель рядом с текстом" }
"tour:chips" = { en = "Each entry here cites this paragraph. Tap one to read all the index says under that heading, with every passage it points to.", ru = "Каждая рубрика здесь ссылается на этот абзац. Нажмите на неё, чтобы прочесть всё, что указатель говорит под этим заголовком, со всеми отрывками." }
"tour:cited:title" = { en = "Cited as a whole", ru = "Ссылки на весь раздел" }
"tour:cited" = { en = "What the index cites across the whole section or paper is listed once here, above the text, rather than under every paragraph.", ru = "То, на что указатель ссылается целиком — на раздел или на документ, — перечислено здесь один раз, над текстом, а не под каждым абзацем." }
"tour:search:title" = { en = "Search, or an address", ru = "Поиск или адрес" }
"tour:search" = { en = "A word finds headwords, index entries and passages. A reference opens the place itself: <i>1:4.2</i>, <i>12:4.2-3</i>, <i>Paper 12</i>. With words selected, <kbd>Ctrl</kbd>+<kbd>X</kbd> puts them here.", ru = "Слово находит заглавные слова, рубрики указателя и отрывки. Ссылка открывает само место: <i>1:4.2</i>, <i>12:4.2-3</i>, <i>Paper 12</i>. Выделите слова и нажмите <kbd>Ctrl</kbd>+<kbd>X</kbd> — они попадут сюда." }
"tour:contents:title" = { en = "The contents", ru = "Содержание" }
"tour:contents" = { en = "The whole book, with the sections of the paper being read. It folds away by its own heading, and the folded chevron brings it back.", ru = "Вся книга, с разделами читаемого документа. Сворачивается по своему заголовку; свёрнутая стрелка возвращает его." }
"tour:transport:title" = { en = "Turning the page", ru = "Листание" }
"tour:transport" = { en = "A section back or on, a paper back or on. From a keyboard, <kbd>Space</kbd>, <kbd>Page Down</kbd> and <kbd>→</kbd> go on a screen; <kbd>Shift</kbd>+<kbd>Space</kbd>, <kbd>Page Up</kbd> and <kbd>←</kbd> go back. On a phone, Settings can make a tap turn the page.", ru = "Раздел назад или вперёд, документ назад или вперёд. С клавиатуры <kbd>Space</kbd>, <kbd>Page Down</kbd> и <kbd>→</kbd> листают экран вперёд; <kbd>Shift</kbd>+<kbd>Space</kbd>, <kbd>Page Up</kbd> и <kbd>←</kbd> — назад. На телефоне в Настройках можно листать касанием." }
"tour:runhead:title" = { en = "Where am I?", ru = "Где я?" }
"tour:runhead" = { en = "A tap on the text brings the running head: the paragraph’s reference, which opens the contents at this paper; the paper and its author; Home and Settings. It goes with the next tap.", ru = "Касание текста показывает колонтитул: номер абзаца, открывающий содержание на этом документе; документ и его автора; Домой и Настройки. Следующее касание убирает его." }
"tour:listen:title" = { en = "Listen", ru = "Слушать" }
"tour:listen" = { en = "Merritt Horn reads the book, from any paragraph; the page follows the voice. Your browser’s own voice can read it too, and the translations.", ru = "Книгу читает Мерритт Хорн, с любого абзаца; страница следует за голосом. Голос вашего браузера тоже может читать — и переводы." }
"tour:notes:title" = { en = "Notes, and the 1955 readings", ru = "Примечания и разночтения 1955 года" }
"tour:notes" = { en = "A small raised number is a study note; a tiny ring marks words the 1955 printing had otherwise. Tap either to read it in a card.", ru = "Маленькая приподнятая цифра — примечание; крошечное кольцо отмечает слова, которые в издании 1955 года читались иначе. Нажмите — и откроется карточка." }
"tour:gear:title" = { en = "Settings", ru = "Настройки" }
"tour:gear" = { en = "Typeface, size and theme; what is shown beside the text; Russian translations under each paragraph, or side by side in Compare; the voice and its speed. Kept in this browser only.", ru = "Шрифт, размер и тема; что показывать рядом с текстом; русские переводы под каждым абзацем или бок о бок в режиме сравнения; голос и его скорость. Хранится только в этом браузере." }
"tour:cloud:title" = { en = "Read offline", ru = "Читать офлайн" }
"tour:cloud" = { en = "The whole site can be kept in this browser, to read with no connection, and installed as an app. This sign shows whether a copy is kept here, and opens the tab where that is done.", ru = "Весь сайт можно сохранить в этом браузере, чтобы читать без связи, и установить как приложение. Этот значок показывает, есть ли здесь копия, и открывает вкладку, где это делается." }
"tour:help:title" = { en = "Help", ru = "Справка" }
"tour:help" = { en = "All of this, with every key and every setting, is in Help, and the tour can be taken again from there. Enjoy the book.", ru = "Всё это, со всеми клавишами и настройками, есть в Справке; оттуда же можно повторить экскурсию. Приятного чтения." }
"The Help page is read online." = "Страница Справки читается онлайн."
