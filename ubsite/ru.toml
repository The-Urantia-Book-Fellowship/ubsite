"charts:units" = { en = "Time, distance, speed, weight and temperature in the papers’ units, from the Paradise-Havona standard day to the gradant, and in the familiar ones: type in any row, and every other follows.", ru = "Время, расстояние, скорость, вес и температура в единицах документов, от стандартного дня системы Рай-Хавона до граданта, и в привычных: введите число в любую строку, и все остальные пересчитаются." }
"Unit conversions" = "Пересчёт единиц"
"units:lead" = { en = 'The units of time, distance, speed, weight and temperature the papers define or use, beside the familiar ones. Type a number in any row, and every other row of its table follows. A unit the papers define is given in their words, with its paragraph; <span class="ucab">≈</span> marks one they give as about or almost, its figure taken as written. The year is the papers’ own, of 365¼ days (<a href="/57:0.1">57:0.1</a>).', ru = 'Единицы времени, расстояния, скорости, веса и температуры, которые определяют или упоминают документы, рядом с привычными. Введите число в любую строку, и все остальные строки её таблицы пересчитаются. Единица, которую определяют документы, дана их словами, в переводе Фонда Урантия, со ссылкой на абзац; знак <span class="ucab">≈</span> отмечает ту, что дана как «около» или «почти», и её число взято как написано. Год — тот, что в документах: 365¼ дня (<a href="/57:0.1">57:0.1</a>).' }
