"kept:in" = { en = 'Kept in this browser and with your account, <b class="acctname"></b>. <a class="acctlink" href="/account">Account</a>', ru = 'Хранятся в этом браузере и вместе с вашей учётной записью, <b class="acctname"></b>. <a class="acctlink" href="/account">Учётная запись</a>' }
"acct:out" = { en = 'Sign in, and your settings, your bookmarks and the place you last read are kept with your account, and follow you from one device to another. Reading needs no account.', ru = 'Войдите — и ваши настройки, закладки и место, где вы читали в последний раз, будут храниться вместе с вашей учётной записью и следовать за вами с устройства на устройство. Чтобы читать, учётная запись не нужна.' }
