"home:t:bible" = { en = "the King James Version and the Russian Synodal, side by side", ru = "Библия короля Якова и Синодальный перевод, рядом" }
"lists:bible" = { en = '<a href="/bible">The Bible</a> — the King James Version, with its translators’ marginal notes, and the Russian Synodal Bible, side by side, a verse to a row; every Bible reference of the study notes leads to it.', ru = '<a href="/bible">Библия</a> — Библия короля Якова, с примечаниями переводчиков на полях, и Синодальный перевод, рядом, по стиху в строке; к ней ведёт каждая ссылка на Библию в примечаниях.' }
"help:bible:1" = { en = 'The <a href="/bible">Bible</a> is here whole in two versions, the King James Version and the Russian Synodal, a chapter to a page and a verse to a row: <a href="/bible/Gen/1">/bible/Gen/1</a> is Genesis 1, and <a href="/bible/Psa/104:1-2">/bible/Psa/104:1-2</a> opens Psalm 104 with those verses tinted. The addresses number the verses as the KJV does; where the Synodal numbers a verse otherwise (its Psalm 22 is the KJV’s 23), its own number stands in its line. Every Bible reference in a study note is a link to its verses, and with Paragraph previews on, shows them in a card.', ru = '<a href="/bible">Библия</a> здесь целиком в двух переводах, Библии короля Якова и Синодальном, по главе на страницу и по стиху в строке: <a href="/bible/Gen/1">/bible/Gen/1</a> — Бытие 1, а <a href="/bible/Psa/104:1-2">/bible/Psa/104:1-2</a> открывает Псалом 104 с выделенными стихами. Адреса нумеруют стихи как Библия короля Якова; где Синодальный перевод нумерует стих иначе (его Псалом 22 — это 23-й), в строке стоит его собственный номер. Каждая ссылка на Библию в примечании ведёт к её стихам, а при включённом предпросмотре абзацев показывает их в карточке.' }
"help:bible:2" = { en = 'Settings’ Texts tab, at its subtab The Bible, orders the two as its subtab The Urantia Book orders the book’s texts: either first, either hidden. With both shown, they stand in columns where the window has room and in a fold under each verse where it has not, and a tap on any fold opens them all. The Synodal’s eleven non-canonical books stand between the testaments, in Russian alone, and so do the verses it has and the KJV has not.', ru = 'Во вкладке «Тексты» в настройках подвкладка «Библия» упорядочивает оба перевода, как подвкладка «Книга Урантии» — тексты книги: любой может быть первым, любой можно скрыть. Когда показаны оба, они стоят в колонках, где окну хватает места, и в свёртке под каждым стихом, где не хватает; касание любой свёртки открывает их все. Одиннадцать неканонических книг Синодального перевода стоят между Заветами, только по-русски, как и стихи, которых нет в Библии короля Якова.' }
"help:bible:3" = { en = 'Typed into the search box, a reference goes straight to it, John 3:16 by the KJV’s names and numbers, Ин 3:16 or Пс 22 by the Synodal’s; words are found in the verses and notes of each version shown, a list to each, which Settings can leave out. A star after a verse is a note: a click or a tap opens it. The offline copy holds the KJV as it holds the book, and Settings’ Offline tab keeps the Synodal on the device too, as a download of its own.', ru = 'Ссылка, набранная в поле поиска, ведёт прямо к стиху: John 3:16 — по названиям и номерам Библии короля Якова, Ин 3:16 или Пс 22 — по Синодальным; слова ищутся в стихах и примечаниях каждого показанного перевода, отдельным списком для каждого, который можно убрать в настройках. Звёздочка после стиха — примечание: щелчок или касание открывает его. Офлайн-копия хранит Библию короля Якова, как хранит книгу, а Синодальный перевод можно сохранить на устройстве отдельной загрузкой во вкладке «Офлайн» в настройках.' }
"kjv:cited" = { en = "An orange dot at a verse’s end opens the paragraphs of the book whose study notes cite it, and the same dot marks a book or a chapter that has one: {v:,} verses so far, cited in {p} papers, growing as each paper’s notes are reviewed.", ru = "Оранжевая точка в конце стиха открывает абзацы книги, примечания к которым его цитируют, а такой же точкой отмечены книги и главы, где такие есть: пока стихов {v:,}, в {p} документах; их число растёт с каждым документом, примечания к которому проверены." }

