{# The six appendices in the volume's order: on /appendix and under the A-Z on /index. #}
<ol class="toc apps">
{% for a in apps %}
  <li><a href="/appendix/{{ a.letter }}"><b>{{ a.letter }}</b> {{ a.title }}</a><i>{% if a.n_events %}{{ t('{n:,} events', n=a.n_events) }}{% else %}{{ t('{n:,} entries', n=a.n_entries) }}{% endif %}</i></li>
{% endfor %}
</ol>
