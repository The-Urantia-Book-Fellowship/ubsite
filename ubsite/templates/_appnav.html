{# Across the top of each appendix: the way back to the index, and the other five. #}
<nav class="appnav" {{ ta('aria-label', 'Appendices') }}><a href="/index">{{ t('Index') }}</a> ·
  <a href="/appendix">{{ t('Appendices') }}</a>
  {%- for a in apps %} {% if a.letter == app.letter -%}
    <span class="l" title="{{ a.title }}" aria-current="page">{{ a.letter }}</span>
    {%- else -%}
    <a class="l" href="/appendix/{{ a.letter }}" title="{{ a.title }}">{{ a.letter }}</a>
    {%- endif %}{% endfor %}</nav>
