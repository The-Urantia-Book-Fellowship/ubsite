notes                = 346       # \fnst, the translator's
numbered_otherwise   = 2         # 31:10.22 (its 31:10.23) and 0:12.10 (its heading);
                                 # the rest it numbers otherwise it has not yet translated
labels_differ        = 0         # 29:4.27's 3. for our 4., mended in cc37b29
