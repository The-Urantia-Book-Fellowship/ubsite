# The translations beside the text (build/translation.py), each joined to our
# numbering.  Reported bands, as the index's are: ud is being written, and its
# counts move with each commit of it.  What holds hard is the structure: every
# address of each joined one to one onto ours, by tests/known-tr-numbering.tsv;
# its separators where ours are, but for tests/known-tr-separators.tsv; its
# list labels as ours, but for tests/known-tr-labels.tsv.
[translation.ud]
source_commit = "cc37b29"
measured_on   = "2026-10-26"
vs_lines             = 14595     # 14,586 of ours + the ten separators it numbers - 0:12.10,
                                 # which is a \usection, its Acknowledgment's heading
paragraphs           = 3579      # translated: Papers 0-40, 41 (to 3:10) and 43 (to 7:5) in part,
                                 # 195:0.1-3, 196:0.1-4, and 0:12.10; the rest empty, or
                                 # "Бла-бла..." in a skeleton paper's first
