# The offline copy (offline/, `make offline`), measured 2026-10-13 at press
# 5f95c31 and index 40cc439.  The counts are exact: every page the copy stores,
# every section's spoken text (the browser's voice reads offline), and the
# chunks: 197 papers, 27 index letters, 10 of spoken text, the misc pages, the
# shell, two databases and 11 files (13 until 2026-10-15, when the app's
# manifest, the touch icon and the two icons the manifest names left the copy,
# since they differ by host, and the burgundy tab icons came in, which
# the page chooses), and 13 since 2026-10-18, when the math font of the study
# notes came in with its licence.  The sizes are bands, since the index grows as
# it is edited.  One page more since 2026-10-19: the Bibliography.  One fewer
# since 2026-10-23, at index 5e357f6: the Zone of Infinity cites two paragraphs
# now, too few for a reading path.  One fewer again the same day, at index
# c0db98c: one headword fewer, two gone and one new.  One more since
# 2026-10-24: the page about the text API, kept with the address it is read at.
[offline]
measured_on = "2026-10-23"
pages       = 10285      # 1,626 sections, 4,735 headwords, 27 index letters, 20 more, 3,877 reading paths
paths       = 3877       # 2,057 headwords in book order, 1,820 of them by theme too
spoken      = 1626       # one to a section
chunks      = 417        # 396 with the SBL fonts (2026-10-19); 400 since every paragraph's
                         # reference stands in a .stk of its own (2026-10-20), 4 MB more of pages;
                         # 417 since the interface in Russian too (2026-10-25): the scripts'
                         # words, /l10n.js, EB Garamond's Cyrillic, two faces and their licence,
                         # and 13 more chunks of reading paths, 8% more of them to hold
                         # (404 with UB_BILINGUAL=0)
download_mb = [36.0, 52.0]   # gzipped, and so kept in the browser: 45.0 at measurement
raw_mb      = [160.0, 250.0] # unpacked: 198.2 at measurement; 218.2 with the Russian (2026-10-25)

