# The three source repositories.  These paths appear here and NOWHERE else in
# this project -- build/config.py is the only module that reads this file.
#
# The repos are MASTERS.  ubsite reads them and never writes to them; see
# build/readers/_io.py, tests/test_no_writes.py and `make paranoid`.

[press]
# The authoritative text.  Uversa Press 3rd edition.
path = "../urantia-uversa-press-claude"
tex  = "tex"
rev  = "worktree"          # or a git revision
# Where its commits can be seen: the footer links the commit id to <url>/commit/<sha>.
# The repository is PRIVATE (2026-10-06): the link opens for signed-in members of
# the organisation and is a 404 for everyone else -- linked anyway, by decision.
url  = "https://github.com/The-Urantia-Book-Fellowship/urantia-uversa-press"

[study]
# The British Study Edition.  Apparatus: footnotes, human sources, KJV, quiz,
# images.  NOTE: `urantia-study-edition-latest` is OLDER despite its name.
# This tree and ../translation/urantia-study-edition are independent clones of
# the same repo; the paragraph realignment of 2026-09-21 was applied HERE, so
# this is the one the build reads until it is committed and the other pulled.
# Read at a commit, as the index is, since 2026-10-18: its \fnst notes reach
# the site one paper at a time, through the reviewed copies in data/study/,
# each holding the hash of the note it was made from (build/study.py).
path = "../urantia-study-edition"
tex  = "tex"
rev  = "HEAD"

[index]
# The 2019 Uversa Press index, hand-corrected.  Read BY GIT REVISION, not the
# working tree: this repo is edited in another session, and a site build must
# never race an editorial edit.
path = "../index"
tex  = "tex"
rev  = "HEAD"
url  = "https://github.com/The-Urantia-Book-Fellowship/index"   # PRIVATE, as above

# The translations shown beside the text, a paragraph at a time (ROADMAP item
# 15, step 2; build/translation.py).  MASTERS like the others, read at a commit,
# since both are worked on: a translator's uncommitted paragraph never reaches
# the site.  Each is joined to OUR numbering, the press's, by a fixed list of
# its differences (tests/known-tr-numbering.tsv); what a reader is told about it
# is data/translations.toml.  The table's name is the translation's key, which
# a reader's Settings store: it never changes once deployed.
#
# Tigran's own, «Урантийские документы»: Papers 0 to 41 and more in part, with
# notes of his own.  GPL v3.
[ud]
path = "../ud"
tex  = "tex"
rev  = "HEAD"
url  = "https://github.com/tigran123/ud"

# Lila Dogim's, with Sergey Prokopov's corrections, as the Urantia Book Society of
# Greater New York publishes it (urantia.nyc): the whole book, no notes.  The
# site is the Fellowship's, and may show it (Tigran, 2026-10-26).
[urantia-ru]
path = "../urantia-ru"
tex  = "tex"
rev  = "HEAD"
url  = "https://github.com/tigran123/urantia-ru"

# The SRT Committee's reasons for each change to the 1955 text, which the
# Fellowship publishes and the printed preface sends readers to
# ("urantiabook.org/SRT" redirects to an essay that links here).  Not a
# repository: a web page, kept as a SNAPSHOT of its two tables, checked in at
# `path` and made only by `make srt-snapshot` (tools/srt/snapshot.py).  The
# build reads the snapshot, never the network; refreshing it is a reviewed diff.
[srt]
url  = "https://members.urantiabook.org/text-standardization-Urantia-Book"
path = "data/srt/considerations.html"

# Matthew Block's parallel charts of the human sources, one PDF per paper, as
# urantiabooksources.com publishes them, kept by ../explore-tools/block_fetch.py
# with a MANIFEST.tsv naming each chart's address, which is its version.  Not a
# repository, and a MASTER like those above.  The build reads the manifest
# alone: a paper's study notes are reviewed against its chart, data/study/NNN.toml
# names the chart reviewed, and a chart revised since fails the build until the
# notes are reviewed against it (build/study.py).  tools/study/ reads the PDFs.
# Its originals/ holds, by hand, the works themselves where a note was checked
# against one (Ellen G. White's, for Paper 1), with a MANIFEST.tsv of where
# each was downloaded from, and a LIBRARY.tsv of the works checked in Tigran's
# own copies, each with its page in his library and whether a reader who has
# not logged in can open it: the build reads LIBRARY.tsv, and the Bibliography
# links the page of each work that is public (build/study.py).
[block]
path = "../block-sources"

# TeX Live, for one file: Knuth's hyphen.tex, the patterns the press sets the
# book with (polyglossia `english` loads them, not hyph-en-us).  Not a
# repository and not read by the build: vendor/tex/hyphen.tex is a copy by
# value, and `make vendor-check` compares it with this tree's.  The file says
# of itself "NOT TO BE CHANGED IN ANY WAY", so a difference means a wrong tree.
[texlive]
path = "/usr/local/texlive/2026/texmf-dist"

# SQLite's own WebAssembly build, for one thing: searching the offline copy in
# the reader's browser (offline/, ubsite/static/sw.js), with the same FTS5,
# tokenizer and bm25 as the site.  A release zip from sqlite.org, named by its
# address and fixed by its digest: 3.53.4 of 2026-07-24.  Not a tree on this
# machine and not read by the build.  vendor/sqlite-wasm/ holds its two files
# by value, and the lock records this digest; a release cannot move, so
# `make vendor-check` holds our copy to the lock alone, and `make vendor-sync`
# fetches the zip only when this names another release.  Until 2026-10-16 it
# was unpacked by hand into ~/Software, and `make data` failed without it.
[sqlite_wasm]
url    = "https://sqlite.org/2026/sqlite-wasm-3530400.zip"
sha256 = "b38d042be415af040679804dbf66264c6e6ec324d79840c284f673c4f2a63c4d"

# The fonts a study note's Greek and Hebrew are set in, as the British Study
# Edition sets them and Tigran writes them (2026-10-19): SBL Greek 1.00 Build 010
# (2009-03-06) and SBL Hebrew 1.56a Build 016 (2010-12-15), John Hudson's, Tiro
# Typeworks, the latest the Society of Biblical Literature offers, from its fonts
# page (https://www.sbl-site.org/fonts), by address and digest.  Until then the
# device's own font drew them, and Georgia drew 1:7.6's θεὸς as θεο` ς.
#
# NOT OFL.  The SBL Font EULA, in each font's name table and at
# https://www.sbl-site.org/wp-content/uploads/2024/05/SBL_Font_End_User_License_Agreement.pdf:
# free for non-commercial use (2); embedded "in non-commercial electronic
# documents, including but not limited to web pages and e-books" (5);
# redistributed only unmodified, with its notices (3), never "any modified
# version", derivatives "in any format" being Tiro's (4).  So each is served as
# published, byte for byte: never subset, never made WOFF2.  build/fonts.py
# copies it into ubsite/static/fonts/ and fails on any other bytes.
[sbl_greek]
url    = "https://www.sbl-site.org/wp-content/themes/basket/fonts/bib-fonts/SBL_grk.ttf"
sha256 = "cbf8b1a87a4a311e2aa9b5b2995f83b23159fbe0ca9ca517d3fd43b5911e925a"

[sbl_hebrew]
url    = "https://www.sbl-site.org/wp-content/themes/basket/fonts/bib-fonts/SBL_Hbrw.ttf"
sha256 = "98eca8ecc97af984e205c282d6a0e994af41612029e49a223e85677b71cf9e99"

# The recordings.  Not repositories: no git, no revision.  Each is listed by
# file in data/audio/ with its size and SHA-256, and the build checks the
# directory against that list.
[audio.mh]
# Merritt Horn's reading of the whole book: one MP3 per section, 121 hours, as
# published on the Uversa Press DVD (2006): 128 kbps joint stereo, 44.1 kHz.
# Copied from the disc with the folder names lowercased (it mixes Paper005 and
# paper105); README-DVD.txt is the disc's own readme.  /Audio/Urantia/Urantia-
# MH-Audio is the same recordings re-encoded at 32 kbps mono, and is not used.
# A MASTER like the repos above -- read, never written.  pi5 holds an identical
# copy at the same path, which is what the site serves.
path  = "/Audio/Urantia/Urantia-MH-Audio-DVD"
label = "Merritt Horn"
kind  = "human"

[audio.ai]
# The AI voice: Higgs TTS 3 (Boson AI's Higgs Audio), cloned from a synthetic
# reference voice ("mature", var/tts/refs/higgs2_mature_clean.wav), made here
# on the 3090 by `make tts` (tools/tts/book.py), every chunk heard back by
# Whisper.  One MP3 per section, 64 kbps mono.  NOT a master: this project
# writes it, under var/, so the path is relative to the project, here and on
# pi5 alike; `deploy.sh --audio` copies it there.
#
# Boson's licence (Creator Use Grant, II-A(b)) requires the acknowledgment below
# "displayed prominently together with the content", and allows its name only as
# that acknowledgment, "not as the leading or primary name of any product"
# (IV(d)(i)) -- so the voice is called "AI voice", and the credit is shown
# wherever it is offered or plays.
path  = "var/audio/ai/higgs3_mature"
label = "AI voice"
kind  = "synthetic"
credit     = "This audio was created with Boson AI's Higgs Audio"
credit_url = "https://www.boson.ai/higgs-audio"
