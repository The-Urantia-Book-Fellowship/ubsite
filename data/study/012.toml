# F1, proposed: the word nebula in the astronomy of the day, the English
# counterpart of Tigran's Russian note here; Baker p. 123
[[note]]
at = "12:1.12"
after = "a nebular family"
origin = "none"
credit = "block"
tex = '''\bibemph{Nebula} was still, in the astronomy of the day, the name of what are now called galaxies as well as of the clouds of gas and dust within our own: Baker's book of 1932, one of the sources of this paper, speaks of the ``great nebula'' in Andromeda as one of ``the external spiral systems'' (\cite{Baker1932}, p.~123), and the paper has both senses, a family of nebulae here that no superuniverse boundary divides, nebulae as ``physical universes in process of formation'' at \bibref[12:2.2]{p012 2:2}, and Andromeda, ``this far-distant nebula'', at \bibref[15:4.7]{p015 4:7}. Galaxies, the newer word, comes in at \bibref[12:2.3]{p012 2:3}.'''

# F2, proposed: the paper's distances beside the astronomy of the day's, and
# where that puts Andromeda; Baker p. 132
[[note]]
at = "12:1.14"
after = "twenty-five million light-years"
origin = "none"
tex = '''The distances are of the order of the astronomy of the day's. The nearest of the external galaxies, Andromeda and Triangulum, were then put ``of the order of a million light years'' away, and the most remote known 250 times farther (Baker~\cite{Baker1932}, p.~132); the book has the light of Andromeda leaving it ``almost one million years ago'' and the nebula ``outside the inhabited superuniverse'' (\bibref[15:4.7]{p015 4:7}), while ``the vast Milky Way starry system represents the central nucleus of Orvonton'' (\bibref[15:3.1]{p015 3:1}). Read with this paragraph, that sets Andromeda beyond the quiet zone of four hundred thousand light-years and about where the first outer space level begins, half a million beyond the grand universe, where, by \bibref[12:2.5]{p012 2:5}, nothing lives; I note only that \bibref[15:4.7]{p015 4:7} calls Andromeda ``very active'' in sun making, as this paragraph has the outer level all ``energizing forces''. Andromeda's distance today is 2.5 million light-years, the distances of the 1930s having been doubled by Baade's revision of 1952 (see the note at \bibref[12:4.14]{p012 4:14}).'''

# F3, carried: the edition's note, its spelling put right and Baker's page
# and words added
[[note]]
at = "12:2.2"
after = "or three nebulae"
origin = "1238dbb9ac2796c2"
credit = "block"
tex = '''That is galaxies. The unaided eye can see only two galaxies in the Northern Hemisphere: M31 (Andromeda) and M33 (Triangulum). These very objects are named in Baker's book (\cite{Baker1932}, p.~123: ``the nearest of the external spiral systems, and the only ones visible to the naked eye''), which served as one of the sources of this paper. The Large and Small Magellanic Clouds are visible only in the Southern Hemisphere and are considered to be satellites of our Galaxy. Therefore, the Andromeda galaxy is situated \bibemph{outside the borders of the superuniverse of Orvonton}. See also \bibref[15:4.7]{p015 4:7}.'''

# F4, added: Block's finding, Baker p. 133
[[note]]
at = "12:2.2"
after = "your present instruments"
origin = "none"
credit = "block"
tex = '''Baker~\cite{Baker1932}, p.~133: ``Thirty million galaxies inhabit the region of space around us which is open to inspection with present telescopes, a region five hundred million light years across. Doubtless many more lie hidden behind the dark clouds of our own system.'' Here they are ``millions upon millions'', and the millions beyond the instruments' range are the next paragraph's.'''

# F5, carried: the edition's note, with Baker's words and the telescope's
# history put right
[[note]]
at = "12:2.3"
after = "future, new telescopes"
origin = "1b1ecb80fcf340aa"
credit = "block"
tex = '''According to Baker~\cite{Baker1932}, p.~133, the ``new'' telescope is the 200-inch, then only projected: ``The projected 200-inch telescope will show additional multitudes; it should in fact bring into view more than 200 million galaxies, if their distribution continues as we now observe it'', where the paper says no less than 375 million. It was paid for by the Rockefeller Foundation's grant of 1928, built on Palomar Mountain from 1936, and dedicated on June 3, 1948, as the Hale Telescope.'''

# F6, proposed: the name island universes, from Hubble's own note of 1936,
# the English counterpart of Tigran's Russian note here
[[note]]
at = "12:2.3"
after = "island universes"
origin = "none"
tex = '''\bibemph{Island universes} was the nineteenth century's name for the nebulae taken to be stellar systems like our own, and Hubble in 1936 could already write of it as a name with a history: it ``was used in von Humboldt's \emph{Kosmos} (Vol.~III [1850]), presumably for the first time'', as \emph{Weltinseln}, ``world islands'' in the English translation of 1855, and ``the transition to `island universes' is an obvious step, but the writer has not ascertained the first use of the term'' (\cite{Hubble1936}, p.~25, note). Whether the spirals were such, Shapley and Curtis debated in 1920, and the Cepheids Hubble found in Andromeda in 1923 and 1924 settled; by 1932 Baker writes of ``external galaxies''. The paper takes the question up again for some of them: ``formerly believed to be in outer space'', they are on Orvonton's fringe (see the next note).'''

# F7, added: Block's finding, Baker p. 136
[[note]]
at = "12:2.3"
after = "galactic system of Orvonton"
origin = "none"
credit = "block"
tex = '''Baker~\cite{Baker1932}, p.~136: ``But the boundaries of our supergalaxy are not yet definitely surveyed. To the galactic system proper we have already added tentatively the Magellanic Clouds; and we may presently find cause for annexing the Andromeda and Triangulum spirals and other neighboring systems. Natural lines of cleavage will appear with a more complete understanding of the motions of these systems.'' The paper annexes the ``other neighboring systems'' to Orvonton, the Magellanic Clouds perhaps among them (next note), but not Andromeda, which it keeps outside (\bibref[15:4.7]{p015 4:7}); Baker's ``motions'' become its nebulae ``traveling along with us''.'''

