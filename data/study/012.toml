after = "relative cosmic reality"
origin = "none"
tex = '''Which seven the paper does not say, nor does the book anywhere: ``all seven levels of universe reality'' at \bibref[4:4.5]{p004 4:5} and \bibref[13:4.7]{p013 4:7} are no more enumerated than here. The one place the book lists seven levels of reality is \bibref[106:0.2--9]{p106 0:2}, incomplete finites, maximum finites, transcendentals, ultimates, coabsolutes, absolutes and infinity, and its author calls them ``convenient compromise symbolizations of the present universe age and for the mortal perspective'' (\bibref[106:0.10]{p106 0:10}); whether these are the seven meant, the book does not say. The Foreword's seven at \bibref[0:1.3]{p000 1:3} are levels on which Deity functions, another thing; its levels of reality are three, finite, absonite and absolute (\bibref[0:1.11--13]{p000 1:11}).'''

# F30, proposed: Tigran's Russian note here, in English, with a physicist's
# sense of the words added (question 2)
[[note]]
at = "12:8.10"
after = "conditioned by mind"
origin = "none"
tex = '''In what sense is matter modified by motion? Here lies a great riddle. One sense is the physicist's: in relativity the source of gravitation, and what responds to it, is not mass alone but energy and momentum together, so that a body's gravitational action and response do depend on its motion, and a hot gas weighs more than a cold one; but the paragraph may mean more than this. And conditioned by mind: here the book glosses itself. ``Mind universally dominates matter'' (\bibref[42:12.15]{p042 12:15}); the energy that answers linear gravity answers at the same time ``the manipulations of the Universe Power Directors and their associates'' (\bibref[16:4.12]{p016 4:12}), the living ``power-control creatures of the Third Source and Center'' who segregate, direct and intensify the physical energies (\bibref[9:3.6]{p009 3:6}, \bibref[29:4.20]{p029 4:20}), as he himself is ``the manipulator of energy'' (\bibref[9:3.5]{p009 3:5}); and Paper 116 speaks of ``the energy-controlling mind'' (\bibref[116:5.15]{p116 5:15}). Nearer home, the matter of a living body goes where its mind sends it, up the stairs against gravity: the exception the paragraph makes is seen in every creature that moves. Antigravity is not it: ``it is not the action of mind'' (\bibref[9:3.3]{p009 3:3}).'''

# F31, added: Block's comparison, Overstreet pp. 173-174, with the figure's
# own source, Plato, from Jowett
[[note]]
at = "12:8.16"
after = "spirit substance"
origin = "none"
credit = "block"
tex = '''The figure is Plato's cave, \emph{Republic}~VII, 514a--515a, in Jowett's words: ``Behold! human beings living in an underground den, which has a mouth open towards the light and reaching all along the den; here they have been from their childhood, and have their legs and necks chained so that they cannot move \ldots\ Above and behind them a fire is blazing at a distance \ldots\ Like ourselves, I replied; and they see only their own shadows, or the shadows of one another, which the fire throws on the opposite wall of the cave'' (\cite{Plato}, p.~214). Overstreet retells it, with the light coming in at the mouth and the figures walking on a wall, and sums it up: ``That was Plato's account of life: a self-deluding commerce with shadows'' (\cite{Overstreet}, pp.~173--174). Plato's shadows are cast by things carried past the fire; the paper's are cast by mind in the light of spirit, ``but this does not invalidate the reality of matter-energy'' (\bibref[12:8.15]{p012 8:15}).'''

# F32, added: Block's finding, Overstreet p. 100
[[note]]
at = "12:9.1"
after = "nonmaterial value"
origin = "none"
credit = "block"
tex = '''Overstreet~\cite{Overstreet}, p.~100: ``Somehow, in all this, the significant destiny of man begins dimly to be seen---only dimly, indeed, for the ultimate destiny is doubtless beyond us. But dimly we can see man, the curious dreamer of dreams, casting his dreams ahead of him---catching up to them---and again casting them ahead.'' Here the dreams are ``new and spirit goals'', and the catching up a response to their ``cosmic allurements''.'''

# F33, added: Block's finding, Overstreet pp. 30, 32-33 and 38
[[note]]
at = "12:9.2"
after = "single contact"
origin = "none"
credit = "block"
tex = '''Three of Overstreet's illustrations in one paragraph (\cite{Overstreet}). Richard Jones, met once with a toothache and judged ``a sulky person not worth knowing'': ``If, however, you insist that, for yourself, a single contact with an individual is enough, you may persist in holding to your initial judgment \ldots\ Obviously you come to know the real individual only as you know him from many points of view'' (pp.~32--33). Music: ``Music is mathematical physics. Unless one knows mathematical physics one cannot know music \ldots\ He will see a whole range of figures, each figure indicating a tone's vibrations. `But where is the music?' he might ask'' (p.~30). And the telephone: to hold ourselves to exact knowledge alone ``would be---following Eddington once more---like supposing that the numbers attached to the names of telephone subscribers gave an adequate account of each subscriber'' (p.~38). The paper adds love as the secret, and the subscriber's \bibemph{character}.'''

# F34, proposed: Eddington's essay of 1925 behind both of Overstreet's similes
[[note]]
at = "12:9.2"
after = "concerning his character"
origin = "none"
tex = '''Both similes are Eddington's before they are Overstreet's, from his essay of 1925 on what exact science can and cannot know (\cite{Eddington1925}). Of the pointer readings physics measures: ``our exact knowledge is of the readings, not of the qualities. The former have as much resemblance to the latter as a telephone-number has to a subscriber'' (p.~199). Of music: ``The theory of music starts as though we were about to build up a science every whit as exact as physics \ldots\ But it is unimaginable that any system of measurements could be correlated to tune in such a way that knowledge of these measurements would be accepted as equivalent to knowledge of tune'' (p.~201). And of the subscriber, ``an entity with various aspects; he is (1) a number, (2) a plug-hole, (3) a voice, and even (4) a human being'', whom the operator may dissect into digits, ``but we cannot analyse a human being into four parts corresponding to the digits of his telephone number'' (p.~202).'''

# F35, carried: the edition's note, its grammar smoothed
[[note]]
at = "12:9.3"
after = "Mathematics"
origin = "3cf30553d33d9cc8"
tex = '''Mathematics is a creation of the material mind, just as morontia mathematics corresponds to the morontia type of mind: see \bibref[112:1.11]{p112 1:11}.'''

# F36, added: Block's finding, Overstreet pp. 59-60
[[note]]
at = "12:9.3"
after = "liquid water"
origin = "none"
credit = "block"
tex = '''Overstreet~\cite{Overstreet}, pp.~59--60, on emergent evolution, ``the third alternative'' between a wholly predictable life and an uncontrollable one: ``The basic idea is that in new combinations there is something more than the additive result, or the mere sum \ldots\ Hydrogen and oxygen brought together in the correct proportions eventuate in a fluid called water. Water, however, is not simply the sum of hydrogen and oxygen. It is something qualitatively new, something that cannot be found by the most searching examination of the gas, hydrogen, nor of the gas, oxygen. No amount of previous knowledge of the atomic structure of hydrogen and oxygen could, apparently, give a knowledge of this peculiar fluid that results from combining the two gases.'' His note refers the reader to Lloyd Morgan's \emph{Emergent Evolution} (1923). The paper's ``superadditive'' is his ``more than the additive result'', and its mathematics, philosophy, physics and chemistry his ``previous knowledge''.'''

# F37, proposed: the example's pedigree, Mill 1843 and Lewes 1875
[[note]]
at = "12:9.3"
after = "mechanistic cosmology"
origin = "none"
tex = '''The example is older than emergent evolution. Mill made water the type of a result that is not the sum of its causes: ``The chemical combination of two substances produces, as is well known, a third substance with properties entirely different from those of either of the two substances separately, or of both of them taken together. Not a trace of the properties of hydrogen or of oxygen is observable in those of their compound, water'' (\cite{Mill}, p.~426). Lewes, who gave such results the name \bibemph{emergent}, ``unlike its components in so far as these are incommensurable'' (\cite{Lewes}, p.~369), took the same liquid: ``This emergent liquid is not a third thing super-added to the two gases; it is these two under a new form'' (p.~130). Mill's own moral was a logician's: that chemistry, for this reason, is not a deductive science, as mechanics is.'''

# F38, added: Block's finding, Overstreet p. 39, with the chapter it closes
[[note]]
at = "12:9.5"
after = "mechanistic materialism"
origin = "none"
credit = "block"
tex = '''The three bondages are the three targets of Overstreet's second chapter, ``A False Way of Thinking: The Fallacy of Abstraction'' (\cite{Overstreet}, pp.~27--41), in its order: abstraction, ``Knowledge is abstract when something has been drawn away from the fulness of its reality and made to stand by itself'' (p.~33); exactness, in his question ``Is Exact Knowledge the Only Kind of Knowledge?'', which is to say mathematics (pp.~37--38); and ``Materialism was the view which reared this falsity of abstraction into a philosophy of life'' (p.~39).'''

# F39, added: Block's finding, Overstreet p. 107
[[note]]
at = "12:9.6"
after = "personality identity"
origin = "none"
credit = "block"
tex = '''Overstreet~\cite{Overstreet}, p.~107, of the psychological individual: ``What is most characteristic of him is that he is, as it were, nucleated. What I call my self is the central reality which I carry around. Everything that comes within my experience moves, so to speak, around that nucleus of selfhood \ldots\ Sometimes the nucleus breaks up, and we have a multiple personality. When that happens there is not a proper individual, but something weak, ineffective, and torn to pieces.'' The paper makes the nucleus spirit, and the breaking up the self's usurping of it.'''

