# F10, added: Block's finding, Overstreet pp. 109-110
[[note]]
at = "12:3.12"
after = "noncomputable"
origin = "none"
credit = "block"
tex = '''Overstreet~\cite{Overstreet}, pp.~109--110, of ``the psychological individual'': he ``is a significant form of reality. He is not lightly to be brushed aside. If indeed he seems to fall outside the computabilities of the mechanical world, there may be a reason for that. He may be of an order of reality not reducible to the limited regularities of physical existence. He may demand for his formulation a higher kind of calculus as yet undiscovered.'' Here the circuit is recognized and nothing responsive to it measured, the researchers of \bibref[12:3.7]{p012 3:7} having computed the other three.'''

# F11, added: Block's finding, Baker pp. 136-137
[[note]]
at = "12:4.1"
after = "the center of gravity"
origin = "none"
credit = "block"
tex = '''Baker~\cite{Baker1932}, pp.~136--137: ``The great galaxies and supergalaxies are no more fixed in position than are their individual stars, or the planets that we may imagine revolving around their stars. Everything in the physical universe, so far as we know, is in motion.'' The paper keeps everything in motion and adds the one exception, for which Baker's physics has no place.'''

# F12, added: Block's comparison, Jeans pp. 214-215, checked in Tigran's copy
[[note]]
at = "12:4.12"
after = "all pervaded space"
origin = "none"
credit = "block"
tex = '''Jeans~\cite{Jeans1934}, pp.~214--215, gives the two pictures of the receding nebulae in turn. The first is an explosion: ``When a shell bursts on a battlefield the fragments travel at different speeds, those which travel fastest also travelling farthest \ldots\ This is exactly the law of the receding nebulae, and makes it look as though, at some instant in the past, the universe had suddenly burst into fragments.'' The second is straws on a river: ``the nebulae are not moving through space, but with space---they are straws shewing us in what way the currents of space are flowing, and the law that speed is proportional to distance suggests that space is expanding uniformly. Probably the latter explanation is the best, because we now think that space is curved, and round, and finite in amount---rather like the surface of a balloon.'' The paragraph rejects the first picture, the ``outward flight at ever-increasing velocities'', for the second, ``the present outward and uniform expansion of the physical creations of all pervaded space'', and makes it a breath.'''

# F13, carried: the edition's note, its figures corrected (525 for 522; Hubble's
# own values; 66.93 for 6,93) and brought up to date
[[note]]
at = "12:4.14"
after = "million light-years"
origin = "aec406cce35b3b78"
tex = '''The value of the Hubble constant given in the text, a hundred miles a second for every million light-years, is about 525\,km/s/Mpc, close to the values Hubble himself found: 558 with Humason in 1931 (\emph{Astrophysical Journal} 74, 43) and 526 in \emph{The Realm of the Nebulae} (1936). Hubble's distances rested on the dependence between the period and the luminosity of the variable stars called Cepheids. The revision of the zero point of this dependence by Walter Baade in 1952 doubled the distances and halved the constant; by 1956 Humason, Mayall and Sandage had 180\,km/s/Mpc (\emph{Astronomical Journal} 61, 97), and the modern values are smaller still: $67.4\pm0.5$ from the cosmic microwave background (Planck, 2018) and $73.0\pm1.0$ from Cepheids and supernovae (Riess and others, 2022), a disagreement, the ``Hubble tension'', that is itself a subject of research.'''

# F14, added: Block's finding, Baker pp. 137-139; and what the 200-inch found
[[note]]
at = "12:4.14"
after = "thirty thousand miles a second"
origin = "none"
credit = "block"
tex = '''Baker~\cite{Baker1932}, p.~137: ``If the lines in the spectrum are displaced from their normal positions toward the violet, the star is approaching; if they are displaced toward the red, it is receding; and the amount of the displacement reveals the speed of approach or recession, in miles a second.'' And pp.~138--139: ``With allowance for this, Hubble and Humason find that the velocity of recession of the external systems increases at the rate of about a hundred miles a second for every million light years increase in distance. As the extreme, thus far, a member of a great cluster of galaxies in Leo at the distance of a hundred million light years exhibits a velocity of recession of 12,000 miles a second. Are these velocities to be taken literally? \ldots\ It remains for the future to produce an explanation of these motions that will be acceptable to all.'' The paper's ``more than'' a hundred, and its thirty thousand miles a second to come, extend Baker's rate; with the 200-inch telescope Humason reached, by 1956, a redshift of a fifth in the Hydra cluster, some 60,000 kilometres or 37,000 miles a second (Humason, Mayall and Sandage, \emph{Astronomical Journal} 61, 97).'''

# F15, carried: the edition's note, the book's title, chapter and page put
# right and Eddington's words added
[[note]]
at = "12:4.14"
after = "time-space distortions"
origin = "e74e5b87dc407e46"
tex = '''This possibility was pointed out by Eddington in 1920, in \emph{Space, Time and Gravitation}, chapter~X, ``Towards Infinity'' (\cite{Eddington1920}, p.~161): in de Sitter's world natural phenomena are slowed at great distances, so that ``the vibrations of an atom are slower, and its characteristic spectral lines will appear displaced to the red. We should generally interpret this as a Doppler effect, implying that the nebula is receding \ldots\ but it is also possible that the interpretation of spectral displacement as a receding velocity is erroneous; and the effect is really the slowing of atomic vibrations predicted by de Sitter's theory.'''''

# F16, added: Block's finding, Baker p. 71
[[note]]
at = "12:4.16"
after = "equilibrant of gravity"
origin = "none"
credit = "block"
tex = '''Baker~\cite{Baker1932}, p.~71, of the globular clusters: ``One of nature's devices for compensating gravitation, which by itself might reduce our complex system of stars to a single great lump, is to set the celestial bodies in motion. The centrifugal effect of the rotation of the globular cluster offsets the gravitational urge toward the center, resulting in a stable structure that may well endure as long as its individual stars.'' The paper makes a general principle of the device, with space as the other complement.'''

# F17, proposed: the Paradise-Havona day, 14:1.12
[[note]]
at = "12:5.1"
after = "arbitrarily so recognized"
origin = "none"
tex = '''The Paradise-Havona standard day is the time the spheres of the inner Havona circuit take to go once around Paradise, ``just seven minutes, three and one-eighth seconds less than one thousand years of the present Urantia leap-year calendar'' (\bibref[14:1.12]{p014 1:12}), which the book sets beside Psalms~90:4 and 2~Peter~3:8, a day as a thousand years; it is the standard of the seven superuniverses (\bibref[14:1.13]{p014 1:13}).'''

# F18, proposed: Tigran's Russian note here, in English (question 1)
[[note]]
at = "12:5.3"
after = "is Paradise area"
origin = "none"
tex = '''Area, and not place: it is precisely the area of Paradise that is said to be nontemporal. Is this related in some way to a property of phase space, in which there is no distance between two points, while one may well speak of the area of a triangle with its vertices at three such points? It is just this area that figures, strangely, in the evolution propagators of quantum mechanics when it is reformulated in terms of Wigner functions.'''

# F19, proposed: the English counterpart of Tigran's Russian note here, 130:7.6
[[note]]
at = "12:5.6"
after = "levels of time cognizance"
origin = "none"
tex = '''Three levels of the cognizance of time, where there are seven conceptions of space: ``There are seven different conceptions of space as it is conditioned by time. Space is measured by time, not time by space'' (\bibref[130:7.6]{p130 7:6}); and the first of the three, time as a succession of events, is the one that gives way as man ascends, when ``circular simultaneity'' displaces ``the linear sequence of events'' (\bibref[130:7.5]{p130 7:5}).'''

# F20, added: Block's finding, Overstreet pp. 91-99
[[note]]
at = "12:5.10"
after = "high order of self-realization"
origin = "none"
credit = "block"
tex = '''Overstreet~\cite{Overstreet}: the animal and the plant ``apparently cannot clearly prevision a future'' (p.~92), where man's needs ``admit a new element---a more or less clear previsioning of the future'' (p.~91); the ethics of the older ages ``were chiefly static: the ethics of obedience, decorum, safe behavior'' (p.~99); and of the three answers he weighs to the question how to live, Hedonism, Stoicism and Self-Realization (pp.~94--98), ``Stoicism is noble, perhaps, but it seems less than fully intelligent. May not the unintelligence lie in the fact that this endurance theory does not accept man on his essentially human level? It really accepts him on the animal level'' (pp.~96--97). The paragraph has his prevision, his static ethics ``just slightly superanimal'', and two of his three headings in one clause.'''

# F21, added: Block's finding, Overstreet p. 100; Tigran's Russian note here
# gives the source too
[[note]]
at = "12:5.11"
after = "cause of such events"
origin = "none"
credit = "block"
tex = '''Overstreet~\cite{Overstreet}, p.~100: ``Apparently, then, we have here discovered, on our human level, a highly significant process. Perhaps its greatest significance lies in the fact that it discloses a new kind of causality---causality by reference to the future. But the future does not yet exist. Thus it is, in a sense, causality by reference to the non-existent. Obviously such causality is not found in the physical world.'' The paper's word for it is \bibemph{cosmic}.'''

# F22, proposed: Overstreet's quantitative and qualitative, pp. 59-61, which
# Block's chart does not set here
[[note]]
at = "12:6.5"
after = "gravity-measurement sense"
origin = "none"
tex = '''The distinction is the one Overstreet~\cite{Overstreet} draws from the water that hydrogen and oxygen make (see the notes at \bibref[12:9.3]{p012 9:3}): ``While the quantitative result could have been predicted, namely, the sum of two atoms of hydrogen and one atom of oxygen, equalling, now, three atoms, the qualitative result could not have been predicted'' (p.~59); ``We can predict perfectly the quantitative sum of the combination, but we are powerless to predict the qualitative results'' (p.~60); and, once made, ``we can make the same combination millions of times and expect the same results'' (p.~61), which is the paragraph's ``partially predictable when subjected to critical observation''. Overstreet keeps the unpredictable for life and mind; the paragraph extends it to ``new associations of forces, either physical, mindal, or spiritual''.'''

# F23, carried: the edition's note, with Strong's words (pp. 39 and 42), the
# credit line correcting Block's quotation from the original
[[note]]
at = "12:7.2"
after = "habits of God"
origin = "545ea3ae034fce8c"
credit = "block"
corrects = '''``He does things the same way every time because he does things the best way every time'' for his ``He does the same things every time, because he does the best things every time'''''
tex = '''This statement is taken from Strong~\cite{Strong}, p.~39: ``God is perfectly free in a universe of laws, because they are the methods of his activities. Natural laws, so called, are the eternal habits of God. They are the same yesterday, to-day, and forever, because he is ever the same \ldots\ He does things the same way every time because he does things the best way every time.'' And p.~42: ``Indeed theology has unmistakably taught the arbitrariness of the divine will \ldots\ God's law, whether natural or moral, is absolutely reasonable. It is founded in the nature of things and is as far removed as possible from anything capricious, despotic, or dictatorial.'' The paragraph keeps the habits, the best way every time, and ``dictatorial and arbitrary''; nature as ``in a limited sense the physical habit of God'' is at \bibref[4:2.1]{p004 2:1}, and the spirit world as the habit of the Son at \bibref[7:0.4]{p007 0:4}.'''

# F24, added: Block's finding, Strong p. 39, the sonata; the credit line
# correcting his quotation from the original
[[note]]
at = "12:7.4"
after = "own voluntary acts"
origin = "none"
credit = "block"
corrects = '''``but rather that he is the master of both'' for his ``but rather the master of both'''''
tex = '''Strong~\cite{Strong}, p.~39, goes on: ``If a musician plays a sonata precisely the same way again and again, we do not infer that he is the slave either of the instrument or of the composition, but rather that he is the master of both. Absolute perfection means unvarying perfection.'' The paper's ``habit-bound slave'' answers the slave of the instrument; and on the same page Strong quotes the verse the paragraph ends with, ``with whom there is no variableness, neither shadow of turning''.'''

