# because" is the review's reading
[[note]]
at = "14:5.3"
after = "would be denominated fairness"
origin = "none"
tex = '''At \bibref[2:4.4]{p002 4:4} the sum is another: ``Eternal justice and divine mercy together constitute what in human experience would be called fairness.'' There mercy is one of the two terms; here righteousness stands in its place, perhaps because in Havona nothing waits to be forgiven: in the central universe ``fairness is self-evident in perfection'' (\bibref[10:6.17]{p010 6:17}).'''

# ---- 14:5.4

# F26, proposed: the seven psychic circles, 110:6.1
[[note]]
at = "14:5.4"
after = "the circles of progress in the human mind have been designated"
origin = "none"
tex = '''The seven psychic circles of \bibref[110:6.1]{p110 6:1}, counted as Havona's are, from the seventh inward to the first: ``Entrance upon the seventh circle marks the beginning of true human personality function. Completion of the first circle denotes the relative maturity of the mortal being.'''''

# F27, proposed: the same road in Paper 26, a section to each circuit
[[note]]
at = "14:5.4"
after = "admission to the Corps of the Finality"
origin = "none"
tex = '''Paper~26 goes over the same road, a section to each circuit, under the names of the secondary supernaphim who serve the pilgrims on it (\bibref[26:4.2--9]{p026 4:2}): the pilgrim helpers of the seventh circle (\bibref[26:5.1]{p026 5:1}), the supremacy guides of the sixth (\bibref[26:6.1]{p026 6:1}), the Trinity guides of the fifth (\bibref[26:7.1]{p026 7:1}), the Son finders of the fourth (\bibref[26:8.1]{p026 8:1}), the Father guides of the third (\bibref[26:9.1]{p026 9:1}), the counselors and advisers of the second (\bibref[26:10.1]{p026 10:1}) and the complements of rest of the first (\bibref[26:11.1]{p026 11:1}).'''

# ---- 14:5.5

# F28, proposed: Tigran's note in ud at this word, carried into English, with
# the word's model and the transport personalities of Havona, 26:3.9
[[note]]
at = "14:5.5"
after = "ensupernaphimed"
origin = "none"
tex = '''That is, carried within a transport supernaphim, as one is carried within a transport seraphim in the local creations: the word is made on \bibemph{enseraphimed} (\bibref[39:2.11--12]{p039 2:11}, \bibref[39:5.13--14]{p039 5:13}). The transport personalities of Havona are tertiary supernaphim, who ``stand ready to serve all who must come and go in the service of Havona, and who are not space traversers'' (\bibref[26:3.9]{p026 3:9}).'''

# ---- 14:5.11

# F29, proposed: where the endowment comes from, 36:5.9; 16:7.1
[[note]]
at = "14:5.11"
after = "a part of the inborn and divine endowment"
origin = "none"
tex = '''It is the fourth of the seven adjutant mind-spirits: ``The spirit of knowledge---the curiosity-mother of adventure and discovery, the scientific spirit'' (\bibref[36:5.9]{p036 5:9}); and ``scientific curiosity'' is one of the three ``inalienables of human nature'', with moral intuition and spiritual insight (\bibref[16:7.1]{p016 7:1}).'''

# ---- 14:6.6

# F30, proposed: the purpose of Havona as Paper 4 began with it, 4:0.2
[[note]]
at = "14:6.6"
after = "supreme parental satisfaction"
origin = "none"
tex = '''Paper~4 opened with this: ``the purpose in creating the perfect central universe of Havona was purely the satisfaction of the divine nature. Havona may serve as the pattern creation for all other universes and as the finishing school for the pilgrims of time on their way to Paradise; however, such a supernal creation must exist primarily for the pleasure and satisfaction of the perfect and infinite Creators'' (\bibref[4:0.2]{p004 0:2}). The section is that sentence drawn out, for seven orders of beings in turn.'''

# ---- 14:6.13

# F31, proposed: the Eternal Son's seven bestowals and the first Michael's,
# 7:5.5-9, with Paper 7's note there
[[note]]
at = "14:6.13"
after = "the spirit and technique of the bestowal ministry"
origin = "none"
tex = '''The seven bestowals of \bibref[7:5.5--9]{p007 5:5}: ``Long, long ago the Eternal Son bestowed himself upon each of the circuits of the central creation'', not as an ascender or a Havoner, ``He existed as himself''; and the first-born Michael afterwards ``literally passed through the circuits of the central universe'' with the pilgrims, in the days of Grandfanda. See the note at \bibref[7:5.9]{p007 5:9}.'''

# ---- 14:6.15

# F32, proposed: John 1:1, by Paper 6's note at 6:1.3
[[note]]
at = "14:6.15"
after = "the Son is the Word of the Father"
origin = "none"
tex = '''John~1:1: ``In the beginning was the Word, and the Word was with God, and the Word was God'', which \bibref[6:1.3]{p006 1:3} says would have been the truth had it been written of the Eternal Son; see the note there.'''

# ---- 14:6.17

# F33, proposed: Tigran's note in ud at these words ("That is, with Havona
# itself"), carried into English with 8:1.7
[[note]]
at = "14:6.17"
after = "absolute coexistence with this divine achievement"
origin = "none"
tex = '''That is, with Havona itself: ``The Infinite Spirit eternalizes concurrently with the birth of the Havona worlds, this central universe being created by him and with him and in him'' (\bibref[8:1.7]{p008 1:7}).'''

# ---- 14:6.23

# F34, proposed: the Supreme in Havona, 0:7.7, 0:8.10
[[note]]
at = "14:6.23"
after = "the spiritual reality of the Supreme Being"
origin = "none"
tex = '''The Foreword: ``God the Supreme in Havona is the personal spirit reflection of the triune Paradise Deity'' (\bibref[0:7.7]{p000 7:7}). His other phase, the power of the Almighty, is evolving in the superuniverses, and the two are one: ``The Almighty Supreme, evolving on the value-level of nonpersonal activities, and the spirit person of God the Supreme are one reality---the Supreme Being'' (\bibref[0:8.10]{p000 8:10}).'''

# ---- 14:6.32

# F35, proposed: the stages of a Creative Spirit's career, 17:6.3-10
[[note]]
at = "14:6.32"
after = "secure their prepersonal training"
origin = "none"
tex = '''The stages of a Creative Spirit's career are at \bibref[17:6.3--10]{p017 6:3}. This is the second, ``Preliminary Creatorship Training'', which runs with her future consort's own, when she ``becomes group conscious of destiny'' (\bibref[17:6.4]{p017 6:4}); she is not yet a person, and becomes one only at the fourth (\bibref[17:6.7]{p017 6:7}).'''

# ---- 14:6.33

# F36, proposed: Tigran's note in ud at "sponsors", carried into English: the
# confirmation at the end of the local universe career, 30:4.21
[[note]]
at = "14:6.33"
after = "jointly sponsors with an associated Creator Son"
origin = "none"
tex = '''The sponsoring is at the end of the local universe career: before leaving for the superuniverse the mortals of time ``are recipients of spirit confirmation from the Creator Son and the local universe Mother Spirit'' (\bibref[30:4.21]{p030 4:21}).'''

# ---- 14:6.36

# F37, proposed: Majeston, 17:2.2-5; why the Daughter Spirits do not return,
# 34:4.7
[[note]]
at = "14:6.36"
after = "personalized in Majeston on Paradise"
origin = "none"
tex = '''Majeston is ``the reflectivity chief and Paradise center of all the work of the forty-nine Reflective Spirits'', personalized when the last of them had appeared: ``the first supreme creative act of the Supreme Being'' (\bibref[17:2.2--5]{p017 2:2}). The Daughter Spirits are not likely to return because a Universe Mother Spirit ``never leaves the local universe headquarters world'' (\bibref[34:4.7]{p034 4:7}).'''

# ---- 14:6.38

# F38, proposed: attained, not found: 26:6.2-3, 56:6.4, 16:3.19
[[note]]
at = "14:6.38"
after = "Here mortals attain pre-Paradise Deity—the Supreme Being"
origin = "none"
tex = '''Attain, but in this age not find. On the sixth circuit the pilgrims ``achieve a new realization of Supreme Divinity'', yet ``No personalized presence of Supremacy is perceptible to the ascenders'' (\bibref[26:6.2--3]{p026 6:2}); they achieve ``personality comprehension of the Supreme on the outer circuits of Havona, they do not actually find the Supreme Being as they are destined to find the Paradise Deities. Even the finaliters, sixth-stage spirits, have not found the Supreme Being'' (\bibref[56:6.4]{p056 6:4}). Meanwhile the Seventh Master Spirit ``functions in the place of the God of ascendant creatures in the matter of personal relationships'' (\bibref[16:3.19]{p016 3:19}).'''

# ---- 14:6.41

# F39, proposed: the school as the book's figure, 28:7.1, 14:5.9; the outer
# space levels, 12:1.14-16
[[note]]
at = "14:6.41"
after = "the primary schools of outer space"
origin = "none"
tex = '''The school is the book's standing figure for the ascent: the worlds about Uversa are ``the finishing schools of the universes of time, presenting the preparatory course for the seven-circuited university of Havona'' (\bibref[28:7.1]{p028 7:1}), and each Havona world is ``a veritable university of surprises'' (\bibref[14:5.9]{p014 5:9}). Here the whole scheme is moved outward a step, to the day when the outer space levels of \bibref[12:1.14--16]{p012 1:14} are peopled and theirs are the primary schools.'''
