# F17, proposed: the Eternals of Days, 18:2.1-3; why no two worlds are alike,
# 14:5.6
[[note]]
at = "14:3.3"
after = "the resident Eternal of Days"
origin = "none"
tex = '''\bibref[18:2.1--3]{p018 2:1}: the Eternals of Days ``number exactly one billion, one for each of the Havona spheres'', Supreme Trinity Personalities who ``function without rotation or reassignment'' and have developed their spheres ``entirely in accordance with their own personal ideas and ideals. They visit each other's planets, but they do not copy or imitate; they are always and wholly original'': which is why no two of the worlds are alike (\bibref[14:5.6]{p014 5:6}).'''

