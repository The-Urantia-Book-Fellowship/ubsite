origin = "none"
tex = '''Two verses are joined here. Psalms~90:4: ``For a thousand years in thy sight are but as yesterday when it is past, and as a watch in the night''; and 2~Peter~3:8: ``one day is with the Lord as a thousand years, and a thousand years as one day.'' The day is Peter's, the watch in the night the psalmist's. Sadler sets both verses at this paragraph (\cite{Sadler2003}, p.~341).'''

# F7, proposed: the arithmetic of the day; the other standard days, 46:1.2,
# 33:6.7, 15:7.2
[[note]]
at = "14:1.12"
after = "the present Urantia leap-year calendar"
origin = "none"
tex = '''The present calendar, the Gregorian, has 97 leap years in every 400, so that a thousand of its years average 365,242.5 days, or 31,556,952,000 seconds. Seven minutes, three and one-eighth seconds are 423.125 seconds, so the Paradise-Havona day is 31,556,951,576.875 seconds, that is 365,242 days, 11 hours, 52 minutes and 56.875 seconds: short of the thousand years by about one part in 75 million. The other standard days the book gives are Satania's, ``three days of Urantia time, less one hour, four minutes, and fifteen seconds'' (\bibref[46:1.2]{p046 1:2}); Nebadon's, ``eighteen days and six hours of Urantia time, plus two and one-half minutes'' (\bibref[33:6.7]{p033 6:7}); and Orvonton's, ``almost thirty days of Urantia time'' (\bibref[15:7.2]{p015 7:2}).'''

# ---- 14:1.14

# F8, proposed: what the book says of the dark gravity bodies elsewhere, 11:8.7
# and 12:1.10; the astronomers' dark matter of 1937, Zwicky pp. 218, 232, 238;
# the modern sense of the words (Planck 2018: 0.120 of cold dark matter against
# 0.0224 of ordinary matter, in the paper's units, 84%); the last sentence is
# the review's own reading (question 1)
[[note]]
at = "14:1.14"
after = "neither reflect nor absorb light"
origin = "none"
tex = '''Of what they are made the book says only what they are not: ``The dark gravity bodies encircling Havona are neither triata nor gravita, and their drawing power discloses both forms of physical gravity, linear and absolute'' (\bibref[11:8.7]{p011 8:7}); and of their mass, that with them the central universe outweighs all seven superuniverses (\bibref[12:1.10]{p012 1:10}). When this was written the astronomers' ``dark matter'' was ordinary matter that does not shine. Zwicky, who in 1937 found in the nebulae of the Coma cluster some 500 times the sun's mass for each sun's worth of light, against about 3 among the stars around the sun, meant by it ``cool and cold stars, macroscopic and microscopic solid bodies, and gases'', matter that dims the light passing through it (\cite{Zwicky}, pp.~218, 232). Matter that neither gives out, reflects nor absorbs light, and is known by its gravity alone, is what physics has since come to mean by the words, and the Planck measurements of 2018 make it about 84\% of all the matter there is. The paper's bodies are not that matter: they are a belt about Havona, ``unique in the master universe'' (\bibref[14:1.18]{p014 1:18}); but the two marks it gives them are the modern definition, and their preponderance of mass is the modern finding. How bodies that do not absorb light can hide what lies behind them the paper does not say. In physics as we have it, the only hold such a body has on light is its gravity, which bends it; the same paper of Zwicky's proposed a search for nebulae acting as gravitational lenses (p.~238).'''

# ---- 14:1.15

# F9, proposed: the alternation through the master universe, 14:1.3, 12:4.15,
# and its reason, 12:4.16; Paper 11's note at 11:7.9 points here
[[note]]
at = "14:1.15"
after = "These alternate directions of motion"
origin = "none"
tex = '''The alternation runs through the whole master universe: the ten circuits of Paradise and Havona clockwise (\bibref[14:1.3]{p014 1:3}), the inner belt of dark gravity bodies counterclockwise, the outer clockwise, the seven superuniverses counterclockwise, the first outer space level clockwise and the second counterclockwise (\bibref[12:4.15]{p012 4:15}). Of the reason \bibref[12:4.16]{p012 4:16} says: ``It is probable that these alternate directions of successive space processions of the universes have something to do with the intramaster universe gravity technique of the Universal Absolute, which consists of a co-ordination of forces and an equalization of space tensions.'' See the note at \bibref[11:7.9]{p011 7:9}.'''

# ---- 14:1.16

# F10, proposed: the outer belt's shape from the paragraph's own figures:
# 10,000 h high and a fifty-thousandth of that thick, h/5; with a figure,
# figures/dark-belts.svg, at Tigran's asking (2026-11-11): the belts as rings
# round Havona, and the cut through them
[[note]]
at = "14:1.16"
after = "fifty thousand times that of the transverse diameter"
origin = "none"
tex = '''On the plain reading of the figures they give the outer belt's shape. If the inner belt, a tube of three rings one within another, is $h$ high, the outer is $10,000h$ high, and its thickness, the transverse diameter, is a fifty-thousandth of that, $h/5$: a wall ten thousand times as high as the tube and a fifth as thick as the tube is high, standing on edge (``arranged perpendicularly'') across the plane in which the worlds revolve. \figure{dark-belts} The figure shows, at the top, the two belts as rings round Havona, the inner turning counterclockwise and the outer clockwise (\bibref[14:1.15]{p014 1:15}), and under it what a cut along the dashed line would show: the tube and the wall in their proportions, except for the wall's height, which is broken off; drawn whole, it would be ten thousand times the tube's. How far the belts lie from Havona and from each other the paper does not say.'''

