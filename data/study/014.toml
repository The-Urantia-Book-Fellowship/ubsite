tex = '''Paper~8 made the same concession when it told the origin of the Infinite Spirit and of Havona together: ``the Infinite Spirit testifies that, since he is eternal, so also is the central universe eternal. And this is the traditional starting point of the history of the universe of universes'' (\bibref[8:1.9]{p008 1:9}); ``we thus portray the sequential origin of the Third Source and Center as an interpretative condescension to the time-bound and space-conditioned mind of mortal creatures. The mind of man must have a starting point'' (\bibref[8:1.10]{p008 1:10}). Plato makes it too: of the eternal pattern one may speak with certainty, of the making of its copy we must ``accept the tale which is probable and enquire no further'' (\cite{PlatoTimaeus}, p.~449; 29d).'''

