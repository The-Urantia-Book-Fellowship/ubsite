after = "exactly one thousand basic chemical elements"
origin = "none"
tex = '''Against the hundred of the superuniverses: ``There are just one hundred distinguishable atomic materializations of space-energy in a dual universe; that is the maximum possible organization of matter in Nebadon'' (\bibref[42:7.4]{p042 7:4}); the architectural worlds have besides ``exactly one hundred forms of a unique energy organization called morontia material'' (\bibref[48:1.3]{p048 1:3}). The senses follow by multiplication: seven energies in seven phases of excitation, $7\times7=49$; and the range of the spirit orders, seventy to two hundred and ten, is from once to three times the seventy of the morontia senses.'''

# ---- 14:2.7

# F13, proposed: the rule of spirit gravity, 7:1.2-3; the four circuits, 12:3.1-5
[[note]]
at = "14:2.7"
after = "more fully spiritualized"
origin = "none"
tex = '''The rule is at \bibref[7:1.3]{p007 1:3}: ``Spirit realities respond to the drawing power of the center of spiritual gravity in accordance with their qualitative value, their actual degree of spirit nature''; nor does the pull weaken with distance: ``It does not decrease in accordance with the square of the distance of its transmission'' (\bibref[7:1.2]{p007 1:2}). This paragraph, the one before and the one after name three of the four absolute-gravity circuits of \bibref[12:3.1--5]{p012 3:1}, those of Paradise, of the Son and of the Spirit; the fourth is the personality gravity of the Father.'''

# ---- 14:2.9

# F14, proposed: predictability, 7:1.8, 9:6.8, 12:6.5
[[note]]
at = "14:2.9"
after = "but mind phenomena and personality volition are not"
origin = "none"
tex = '''The earlier papers found the same of each in turn: ``All reactions of the spirit-gravity circuit of the grand universe are predictable'' (\bibref[7:1.8]{p007 1:8}); ``The mind-gravity circuit is dependable \ldots\ but not all the observable function of mind is predictable'' (\bibref[9:6.8]{p009 6:8}); ``The universe is highly predictable only in the quantitative or gravity-measurement sense'' (\bibref[12:6.5]{p012 6:5}). Havona's perfection leaves its creatures their freedom, which is why the next sentence infers that sin is impossible there, from the record, and does not assert it.'''

# F15, proposed: Revelation 21:27; 30:4.21, 10:6.17
[[note]]
at = "14:2.9"
after = "prematurely admitted to the central universe"
origin = "none"
tex = '''Compare Revelation~21:27, of the heavenly city: ``And there shall in no wise enter into it any thing that defileth, neither whatsoever worketh abomination, or maketh a lie: but they which are written in the Lamb's book of life.'' The sifting is over long before Havona: from the day a mortal leaves his local universe his status ``is forever settled. Superuniverse wards have never been known to go astray'' (\bibref[30:4.21]{p030 4:21}); and in the central universe the judgments of the Ancients of Days ``exist in theory only; there fairness is self-evident in perfection, and Havona perfection precludes all possibility of disharmony'' (\bibref[10:6.17]{p010 6:17}).'''

# ---- 14:3.1

# F16, proposed: Madison, The Federalist, No. 51 (vol. II, p. 118 of the first
# edition); the superuniverses' branches, 15:11.1, 15:12.1; 71:3.9
[[note]]
at = "14:3.1"
after = "the height of the ideals of true self-government"
origin = "none"
tex = '''Compare Madison, writing as Publius, in \emph{The Federalist}, No.~51: ``But what is government itself but the greatest of all reflections on human nature? If men were angels, no government would be necessary. If angels were to govern men, neither external nor internal controls on government would be necessary'' (\cite{Madison}, p.~118). The next paragraph gives Madison's reason: ``There is no need of government among such perfect and near-perfect intelligences.'' Between Havona and Urantia the book has the degrees: a superuniverse has its executive and its deliberative branch (\bibref[15:11.1]{p015 11:1}) and its courts (\bibref[15:12.1]{p015 12:1}), and of the states of earth it says, ``That state is best which co-ordinates most while governing least'' (\bibref[71:3.9]{p071 3:9}).'''

