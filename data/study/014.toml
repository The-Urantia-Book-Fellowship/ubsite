origin = "none"
tex = '''Described at \bibref[17:5.1--5]{p017 5:1} and \bibref[26:2.6]{p026 2:6}: the collective creation of the Seven Master Spirits, each ``limited to the permeation of a single Havona circuit'', an impersonal presence with whom a pilgrim cannot ``hold personal communion'', and whose personal offspring are the tertiary supernaphim. They ``were not a part of the original pattern universe'': they ``undoubtedly appeared as a creative response of the Master Spirits to the emerging purpose of the Supreme Being, and they were discovered in function upon the organization of the grand universe''.'''

# ---- 14:1.11

