# ---- 14:0.2

# F2, proposed: Plato's Timaeus, 28c-29b and 37d, in Jowett, pp. 449 and 456;
# the Foreword's definition, by the note at 11:9.5; 4:0.2
[[note]]
at = "14:0.2"
after = "the pattern universe"
origin = "none"
tex = '''The thought is as old as Plato's \emph{Timaeus}, where the maker of the world works from an eternal pattern: ``Which of the patterns had the artificer in view when he made the world,---the pattern of the unchangeable, or of that which is created? \ldots\ Every one will see that he must have looked to the eternal'', and the world so made ``must therefore of necessity \ldots\ be a copy of something'' (\cite{PlatoTimaeus}, p.~449; 28c--29b). Time itself belongs to the copy: ``he resolved to have a moving image of eternity \ldots\ and this image we call time'' (p.~456; 37d). The paper's pattern differs from Plato's in two things: it is no idea but a universe of a billion worlds, ``actual and literal'' (\bibref[14:2.1]{p014 2:1}); and it has many copyists, each Creator Son striving ``to make his own universe eventually attain to these Paradise-Havona levels of perfection'' (\bibref[14:6.27]{p014 6:27}). The Foreword's definition, ``Pattern is a master design from which copies are made'', is in the note at \bibref[11:9.5]{p011 9:5}, and \bibref[4:0.2]{p004 0:2} says that Havona ``may serve as the pattern creation for all other universes''.'''

# ---- 14:1.9

# F3, the edition's, rewritten: his formula and conclusion kept; the formula of
# his note in ud, N_k = 35k, put first; the appeal to Wolfram Mathematica
# replaced by the reasons, each recomputed: a geometric progression from about
# 35 to about 245 sums to 793-820, a harmonic one to 635-665, and for an
# arithmetic one epsilon + delta = 40/7 identically, whence his range of mu,
# whose mid-point, mu = 20/7, gives lambda = 35 exactly
[[note]]
at = "14:1.9"
after = "proportionate numbers intervening"
origin = "bf7c3b7796418a79"
tex = '''The round numbers are those of $N_k=35k$, the worlds (in millions) of the $k$\ts{th} circuit: 35 on the first, 245 on the seventh, and $\sum\limits_{k=1}^7 35k=980$ in all, 20 short of the billion; hence ``upwards of'' and ``over''. One possible distribution in whole millions is given by the following neat formula: $N_k=35k+(-1)^k+3$, that is 37, 74, 107, 144, 177, 214 and 247, with $\sum\limits_{k=1}^7 N_k=1000$. It keeps $(N_{k+1}-N_{k-1})/2=35$, but it is not proportionate in any of the usual senses, arithmetic, geometric or harmonic; of the three it comes closest to the arithmetic, since $(N_{k+1}+N_{k-1})/2=N_k-2(-1)^k$, and never reaches it. Strict proportionality asks that each circuit's number be a mean of its neighbours', $N_k=f(N_{k+1},N_{k-1})$, with $N_1=35+\epsilon$, $N_7=245+\delta$, $\epsilon>0$, $\delta>0$ and a total of 1000; in principle $f$ could be any quasi\hyp{}arithmetic mean in Kolmogorov's sense, but take the three classical ones. The geometric mean, $f(a,b)=\sqrt{ab}$, makes the numbers a geometric progression, and one that runs from about 35 to about 245 adds up to some 800; the harmonic mean, $f(a,b)=2ab/(a+b)$, gives some 650: neither can reach the billion. The arithmetic mean, $f(a,b)=(a+b)/2$, makes them an arithmetic progression, $N_k=\lambda k+\mu$ with $28\lambda+7\mu=1000$, and then $\epsilon=(20+21\mu)/28$ and $\delta=5-3\mu/4$, so that $\epsilon+\delta=40/7$ whatever $\mu$ is: the two excesses always make up 5.7 million between them. So there is no solution with both below 2 million, and both are below 3 million only for $8/3<\mu<64/21$. In the middle of that range lies the simplest solution of all, $\mu=20/7$ and $\lambda=35$, that is $N_k=35k+20/7$: the missing 20 million shared equally among the seven circuits, 37.9 million worlds on the first and 247.9 on the seventh, within about a million of the whole numbers above on every circuit, and strictly proportionate, as the text demands. (With $\mu=0$ the numbers are as 1 to 7, $N_k=250k/7$: 35.7 million on the first circuit but a full 250 on the seventh, which would hardly be called ``over two hundred and forty-five''.)'''

