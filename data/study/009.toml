[[note]]
at = "9:5.6"
after = "tabernacles of the flesh."
origin = "none"
tex = '''Tabernacle is the Bible's figure for the body, a tent soon struck. 2~Corinthians~5:1: ``For we know that if our earthly house of \bibemph{this} tabernacle were dissolved, we have a building of God, an house not made with hands, eternal in the heavens'' (\textgreek{σκῆνος}, a tent); and 2~Peter~1:13--14: ``as long as I am in this tabernacle \ldots{} shortly I must put off \bibemph{this} my tabernacle'' (\textgreek{σκήνωμα}). The book has ``the mortal tabernacle'' at \bibref[1:4.3]{p001 4:3}.'''

