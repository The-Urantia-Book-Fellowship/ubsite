# F1: checked in the edition's KJV and the SBL Greek.
[[note]]
at = "9:0.1"
after = "ministering spirits"
origin = "none"
tex = '''Hebrews~1:14: ``Are they not all ministering spirits, sent forth to minister for them who shall be heirs of salvation?'' (\textgreek{λειτουργικὰ πνεύματα}). The title is the Spirit's whole family here, ``a vast array of ministering spirits'' at \bibref[9:8.6]{p009 8:6}, and its third group, the Ministering Spirits of Time, at \bibref[9:8.23]{p009 8:23}.'''

# F2: checked in the edition's KJV, the SBL Greek, and the Revised Version
# (its 1895 printing with the Apocrypha).
[[note]]
at = "9:0.4"
after = "all things consist"
origin = "none"
tex = '''Colossians~1:17, of Christ: ``And he is before all things, and by him all things consist.'' The Greek is \textgreek{τὰ πάντα ἐν αὐτῷ συνέστηκεν}, \textit{in him} all things hold together, as the Revised Version (1881) has it, ``in him all things consist'', and as the paper has it, \textit{in whom}. What Paul says of the Son is said here of the Conjoint Actor, ``the revelation of the unity of God''.'''

# F3: checked in the edition's KJV, and 8:2.2 and 7:1.1 in the press text.
[[note]]
at = "9:1.5"
after = "called the Omnipresent Spirit."
origin = "none"
tex = '''Psalms~139:7--8: ``Whither shall I go from thy spirit? or whither shall I flee from thy presence? If I ascend up into heaven, thou \bibemph{art} there: if I make my bed in hell, behold, thou \bibemph{art there}.'' The title is among the Spirit's at \bibref[8:2.2]{p008 2:2}, and \bibref[7:1.1]{p007 1:1} says the same three, omnipresence, omnipotence and omniscience, of the Son.'''

# F4: checked in the edition's KJV and the SBL Greek.
[[note]]
at = "9:1.8"
after = "overshadow justice with mercy."
origin = "none"
tex = '''James~2:13: ``and mercy rejoiceth against judgment'' (\textgreek{κατακαυχᾶται ἔλεος κρίσεως}, mercy triumphs over judgment).'''

# F5: checked in the Loeb, the Greek p. 222 and the English p. 223, in the
# page images; Sidgwick's rendering in his edition of 1884 (the Archive's
# text); 23:2.12 and 66:5.13 in the press text.
[[note]]
at = "9:1.8"
after = "offspring of the Infinite Spirit."
origin = "none"
tex = '''The anvil of Justice is Aeschylus's. In the \emph{Choephori}, as the son comes home to avenge his father, the chorus sings (646--647) \textgreek{Δίκας δ᾽ ἐρείδεται πυθμήν· προχαλκεύει δ᾽ Αἶσα φασγανουργός}, in Smyth's rendering~\cite{Aeschylus}, p.~223: ``The anvil of Justice is planted firm. Destiny fashioneth her arms and forgeth her sword betimes'' (\textgreek{πυθμήν} is properly a base or a stock; Sidgwick in 1884 and Smyth both make it her anvil). There Fate forges a sword on it; here suffering's hammer forges a universe, and those who swing it are the children of mercy. The figure returns at \bibref[23:2.12]{p023 2:12}, where characters are forged ``between the anvils of necessity and the hammers of anguish'', and at \bibref[66:5.13]{p066 5:13}, where Urantia's civilization ``was literally forged out between the anvil of necessity and the hammers of fear''.'''

