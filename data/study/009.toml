# F17: checked in the edition's KJV and the SBL Greek; 7:1.1 and 9:6.1 in
# the press text.
[[note]]
at = "9:6.2"
after = "draws all personality to himself,"
origin = "none"
tex = '''Compare John~12:32: ``And I, if I be lifted up from the earth, will draw all \bibemph{men} unto me'' (\textgreek{πάντας ἑλκύσω πρὸς ἐμαυτόν}, I will draw all to myself); and John~6:44: ``No man can come to me, except the Father which hath sent me draw him''. The verb is John's; the three drawings, of personality, of spirit and of mind, are the book's three gravities (\bibref[7:1.1]{p007 1:1}, \bibref[9:6.1]{p009 6:1}).'''

# F17a (section 7, proposed 2026-11-05 at Tigran's asking, ruled Yes the same
# day, "All your notes on §7 are approved"):
# checked in the scan, p. 248; 17:3.1 in the press text.
[[note]]
at = "9:7.1"
after = "focalizes on Paradise."
origin = "none"
tex = '''The nearest thought in philosophy is Leibniz's. \emph{Monadology}, §~56, in Latta's rendering~\cite{Leibniz}, p.~248: ``this connexion or adaptation of all created things to each and of each to all, means that each simple substance has relations which express all the others, and, consequently, that it is a perpetual living mirror of the universe''. There every monad mirrors the whole, each confusedly and from its own point of view; here the mirroring is the service of distinct personalities, the Reflective Spirits (\bibref[17:3.1]{p017 3:1}), which sees ``all things as they transpire throughout a superuniverse'' and focuses them where they are wanted.'''

# F17b (section 7, ruled Yes 2026-11-05): 25:2.2, 28:4.9, 17:4.1 and 28:5.20 in the
# press text.
[[note]]
at = "9:7.2"
after = "with their occurrence."
origin = "none"
tex = '''The name is a mirror's, and the book keeps it so. The Reflective Spirits are ``the seven reflections of the Seven Master Spirits'' (\bibref[25:2.2]{p025 2:2}), by whom the Ancients of Days ``enjoy the reflective presence of all those exalted beings whose personal presence is denied them'' (\bibref[28:4.9]{p028 4:9}); their Image Aids are ``true images'' (\bibref[17:4.1]{p017 4:1}); and the Discerners of Spirits show the Censors ``the naked soul of the reflected individual'' (\bibref[28:5.20]{p028 5:20}). What a mirror shows is not itself but what stands before it, and here what stands before it may be a superuniverse away. In physics reflectivity is the share of the light falling on a surface that the surface throws back.'''

# F17c (section 7, ruled Yes 2026-11-05): 17:3.7 and 28:4.12 in the press text.
[[note]]
at = "9:7.3"
after = "the universal space reports,"
origin = "none"
tex = '''\bibref[17:3.7]{p017 3:7}: ``The reflectivity organization is also the news-gathering and the decree-disseminating mechanism of all creation. It is in constant operation in contrast with the periodic functioning of the various broadcast services.'' The Broadcast Receivers among the seconaphim synchronize ``the reflective vision of the Ancients of Days'' with the messages of the circuits (\bibref[28:4.12]{p028 4:12}).'''

# F17d (section 7, ruled Yes 2026-11-05): checked in Tigran's copy of Bucke, p. 2;
# James's Varieties, lecture XVI, quotes the sentence; 8:2.2 and 9:7.5 in the
# press text.
[[note]]
at = "9:7.4"
after = "this consciousness of the cosmos."
origin = "none"
tex = '''\textit{Cosmic consciousness} is Richard Maurice Bucke's term, and these are his words for it~\cite{Bucke}, p.~2: ``The prime characteristic of cosmic consciousness is, as its name implies, a consciousness of the cosmos, that is, of the life and order of the universe.'' William James quoted them in \emph{The Varieties of Religious Experience} (1902)~\cite{James}, p.~398, and the term was current when these papers were written: \bibref[8:2.2]{p008 2:2} says the Infinite Spirit ``is sometimes confused with the cosmic mind''. Bucke's is a faculty appearing in the human race; here the consciousness of the cosmos is reflectivity's, and may be ``the emergence of the presence-consciousness of the Supreme Being'' (\bibref[9:7.5]{p009 7:5}).'''

# F18: 16:8.5, 112:0.8 and 0:5.11 in the press text.
[[note]]
at = "9:8.8"
after = "the Father’s personality circuit."
origin = "none"
tex = '''The book's other marks of creature personality: \bibref[16:8.5]{p016 8:5}, ``self-consciousness and associated relative free will''; \bibref[112:0.8]{p112 0:8}, personality ``discloses only qualitative response to the personality circuit in contradistinction to the three energies which show both qualitative and quantitative response to gravity''; and \bibref[0:5.11]{p000 5:11}, where it ``unifies all other associated factors of individuality''.'''

# F19: checked in the edition's KJV; 26:10.2 in the press text.
[[note]]
at = "9:8.25"
after = "from chaos to glory."
origin = "none"
tex = '''The ladder is Jacob's. Genesis~28:12: ``And he dreamed, and behold a ladder set up on the earth, and the top of it reached to heaven: and behold the angels of God ascending and descending on it''; and John~1:51, where Jesus makes it himself: ``ye shall see heaven open, and the angels of God ascending and descending upon the Son of man.'' The same words, ``from chaos to glory'', are the pilgrims' at \bibref[26:10.2]{p026 10:2}, who ``climbed, as on a ladder''.'''
