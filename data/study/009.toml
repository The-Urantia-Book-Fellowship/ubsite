[[note]]
at = "9:3.2"
after = "in either the Father or the Son."
origin = "none"
tex = '''Dr~Sadler, on this paragraph \cite{Sadler2003}, p.~240: ``Heredity can produce qualities in the offspring which are not discernible in the parents.'''''

# F9: the physics of the gyroscope, in words, with the rate of precession and
# a schematic, data/study/figures/gyroscope.svg (Tigran asked for both,
# 2026-11-05); no source.
[[note]]
at = "9:3.3"
after = "the cause of antigravity."
origin = "none"
tex = '''A gyroscope does not resist gravity. A wheel spinning fast on an axle held up at one end only does not fall as a still wheel would: its axle swings slowly around the vertical axis instead, which is called precession, and the faster the spin, the slower the swing: with the wheel's weight $mg$ at a distance $r$ from the support, its moment of inertia $I$ and its spin $\omega$, the axle turns at $\Omega = {mgr \over I\omega}$. \figure{gyroscope} Its weight is undiminished, and a scale under the support reads all of it; what the pull of gravity does is turn the direction of the spin, not lower the wheel. So it shows a body held up against gravity, the effect, and nothing of how, since it is held up as any body is, by what it rests on.'''

# F10: 42:4.9 in the press text; Blackett and Occhialini, Proc. R. Soc. A 139
# (1933), 699-726.
[[note]]
at = "9:3.4"
after = "techniques unknown to you."
origin = "none"
tex = '''\bibref[42:4.9]{p042 4:9}: ``the dark worlds and all outer space can slow down electronic and ultimatonic activity to the point of converting these energies into the matter of the realms''. \textit{Materialization} is the physicists' own word, since the 1930s, for energy becoming matter: in 1933 Patrick Blackett and Giuseppe Occhialini photographed in a cloud chamber the tracks of an electron and a positron created together out of a gamma ray (\emph{Proceedings of the Royal Society}~A, 139, pp.~699--726), and the reverse, their annihilation into radiation, was observed the same year.'''

# F11: checked in Tigran's copy of Heath, p. xix (djvu page 18); Pappus,
# Collection VIII, Hultsch's edition p. 1060, in the Archive's text.
[[note]]
at = "9:3.8"
after = "of the physical creation."
origin = "none"
tex = '''The fulcrum and the lever are Archimedes's. ``Give me a place to stand on, and I can move the earth'' (\textgreek{δός μοι ποῦ στῶ καὶ κινῶ τὴν γῆν}), as Pappus of Alexandria reports him in the eighth book of his \emph{Collection}, and as Heath~\cite{Heath}, p.~xix, renders it. Here Paradise is the place to stand, and the Spirit's agencies are the lever.'''

# F12: 0:0.3, 9:0.4 and 16:6.10 in the press text.
[[note]]
at = "9:4.5"
after = "mind is meaning, spirit is value."
origin = "none"
tex = '''The three run through the book from its first paragraph, \bibref[0:0.3]{p000 0:3}, ``the things, meanings, and values of universal reality'', and \bibref[9:0.4]{p009 0:4}, ``things, meanings, and values; energies, minds, and spirits''. At \bibref[16:6.10]{p016 6:10} the three cosmic intuitions answer to them, ``Matter-energy is recognized by the mathematical logic of the senses; mind-reason intuitively knows its moral duty; spirit-faith (worship) is the religion of the reality of spiritual experience'': science, philosophy and religion.'''

# F13: 108:2.2 and 34:5.4 in the press text.
[[note]]
at = "9:5.2"
after = "function of the Infinite Spirit."
origin = "none"
tex = '''\bibref[108:2.2]{p108 2:2}: ``The Adjusters cannot invade the mortal mind until it has been duly prepared by the indwelling ministry of the adjutant mind-spirits and encircuited in the Holy Spirit.'' And \bibref[34:5.4]{p034 5:4}: once a bestowal Son has poured out the Spirit of Truth, ``all normal minds are automatically prepared for the reception of the Thought Adjusters''.'''

# F14: 4:2.3 in the press text.
[[note]]
at = "9:5.5"
after = "but nature is not perfect."
origin = "none"
tex = '''\bibref[4:2.3]{p004 2:3}: nature ``carries a uniform, unchanging, majestic, and marvelous thread of perfection from the circle of eternity; but in each universe, on each planet, and in each individual life, this nature is modified, qualified, and perchance marred by the acts, the mistakes, and the disloyalties of the creatures''.'''

# F15: checked in the edition's KJV and the SBL Greek; 1:4.3 in the press
