at = "9:2.1"
after = "in a threefold sense:"
origin = "none"
tex = '''John~4:24: ``God \bibemph{is} a Spirit''. The predicate has no article in the Greek, \textgreek{πνεῦμα ὁ θεός}, and the Revised Standard Version (1946) and the versions after it read ``God is spirit'', as the paper does here and at \bibref[1:3.1]{p001 3:1}.'''

# F7: 8:5.3 in the press text.
[[note]]
at = "9:2.5"
after = "bestowal upon the races of mankind."
origin = "none"
tex = '''\bibref[8:5.3]{p008 5:3}: ``The Holy Spirit is the spiritual circuit of this Creative Daughter of the Paradise Infinite Spirit. The Holy Spirit is a circuit indigenous to each local universe and is confined to the spiritual realm of that creation; but the Infinite Spirit is omnipresent.'''''

