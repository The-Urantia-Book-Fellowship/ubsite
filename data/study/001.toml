# F32a, added, ruled as proposed: Block's pp. 309-310, checked in the DjVu,
# with p. 311.
[[note]]
at = "1:7.5"
after = "spiritual realization of the personality of God."
origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~309: ``It is in experience that all true reality is revealed. \ldots{} In personality we have the only empirical key to ultimate reality; and that as a metaphysical principle it has a decided advantage over the abstract essences of all types of impersonal philosophy has been made increasingly clear by the course of modern thought'' (pp.~309--310). Knudson's key is a principle of metaphysics, its solution ``empirical, not theoretical'' (p.~311); here ultimate reality ``cannot be grasped by mathematics, logic, or philosophy, only by personal experience in progressive conformity to the divine will of a personal God''.'''

# F32b, added, ruled as proposed: Block's p. 311, checked in the DjVu, where
# his chart drops "itself" and "that he is".
[[note]]
at = "1:7.6"
after = "by indivisibility, by oneness."
origin = "none"
credit = "block"
corrects = '''``is itself complex'' for his ``is complex'', and ``indivisible and that he is only'' for his ``indivisible and only'''''
tex = '''Knudson~\cite{Knudson}, p.~311: ``Personality, however, is itself complex. It implies unity, identity, self-consciousness and self-control: four attributes, the last three of which, when applied to the Supreme Person, may perhaps better be designated as immutability, omniscience, and freedom.'' And under ``Unity'': ``The unity of God has a double meaning. It means that he is indivisible and that he is only.'' Here personality implies four again, but not Knudson's four: unity is left out, self-control is self-will, and self-revelation is added. Unity is then that of the associations of the Paradise Deities, known ``by indivisibility, by oneness''.'''

