# F1, ruled: as proposed, corrected: 1 Samuel 2:2 is Block's comparison, not one of Nave's verses, and pp. 434-436 are not one page; Sadler's identifications from Block's endnotes; the credit line replaces 'Here and in the notes below'
[[note]]
at = "1:0.1"
after = "the prophet said:"
origin = "5243af2f44047c31"
credit = "block"
tex = '''Not one prophet's words but several verses. Three stand in Nave's Topical Bible under \textsc{God}: \textsc{Creator} \cite{Nave}, pp.~434--436: Nehemiah~9:6, Psalms~33:6 and Psalms~104:2. For ``You, God, are alone; there is none beside you'', Block compares the first words of Nehemiah~9:6 and 1~Samuel~2:2; Dr~Sadler, in his \textit{Analytical Study of Part~I of the Urantia Book} (1964), named 2~Kings~19:15 and Deuteronomy~4:35. In Psalms~33:6, ``By the word of the \textsc{Lord} were the heavens made'' has become ``By the Sons of God were the universes made'', which agrees in advance with \bibref[1:2.9]{p001 2:9}: the universes of time and space are created by the Sons.'''

# F2, ruled: kept as the edition has it
