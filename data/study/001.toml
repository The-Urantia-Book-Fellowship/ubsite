# F9, ruled: kept as the edition has it, but for its source's key
[[note]]
at = "1:2.2"
after = "than reality idealized"
origin = "223ae3bbfb2253ac"
credit = "block"
tex = '''The redefinitions of God denied in this paragraph are those surveyed in Knudson~\cite{Knudson}, pp.~210--213, where God is ``reality idealized'' or ``a law or process''; and Knudson quotes the last of them without attribution: ``It has been said that `God is the noblest work of man'\,''.'''

# F10, ruled: as proposed, where Ingersoll wrote them, so that a reader can check
[[note]]
at = "1:2.2"
after = "work of man.”"
origin = "1d327cf01394cd47"
tex = '''The words ``An honest God is the noblest work of man'' belong to the American lawyer Robert Green Ingersoll (1833--1899), who wrote them in ``The Gods'' (1872).'''

# F11, ruled: kept as the edition has it, but for its source's key
[[note]]
at = "1:2.3"
after = "three experiential phenomena:"
origin = "350a48fed3149932"
credit = "block"
tex = '''Knudson~\cite{Knudson}, pp.~218--219, grounds the ``religious argument'' in man's ``capacity for religion as original and distinct as is his capacity for art, for morality, and for science''. Here the ground is not a human capacity but the presence of the Adjuster.'''

