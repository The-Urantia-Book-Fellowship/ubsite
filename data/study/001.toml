# F19, ruled: kept as the edition has it
[[note]]
at = "1:4.3"
after = "who gave it.”"
origin = "10969e459da88454"
tex = '''Ecclesiastes~12:7: ``Then shall the dust return to the earth as it was: and the spirit shall return unto God who gave it.'' Note, that ``as it was'' is a more accurate rendering of both the Hebrew (MT) \textheb{כְּשֶׁהָיָה} and the Greek (LXX) \textgreek{ὡς ἦν}.'''

# F20, ruled: as proposed, 'between ... from', and the book's spelling of the name, Center
[[note]]
at = "1:5.1"
after = "he not see?”"
origin = "540d8df39e990457"
tex = '''Psalms~94:9: ``He that planted the ear, shall he not hear? he that formed the eye, shall he not see?'' Note, that ``he that planted'' is a more accurate translation of the Hebrew \textheb{הֲנֹטַע} and Greek \textgreek{ὁ φυτεύσας}, than ``he who planned'' given in the text. This is probably intentional to differentiate God as the First Source and Center from the Creator Son or even from the ultimate actual agencies (Life Carriers) who directly ``planted'' the ear and all other organs. But if so, then why is \textheb{יֹצֵר} correctly given as ``he who formed'' in the second part of this verse?'''

