credit = "block"
tex = '''Compare Matthews~\cite{Matthews}, pp.~159--164: if the idea of the ``supra\hyp{}personal'' has any meaning, ``the religious consciousness would be, on the whole, in favour of ascribing this to God'' (p.~163).'''

# F22, ruled: kept as the edition has it
