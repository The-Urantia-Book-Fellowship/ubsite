[[note]]
at = "1:7.6"
after = "God is one.”"
origin = "b3107e6401821fed"
tex = '''Deuteronomy~6:4 says: \textheb{שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד} ``Hear, O Israel! Yahweh our God, Yahweh \bibemph{is} One.'' This formula is literally quoted in the Greek text of Mark~12:29: \textgreek{Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν}.'''

# F34, ruled: kept as the edition has it, but for its source's key
