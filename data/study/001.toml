origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~291: personality ``is itself the key to ultimate reality and identical with it. Only in and through the personal can we arrive at an understanding of the Absolute.'' Knudson's Absolute is here the unity of God.'''

