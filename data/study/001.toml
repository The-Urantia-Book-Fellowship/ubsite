# F30a, added, ruled as proposed: Block's pp. 192 and 193-194, checked in the
# 1894 printing.
[[note]]
at = "1:6.8"
after = "ideal revelation of the personality of God."
origin = "none"
credit = "block"
tex = '''Illingworth~\cite{Illingworth}, p.~192, opening his lecture ``Jesus Christ the Divine and Human Person'': ``The line of thought which we have been pursuing leads us on to the Incarnation, as the adequate and final revelation of the personality of God.'' Man, he goes on, ``as we have already seen, knows himself to be spiritual'' (pp.~193--194). Where Illingworth names the Incarnation, here it is Jesus' ``life of achieving the Father's will'', in which he ``attained the full realization'' of man's potential spirit personality; and that revelation is ``most real and ideal'', where Illingworth's is ``adequate and final''.'''

