# F22b, added, ruled as proposed: Block's pp. 285-286, checked in the DjVu,
# where his chart has "it may be justly urged".  F23 cites pp. 285-293 for
# 1:5.11-12, not this paragraph.
[[note]]
at = "1:5.10"
after = "concept of the unity of God."
origin = "none"
credit = "block"
corrects = '''``it may justly be urged'' for his ``it may be justly urged'''''
tex = '''Knudson~\cite{Knudson}, p.~285, opens his chapter ``The Personality of God'' with Ritschl: ``Personality is the form in which the idea of God is given through Revelation.'' But ``it may justly be urged that revelation at this point is only the culmination of natural religion'': ``the earliest gods were personal beings'', and ``God was personal before he was regarded as absolute or as perfectly good'' (p.~286). Here the idea of God's personality comes ``chiefly through revelation'', as for Ritschl. The personal gods of the earliest religion are granted in \bibref[1:5.11]{p001 5:11}, but the personal Deity that measures religious maturity comes after the unity of God, where for Knudson personality came first.'''

# F22c, added, ruled as proposed: Block's p. 291, checked in the DjVu: within
# the pages F23 cites, but the sentence recast stands alone.
[[note]]
