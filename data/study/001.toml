tex = '''Illingworth~\cite{Illingworth}, pp.~120--124: a loving Person ``cannot reveal Himself as such to those who have no notion that love must involve sacrifice, and has in it, therefore, an awful element of sternness''. Here sacrifice and sternness are left out.'''

