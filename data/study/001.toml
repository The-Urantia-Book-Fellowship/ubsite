# F31, ruled: as proposed, 'not in Knudson' to what can be checked
[[note]]
at = "1:7.2"
after = "with the ocean."
origin = "1c34ba34c29e2d62"
credit = "block"
tex = '''The argument of \bibref[1:7.1--3]{p001 7:1} is that of Knudson~\cite{Knudson}, pp.~305--307: ``There may be interactions between impersonal beings''; union with God is not ``the union of absorption'' but ``a union that grows out of reciprocal intercourse''; and ``only a personal being can be good''. The image of the drop and the ocean, and the contrast of goodness with truth and beauty in \bibref[1:7.3]{p001 7:3}, are not in the passages of Knudson that Block sets beside them.'''

# F32, ruled: kept as the edition has it, but for its source's key
[[note]]
at = "1:7.4"
after = "and our environment."
origin = "e75a00478a173544"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~314: we maintain our unity and identity ``over against the changing many. How this is possible we do not know, but it is a fact of our own experience; and what holds true of us in a limited degree we are warranted in ascribing to God in an unlimited degree.'''''

# F33, ruled: kept as the edition has it
[[note]]
at = "1:7.6"
after = "God is one.”"
origin = "b3107e6401821fed"
tex = '''Deuteronomy~6:4 says: \textheb{שְׁמַע יִשְׂרָאֵל יְהוָה אֱלֹהֵינוּ יְהוָה אֶחָד} ``Hear, O Israel! Yahweh our God, Yahweh \bibemph{is} One.'' This formula is literally quoted in the Greek text of Mark~12:29: \textgreek{Ἄκουε, Ἰσραήλ, κύριος ὁ θεὸς ἡμῶν κύριος εἷς ἐστιν}.'''

# F34, ruled: kept as the edition has it, but for its source's key
[[note]]
at = "1:7.7"
after = "absolute or infinite."
origin = "9654ac2049e37f1c"
credit = "block"
