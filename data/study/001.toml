[[note]]
at = "1:7.7"
after = "all matter, and all spirit."
origin = "none"
credit = "block"
corrects = '''``nor is it matter'' for his ``nor it is matter'''''
tex = '''Knudson~\cite{Knudson}, p.~313, goes on: ``A common method has been to identify the world-ground with the highest universal, with bare being, and then define its nature as pure simplicity. As such it transcends all the plurality and all the differences of finite existence. It is not mind, nor is it matter. It is something above them both.'' Knudson rejects it: ``So far as our articulate experience is concerned, it is a mere blank''; a God so thought of ``would be reduced to `a rigid and lifeless stare.' It is only on the plane of free intelligence that true unity can be realized'' (p.~314). Here the words of the method Knudson rejects, with spirit added, are said of the First Source and Center.'''
