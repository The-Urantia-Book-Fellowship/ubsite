# checked in Tigran's DjVu (originals/LIBRARY.tsv).
[[note]]
at = "1:2.2"
after = "the mortal quest objectified."
origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, pp.~46--47, of religion: faith ``is to be viewed as something more than a mere product of unsatisfied desire. It is not simply man's inability to carry to a successful conclusion his quest after life that leads to the belief in a superworld'', and ``Religion is something more than the valid or invalid objectification of desire.'' What Knudson says of religion is here said of God, who ``is not simply the supreme desire of man, the mortal quest objectified''. Compare \bibref[103:9.5]{p103 9:5}, where genuine religious experience ``far transcends the philosophic objectification of idealistic desire''.'''

