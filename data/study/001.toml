# F27a, added, ruled as proposed: Block's p. 58, checked in the 1894 printing
# (originals/personalityhuman189400illi.pdf).
[[note]]
at = "1:6.3"
after = "Michael, the Creator Son."
origin = "none"
credit = "block"
tex = '''Illingworth~\cite{Illingworth}, p.~58: ``uncivilized man has a very dim and obscure sense both of the limits and the content of his own personality \ldots{} And all this was naturally reflected in his view of the outside world, with the result that his gods were indefinite in number and in outline, and their character `vengeful, partial, passionate, unjust.' But as time went on, and man learned to distinguish between animate and inanimate, persons and things, and again between what was essential and accidental, good and bad in his own nature, higher conceptions of divine personality and character arose''. Here the better concepts of the divine personality ``await the appearance of improved ideas of human personality'', above all in the bestowal life of Michael, as Illingworth's lectures come at last to the Incarnation (p.~192; see \bibref[1:6.8]{p001 6:8}).'''

# F27b, added, ruled as proposed: Block's p. 102, checked in the 1894 printing.
[[note]]
at = "1:6.4"
after = "personal religious experience."
origin = "none"
credit = "block"
tex = '''John Caird, quoted in Illingworth~\cite{Illingworth}, p.~102: ``The true meaning of the ontological proof is this \ldots{} that as spiritual beings our whole conscious life is based on a universal self-consciousness, an absolute spiritual life, which is not a mere subjective notion or conception, but which carries with it the proof of its necessary existence or reality.'' Illingworth counts it among ``the intellectual proofs of the existence of God''. Caird's absolute spiritual life is here ``the prepersonal divine spirit which indwells the mortal mind'', and what it carries is ``the valid proof of its actual existence'', not of its personality, which only religious experience grasps.'''

