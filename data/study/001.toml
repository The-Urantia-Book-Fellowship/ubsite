# F23, ruled: as proposed, Knudson's word is 'organization', not 'organism'; and 'not in Knudson' to what can be checked
[[note]]
at = "1:5.11"
after = "materialism or pantheism."
origin = "623dbfe69fd57b9a"
credit = "block"
tex = '''The argument of this and the next paragraph is that of Knudson~\cite{Knudson}, pp.~285--293: both these types of philosophy ``have maintained that personality is indissolubly bound up with a material organization''. The positive alternative, ``a union of mind and spirit'' (\bibref[1:5.12]{p001 5:12}), is not in the passages of Knudson that Block sets beside them.'''

# F24, ruled: kept as the edition has it, but for its source's key
[[note]]
at = "1:5.15"
after = "finality of perfectness"
origin = "bf139509b7dc6d74"
credit = "block"
tex = '''This reverses Knudson~\cite{Knudson}, p.~294, where Th.~Steinmann is quoted: to be a person ``means to be in the process of becoming one. At least this is true of men\ldots{} God is not a struggling and developing Being; he is `complete'.'' Here an unqualified completeness would be an ``awful limitation'', which the Father escapes by taking part in the very struggle that Steinmann reserved for men.'''

# F25, ruled: kept as the edition has it
[[note]]
at = "1:5.16"
after = "he is afflicted.”"
origin = "4f9d2c9bd6c4094f"
tex = '''Isaiah~63:9: ``In all their affliction he was afflicted, and the angel of his presence saved them: in his love and in his pity he redeemed them; and he bare them, and carried them all the days of old.'''''

# F26, ruled: kept as the edition has it
[[note]]
at = "1:5.16"
after = "have our being.”"
origin = "b8a77f722cbaf2f1"
tex = '''Acts~17:28: ``For in him we live, and move, and have our being; as certain also of your own poets have said, For we are also his offspring.'' Here, by ``certain also of your own poets'' Paul is probably referring to Aratus (315--240\,B.C.) who wrote in \textgreek{Φαινόμενα}~4--5: ``Everywhere everyone is indebted to Zeus. For we are indeed his offspring.'''''

# F27, ruled: kept as the edition has it, but for its source's key
[[note]]
at = "1:6.1"
after = "divine Creator personality."
origin = "216f1bf5abb66747"
credit = "block"
tex = '''Compare Lotze, quoted in Illingworth~\cite{Illingworth}, p.~53: ``Perfect personality is in God only; to all finite minds there is allotted but a pale copy thereof''.'''

