# F16, ruled as proposed: Block's pp. 49 and 51, which the paragraph's first and last
# sentences follow, added to the edition's p. 50, and the note moved to the
# paragraph's end; checked in the book (p. 51 reads "then is he sovereign",
# where Block has "then he is", which the note does not quote).
[[note]]
at = "3:6.3"
after = "Universal Father is acknowledged."
origin = "def95a3be4f31647"
credit = "block"
tex = '''Lewis~\cite{Lewis}, p.~49: ``The only God who can be made finally intelligible is a God who is absolute Sovereign. Even polytheism had eventually to make provision for one God who gave the law to all lesser gods.'' P.~50: ``the very least we can ask of the cause of all things is that it shall not be lower in kind or quality than what is admittedly the highest feature of the `all things' that are to be accounted for. This ranking place must be assigned to mind \ldots{} Mind is either to be explained by Other Mind or to be explained by that which is not mind.'' And p.~51: ``If mind requires Other Mind to account for it---more exactly, if man is inexplicable without God---then man is the issue either of God's free will or of his necessitated will.'' Lewis's ``Other Mind'' is here ``higher orders of thought and purposive will''.'''

