after = "Consider the following:"
origin = "64a552efb287a0d0"
credit = "block"
tex = '''This list and the argument of \bibref[3:5.15]{p003 5:15} are taken from Lewis~\cite{Lewis}, chapters~III, ``The Inevitabilities of Life'', and IV, ``The Moral Shadow'' (pp.~74--113): ``Is courage desirable? Then man must encounter hardship. Is service of one's kind desirable? Then there must be inequalities in the human lot. Is hope desirable? Then life must be beset by uncertainties. Is faith desirable? Then the mind must know less than it is able to believe. Is truth desirable? Then one must be able to lie'' (p.~93). Idealism, loyalty and unselfishness (items 6--8) are added here, and Lewis's lie has become error and the possibility of falsehood. Pleasure (item~9) is Lewis's too, from p.~91: ``There could be no pleasure if there were no pain, for both have the same physical basis---a nervous system.'''''

# F12a, added, ruled as proposed: Block's finding, Lewis p. 96; checked in the book,
# which has "the spirit and the needs", where his chart has "spirit and needs".
[[note]]
at = "3:5.15"
after = "Father’s divine will."
origin = "none"
credit = "block"
corrects = '''``the spirit and the needs'' for his ``the spirit and needs'''''
tex = '''Lewis~\cite{Lewis}, p.~96: ``The world is a system: so far as we can tell, it must be that or nothing. A system means coherence, continuity, relationship. In a system, the parts are as they are and where they are because of the requirements of the whole. This surrender to the spirit and the needs of the whole is the price the part must pay for its own existence.'' Lewis's price for existence is here the condition of survival: co-operation, ``the wholehearted desire and perfect willingness to do the Father's divine will''.'''

