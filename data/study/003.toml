# F19, ruled as proposed: p. 149 quoted more fully, on the page Block gives: Lewis's
# confessed inability to say how God suffers, the paper's "I cannot understand
# how", and his "in all our affliction he too is afflicted".
[[note]]
at = "3:6.6"
after = "do not know."
origin = "c45b1cdf082442b1"
credit = "block"
tex = '''Lewis~\cite{Lewis}, chapter~V, under the heading ``God suffers'' (p.~148), affirms it: ``With due modesty we confess our inability to state clearly the process whereby suffering can be an actual experience for a being such as we conceive God to be; but this inability is no sufficient reason for the conclusion that therefore he cannot suffer. \ldots{} Better, because far truer, that we should say that the world's travail is also his travail---that `in all our affliction he too is afflicted.' \ldots{} we can affirm the fact even if we are uncertain respecting the process'' (p.~149). He reports that Friedrich von H\"ugel preferred the word ``sympathy'', since suffering implies ``a certain deprivation of bliss which cannot be consistently attributed to God'' (p.~152). Here Lewis's assertion becomes a question, answered ``I do not know'', and his confessed inability is ``I cannot understand how''; von H\"ugel's sympathy is the certainty, and Lewis's suffering only a possibility.'''

