tex = '''The fourth and fifth quotations draw on more of Hume's Sikh lines on p.~18 \cite{Hume} than the Friend: ``Many millions search for God, And find Him in their hearts''; ``Since God dwelleth in thy heart, Why leave, and go far to find Him! Near thee shalt thou find Him For Whom thou searchest the world!''; ``Thou art omnipresent, though I thought Thee distant. Thou art near''; and Kabir's ``Him Whom I thought without me I now find within me.'' Sadler's list of Sikh sources for the paragraph has the first and the last of these \cite{Sadler2003}, p.~110. Kabir's discovery, that the one he thought outside him is within, is here said of every man: the true God ``is a part of us''.'''

