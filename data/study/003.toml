# F9, ruled as proposed: corrected.  Knudson does not tie the absence of surprise to
# foreknowledge: he reports it as an argument for foreknowledge and answers it
# (p. 321).  The first quotation begins on p. 319, where Block has 320.
[[note]]
at = "3:3.4"
after = "subjected to surprise."
origin = "7a7af614fd4bbbf6"
credit = "block"
corrects = '''pp.~319--320 for his 320'''
tex = '''Knudson~\cite{Knudson}, pp.~319--320, allows that ``To deny to God foreknowledge of free acts, would not necessarily be inconsistent with his omniscience''. To the argument for foreknowledge that ``If God foreknows everything, he will never be taken by surprise, not even by the acts of evil men'', he answers that even if free acts ``cannot be positively foreknown, to infinite insight it is hardly possible that they should contain much in the way of surprise'' (p.~321). Here the foreknowledge of sin is left to God's choice, and Knudson's ``hardly \ldots{} much'' has become ``never''.'''

