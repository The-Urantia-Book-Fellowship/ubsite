# F1a: found in review; checked in the edition's KJV (Rev.tex).  The Armenian
# reading added at Tigran's asking (2026-10-30), checked in his copy of
# Conybeare (LIBRARY.tsv), in the page images: p. 60 with its note "Adam]
# David α 4"; the Armenian text p. 32 (Codex 1, the Bodleian codex, under his
# verse 17) and p. 189 (Codex 6, the Etchmiadzin codex); the list of sources
# pp. 1-2 (1 Bodleian, 4 Jerusalem, α the recension of Nerses); the dates in
# his stemma p. 147 (1: 1324; 4: 1199; 6: 1278; α: 1178-1198); and his own
# remark p. 134, "Version has Ἀδάμ for Δαβίδ, which α 4 retain".  David in the
# Zohrab Bible (../zohrab/tex/Rev.tex, "ի Դաւթայ"), in NA27 and the Byzantine
# text (../na27m, ../byzgnt), the Vulgate (../vul), the Sahidic and the
# Bohairic (../sahnt, ../bohnt); the Syriac on Tigran's own check.
[[note]]
at = "32:2.6"
after = "Bright and Morning Star,"
origin = "none"
tex = '''Revelation~22:16, where Jesus says of himself: ``I am the root and the offspring of David, and the bright and morning star''; and Revelation~2:28: ``And I will give him the morning star.'' Here the title is Gabriel's, the first-born of the Creator Son and the Creative Spirit, ``one like him in all aspects of character''. The oldest Armenian text of the verse makes Jesus the offspring not of David but of Adam: \textarm{Ես եմ արմատն և զաւակն ադամայ, և աստղն առաւաւտուն}, ``I am the root and the offspring of Adam, and the star of dawn'', so in the Bodleian codex of 1324 which Conybeare~\cite{Conybeare} prints (p.~60; the Armenian text p.~32) and in the Etchmiadzin codex of 1278 (p.~189), while the Jerusalem codex of 1199 and the twelfth-century revision of Nerses of Lambron read David (his notes, pp.~60 and 134), as does the Zohrab Bible (Venice, 1805). I have found Adam in no other version: the Greek manuscripts, the Latin, the Syriac and the Coptic all read David. The reading answers to the name Jesus gave himself, the Son of Man, which in Hebrew is \bibemph{ben-adam}, son of Adam.'''

