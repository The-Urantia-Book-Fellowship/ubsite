[[note]]
at = "32:5.8"
after = "upon all flesh."
origin = "none"
tex = '''Revelation~22:17: ``whosoever will, let him take the water of life freely''; Hebrews~12:1: ``let us run with patience the race that is set before us'', and 1~Corinthians~9:24--25: ``So run, that ye may obtain'', ``they do it to obtain a corruptible crown; but we an incorruptible''; 2~Timothy~4:7--8: ``I have kept the faith: Henceforth there is laid up for me a crown of righteousness''; Joel~2:28, as Acts~2:17 quotes it: ``I will pour out my spirit upon all flesh''; and the ``good spirit'' is Nehemiah~9:20, ``Thou gavest also thy good spirit to instruct them'', and Psalms~143:10, ``thy spirit is good''.'''
