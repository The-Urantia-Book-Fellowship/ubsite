after = "can ever conceive."
origin = "f4e3177749b83272"
credit = "block"
tex = '''Matthews~\cite{Matthews}, p.~38: ``It is only those faiths which have clung to the personal conception of Deity which have had a `jealous God' who will tolerate no other gods beside Him.'' On p.~31: ``Anthropomorphism is the road along which the believing mind has travelled from superstition to noble creeds''; and p.~87, under the running head ``The Highest Anthropomorphism'': the Apostolic experience ``is built on the affirmation that God is the Father of the Lord Jesus Christ, and the Creator is revealed as love through the Person and work of the Redeemer''. The page goes on: ``The Christian experience of God may thus be regarded as the highest form, the logical outcome by a kind of spiritual dialectic, of that anthropomorphic tendency which we have described as the line of upward movement of the religious consciousness of the race.'''''

