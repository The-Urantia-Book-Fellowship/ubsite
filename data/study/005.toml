# F1, ruled as proposed: kept, quoted more fully on the pages Block gives (checked in Tigran's
# copy, pp. 19-20); "Here and in the notes below" goes, for the credit line.
# The credit line corrects Block's "our highest happiness" (p. 20).
[[note]]
at = "5:1.2"
after = "in arbitrary seclusion."
origin = "7ce421c7856b2a1b"
credit = "block"
corrects = '''``our highest possible blessedness'' for his ``our highest happiness'''''
tex = '''Strong~\cite{Strong}, p.~19: ``I believe that God created the world out of the fullness of his wonderful love; and that he is ever seeking in every possible way to reveal himself to the objects of that love. He is unknown to multitudes, not because he hides himself, but because multitudes are blind. I cannot conceive of a loving Father's hiding himself from children whose highest happiness and well-being depend on knowing him.'' And pp.~19--20: ``Because God loves us he seeks to bring us into the most intimate possible knowledge of himself, the most perfect likeness to himself, and the most complete co\"operation with himself, which would be the realization of our highest possible blessedness.'' Strong's blindness of the multitudes has become, in \bibref[5:1.1]{p005 1:1}, the finiteness of creatures who would not know they were in the Father's presence; in \bibref[5:1.10]{p005 1:10} it is their own doing: they ``have hidden themselves away in the mists of their own willful decisions''.'''

# F1a, added in review, ruled as proposed: checked in Tigran's copy, p. 23.
[[note]]
at = "5:1.2"
after = "center of all things."
origin = "none"
tex = '''Strong~\cite{Strong}, p.~23, three pages on: ``if he was ever to become a co-labourer with God, if he was ever to know such divine fellowship, then it is certain that God must work on a plane where man could work with him, must in man's education employ a method which man was capable of learning and using. In other words, our limitations limit God in dealing with us---a fact often forgotten.'' Here it is ``the limitations inherent in you'' that determine when and where the goal is reached, as in \bibref[5:1.1]{p005 1:1} the inability to approach the Father lies ``not in the Father's aloofness, but in the finiteness and material limitations of created beings''.'''

# F2, ruled as proposed: kept, with the Creed's words, which no verse of the KJV has (checked in
# the edition's KJV), and Sadler's study of the right hand of God, p. 158, to
# which Block's endnote 1 points.
[[note]]
at = "5:2.2"
after = "of the Father.”"
origin = "fbbce8e44f0c0533"
tex = '''Mark~16:19: ``he was received up into heaven, and sat on the right hand of God''; John~1:18: ``the only begotten Son, which is in the bosom of the Father''. Here the right hand is the place of the Paradise Sons, and the bosom is open to every personal creature. No verse of the King James Version speaks of the right hand ``of the Father'': it is the right hand ``of God'' (Mark~16:19, Romans~8:34, Colossians~3:1), ``of power'' (Matthew~26:64) or ``of the Majesty'' (Hebrews~1:3). The words are the Nicene Creed's: ``sitteth on the right hand of the Father''. Dr~Sadler, setting out the Bible's uses of ``the right hand of God'' at this paragraph, noted: ``In Pauline philosophy the right hand of God is Salvington, headquarters of the local universe of Nebadon'' \cite{Sadler2003}, pp.~157--158.'''

# F2a, added in review, ruled as proposed: checked in the book, pp. 7 and 21.
[[note]]
at = "5:4.1"
after = "feeling of “absolute dependence”"
origin = "none"
tex = '''Matthews~\cite{Matthews}, p.~7, of the defects he finds in Schleiermacher's conception of religion: ``Closely connected with this defect is the second---that he conceives the religious life too much as passive. The feeling of absolute dependence, taken by itself, seems to rule out the sense of co-operation with God which has been an element in some at least of the most highly evolved religious experience.'' And p.~21: ``The religious attitude, though self-abnegating, is not passive, for it includes the possibility of co-operation.'' Matthews's answer to the passive feeling is co-operation with God; here it is ``a living and dynamic experience of divinity attainment predicated on humanity service''.'''

# F3, ruled as proposed: kept; checked in the book, pp. 5-6.
[[note]]
at = "5:4.1"
after = "on humanity service."
origin = "07b27e2017b2c0c1"
credit = "block"
tex = '''Matthews~\cite{Matthews}, p.~5: ``We are concerned to know what drives man forward in his quest for God,---or what allures him''; and p.~6, of Schleiermacher, ``who was among the first to concentrate attention on religious experience and to make it the foundation of theology'': religion is ``a feeling of absolute dependence''. Here it is fear that drives and revelation that allures.'''

# F3a, added, ruled as proposed: Block's finding, checked in the book, pp. 18-20.
[[note]]
at = "5:4.2"
after = "the life of truth."
origin = "none"
credit = "block"
tex = '''Matthews~\cite{Matthews} finds two needs that religion meets, ``the need for unity and the need for the substantiation of value'' (p.~18). Of the first: ``if we try to place ourselves at the standpoint of the primitive believer, we can see that for him his belief in spirits or d\ae mons is a relative unification''; and he quotes Professor Hocking: ``All polytheism is imperfect monotheism'' (p.~19). Of the second: ``The monotheistic faiths have held that God is the substance of values, Himself the supreme Value'' (p.~20). Here unity is the first service of religion, Hocking's saying has become ``polytheism is monotheism in the making'', and God is ``the reality of values, the substance of meanings, and the life of truth''.'''

# F3b, added, ruled as proposed: Block's finding, checked in the book, p. 21; with the next
# sentence, which Block sets beside 5:4.4 as a comparison.
[[note]]
at = "5:4.3"
after = "human and superhuman."
origin = "none"
credit = "block"
tex = '''Matthews~\cite{Matthews}, p.~21, names Professor J.~B. Pratt among those who have described the religious attitude, as one who designates God as ``the determiner of destiny''; here God is that, and ``man's eternal destination''. Matthews goes on: ``Religious states of mind contrast with those which are scientific or simply practical or moral in this respect, that whereas the scientific and moral are attempts at mastery over the not-self, to bring the objective material within the categories of the understanding or to bend it to the purpose of the will, in religion the self seeks rather to be mastered, to bend itself to that `other' with which it is continuous.'' Here the religious self identifies itself with the universe, and dedicates itself to the service of ``the universe family of fellow beings''. Of the same attitude Matthews says that it ``is more closely akin to that of \ae sthetic enjoyment, which wishes not to alter the object but to remain in its presence''; in \bibref[5:4.4]{p005 4:4} art and philosophy stand between the nonreligious and the religious.'''

# F4, ruled as proposed: kept; checked in the book, pp. 21-22.
[[note]]
at = "5:4.5"
after = "and in eternity."
origin = "4a5cf8fb70bad9aa"
credit = "block"
tex = '''Matthews~\cite{Matthews}, pp.~21--22: ``There is, for example, a profound and significant difference between the salvation of the Buddhist and the Christian. The former seeks release from suffering, the latter from sin''; and p.~22: ``In so far as he is religious man feels himself to be, in the end, impotent and miserable so long as he remains in his isolated selfhood.'' The Jewish, Greek and Islamic lines, and salvation from self, are not in the passage.'''

# F4a, added, ruled as proposed: Block's finding, checked in the book, p. 24.
[[note]]
at = "5:4.7"
after = "in human experience."
origin = "none"
credit = "block"
tex = '''Matthews~\cite{Matthews}, p.~24, closing his first chapter: ``In religion the life of the spirit of man reaches unity, and the richest religious life has not left the other activities of spirit behind but has taken them up into itself. The Reality which it seeks and thinks that it has known is One in which the thirsts of the soul for goodness, beauty, and truth are not annulled but satisfied.'' Here the unification is still to come: religion ``is destined to become'' it.'''

# F4b, added, ruled as proposed: Block's finding, checked in the book, pp. 34-35; the verse is
# Block's too, and the edition's KJV has it.
[[note]]
at = "5:4.8"
after = "nature of its prayers."
origin = "none"
credit = "block"
tex = '''Matthews~\cite{Matthews}, p.~34: ``The two fundamental maxims of Greek and Hebrew aspiration respectively `Know thyself' and `Know God', are not contradictory but complementary, for man knows God in so far as he truly knows himself and he knows himself through knowing God.'' Here the two are joined, as Matthews joins them, in Jesus' ``knowing God, and yourself as a son of God''; the Christians' ``knowledge of the Lord Jesus Christ'' is 2~Peter~1:8's. And p.~35: ``\,`Not lehrt beten' [need teaches prayer], and in the prayers which are offered we may discern most clearly the kinds of need of which the worshipper is conscious and the kind of deity to whom he prays. Petitions reveal more candidly than anything else a man's thought of himself and his thought of God.'''''

