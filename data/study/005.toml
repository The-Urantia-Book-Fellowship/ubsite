tex = '''Griffiths~\cite{Griffiths}, p.~169: ``From the side of religion you may pass to morality, but from morality there is no obvious nor even a possible path to religious experience''; and ``the worship of beauty in the abstract \ldots{} in no way resembles religion''.'''

