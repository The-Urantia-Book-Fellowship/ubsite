# F17, ruled as proposed: kept; checked in the book, pp. 46-47.
[[note]]
at = "5:6.9"
after = "to antecedent causation,"
origin = "8c02fba30f462172"
credit = "block"
tex = '''Illingworth~\cite{Illingworth}, pp.~46--47: ``Necessity or determination from without is characteristic of the material world, one event producing another in endless continuity of causation; whereas I am directly conscious of being self-determined from within---a source of original activity, a free agent, a will.'' Here freedom is not read off consciousness but bestowed with personality, and it is relative.'''

# F17a, added in review, ruled as proposed: checked in the book, pp. 166 and 173.
[[note]]
at = "5:6.9"
after = "in all personality."
origin = "none"
tex = '''Matthews~\cite{Matthews}, in his chapter ``The Living and Personal God'', p.~166: ``That spontaneity, that living and acting from a centre, which is present in some measure in every living being, comes to a full development in those individuals which we should call persons. They are self-conscious and self-directing \ldots{} In him [man] spontaneity has become creativity \ldots{} Creativeness is the mark of personality.'' And p.~173: ``Though the creative activity of the ego is the essence of personality, that without which it could not exist, the freedom cannot in human persons be absolute, for the activity is partly determined and limited by the conditions and the environment.'' Here personality is ``self-conscious'' and ``(relatively) self-determinative and self-creative'' (\bibref[5:6.6]{p005 6:6}), its liberation from causation is ``relative'', and the spontaneity in it is a ``kinship of divine spontaneity''.'''
