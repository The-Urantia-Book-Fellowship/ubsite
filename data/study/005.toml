tex = '''Griffiths~\cite{Griffiths}, pp.~169--170: ``The religious consciousness is sui generis, but it is more. It is the ancient mother of all the sciences---the science of nature, of morality, of art, of philosophy.'''''

# F11a, added, ruled as proposed: Block's finding, checked by the Archive's full-text search, p. 172.
[[note]]
at = "5:5.5"
after = "against his will."
origin = "none"
credit = "block"
tex = '''Griffiths~\cite{Griffiths}, p.~172, asks: ``Is the religious valuation of life normal to human nature and can we always deal with men on that assumption?'' If religious indifference is only ``a failure to accept religion on our particular terms, then the imperative remains and is, in fact, operative. But what does this imperative imply? It implies that man is religious by nature, incorrigibly and ineradicably.'' Here religion is ``normal and natural to man'', but not imperative: it is ``also optional''.'''

# F12, ruled as proposed: kept, with Block's p. 25 and the sentence before on p. 26; checked in
# the book, pp. 25-28.
[[note]]
at = "5:5.6"
after = "for intellectual comprehension."
origin = "213b6b247713b22b"
credit = "block"
tex = '''Matthews~\cite{Matthews} finds ``a paradox in religion from the outset'' (p.~25), which ``comes to the surface in a theoretical form in the crucial problem of religious thought---the debate between transcendence and immanence. A philosophy which will justify the religious attitude must maintain both that God is immanent and that He is transcendent'', for ``Either conception, in the long run, must deprive worship of its justification and prayer of its reality'' (p.~26); and p.~28: the contradictions of religion ``indicate rather that we are dealing with an object which is beyond our full comprehension''. Here the immanence is that of the indwelling Adjuster.'''

