origin = "none"
credit = "block"
tex = '''Matthews~\cite{Matthews}, p.~37, of the needs that carry the religious consciousness beyond polytheism: ``Two needs in particular he discovers---that for the unification of experience, the intellectual need, and that for the substantiation of universal values, the moral and the \ae sthetic need.'' Here they are two of the three satisfactions of religious experience, ``a more unified human consciousness'' and ``the substantiation of his ideals of moral values''; the third, the spiritual, is added in \bibref[5:5.10]{p005 5:10}.'''

