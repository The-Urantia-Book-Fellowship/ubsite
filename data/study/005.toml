# F13a, added in review, ruled as proposed: checked in the book, pp. 4, 11 and 112.
[[note]]
at = "5:5.12"
after = "of human experience."
origin = "none"
tex = '''That the experience stays the same while its concepts change is Matthews's thought too~\cite{Matthews}: ``There is an identity in the experience though an unlimited diversity in the concepts and images of religion'' (p.~4); the fundamental reactions of the Christian soul ``are essentially the same in all Christian generations'', while the theologies are ``various and embattled'', and the unity of Christianity is owed to the words and story of Jesus, ``which vibrate again in the souls of men from generation to generation'' (p.~112). So is the rest of the paragraph: ``we would protest against any view of religious experience which would deny its intimate connexion with thought and conduct or which, in the endeavour to safeguard its specific nature and its independence, would cut it off from the general life of the mind'' (p.~11).'''

