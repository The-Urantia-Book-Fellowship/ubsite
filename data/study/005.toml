# F9a, added, ruled as proposed: Block's finding, p. 165, with p. 169's list; checked by the
# Archive's full-text search.
[[note]]
at = "5:5.2"
after = "implied duties of morality."
origin = "none"
credit = "block"
tex = '''Griffiths~\cite{Griffiths}, p.~165: ``if there are religious values discoverable in our experience---values that cannot be equated with or derived from other values, such as the scientific, moral, or \ae sthetic---then there must be within the mind itself some pristine capacity for viewing the world in the way we call religious. Religion cannot be derived from non-religious characteristics of experience.'' And p.~169: ``Religion, then, cannot be equated either with philosophical speculation, science, morality, or \ae sthetics.'' Here society takes the place of \ae sthetics, which comes in \bibref[5:5.4]{p005 5:4}.'''

# F9b, added, ruled as proposed: Block's finding, checked by the Archive's full-text search, p. 167.
[[note]]
at = "5:5.3"
after = "even a pantheistic Deity."
origin = "none"
credit = "block"
tex = '''Griffiths~\cite{Griffiths}, p.~167: ``We cannot reduce religion to philosophy, to the attempt reason naturally makes to organise experience and think out the world as a unity, or reach some Absolute or God as the principle of that unity. This was Kant's impossible quest. \ldots{} But God thus conceived is not the God of the religious consciousness. He is the God of philosophy.'' Here the philosopher's God of unity stands beside the scientist's and the artist's, and only the religionist's is ``the God of love''.'''

