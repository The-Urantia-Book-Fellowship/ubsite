# F12, ruled: kept as it is, the editor's experience his own (Tigran).  Its
# link opens 112:3.2, which has no note until Paper 112 is reviewed.
[[note]]
at = "0:5.12"
after = "warp of morontia"
origin = "35c66cbd89b85cb7"
tex = '''The word ``morontia'' is composed of ``matter'' plus ``moral''. In addition to the present Editor's personal experience, the proof of this connection is given in the footnote to \bibref[112:3.2]{p112 3:2}. The link with the Greek word \textgreek{μάρανσις} ``causing to die away'', ``dying or fading away'' is also important here. And the medical term \textgreek{μαρασμός}, whence the English ``marasmus'' and ``marasmic'' come, is synonymous with \textgreek{μάρανσις}. It was used by the great \bibemph{Galen} in the II century A.D.'''

