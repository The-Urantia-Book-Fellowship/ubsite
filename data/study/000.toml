tex = '''Only the papers 1--31 (i.e. Part~I) were authorized at the superuniverse level. The papers 32--196 were revealed under other levels of authorization, all below the superuniverse level.'''

# F3, ruled: kept, rewritten, without Tolstoy; a tie after a title only, not
# through the name, which left a gap before it (Tigran).
[[note]]
at = "0:0.1"
after = "the English language"
origin = "219da6095c4fb39d"
tex = '''One of the reasons why English was chosen for the Fifth Epochal Revelation is that the vast majority of authors, whose works served as the basis of its text, such as Dr~William S. Sadler, Sir~Arthur S. Eddington and Sir~James Jeans, were all English speakers.'''

# F4, ruled: kept as it is, a reflection in the first person.
[[note]]
at = "0:0.4"
after = "statement within itself;"
origin = "ba8a27e69101881d"
tex = '''Why \bibemph{exactly} does the need to anticipate the usage of terms make this Foreword an unfinished statement? I could not answer this question until I remembered the difficulty encountered when studying the ancient Hebrew poetry. Not prose, but \bibemph{poetry}. Namely, the paucity of language makes the reading of poetry orders of magnitude more complex than prose. The fundamental fact is that the true meaning of any word is not the paragraph or two found in its dictionary definition, but rather the entire usage thereof in the whole body of literature, everywhere it is encountered. Hebrew poetry provides a clear and relatively compact illustration of this, because to \bibemph{really} understand one verse you often need to re-read many times the entire body of literature (i.e. all three books of Hebrew poetry: Psalms, Proverbs and Job) and this is what makes reading poetry hundreds, if not thousands, times harder than prose. Likewise, here the paucity of English language makes the mere ``dictionary definitions'' incomplete, unfinished and they must be supplemented by the entire ``body of literature'', i.e. the 31 subsequent presentations where each of these definitions is encountered. Therefore, the terms defined here might still have different meanings later on and this is what makes this Foreword an unfinished statement, i.e. it cannot be ``finished'' without the entirety of all the contexts where all the terms are used.'''

# F5, ruled: kept, with the pages of the 1955 printing, checked on the Guardian
# plates (djvu pages 7, 13, 67-83 and 85).
[[note]]
at = "0:0.4"
after = "universe of universes"
origin = "ad7f2c227f7a031e"
tex = '''As already noted at \bibref[0:0.1]{p000 0:1} these are limited to papers 1--31 only. Therefore, this Foreword is properly ``the Foreword to Part I of the Urantia Papers'' and that is where it should be printed. Curiously, this is where the Foreword is found in ``The Titles of the Papers'' (p.~vii) and ``Contents of the Book'' (p.~xiii) as printed in the 1955 edition, although the text of the Foreword is printed just before the Part I title page preceding Paper 1 of that edition.'''

# F6, F7, ruled: kept, with "perhaps".
[[note]]
at = "0:1.1"
after = "phenomena of deity"
origin = "6a46c2e2a1c8115e"
tex = '''In the lower case perhaps to reflect a certain degree of \bibemph{ambiguity} in associating observed universe phenomena with the activity of Deity. This sentence prepares the \bibemph{empirical soil} for the definition of Deity, which commences in the next paragraph.'''

[[note]]
at = "0:1.2"
after = "DEITY"
origin = "2646edcd5eb2629e"
tex = '''In all capitals perhaps to reflect the \bibemph{over-exactness} of this description which compensates for the ambiguity in the previous paragraph. Without resorting to such a combination of ambiguity and over-exactness it would probably be well\hyp{}nigh impossible to formulate a definition of Deity, which is both comprehensible by a mortal mind and free of the circular reasoning involved in the conceptual pair (Deity, divinity).'''

# F8, ruled: rewritten from Block's chart and Hartshorne's page 8 (Block's
# Exhibit A).  The edition's 'listed in this particular order to reflect the
# inherent ordering' is not Hartshorne's: he calls his order one of several.
# Tigran added the last sentence: the order is the dictionary order of the
# words, A before R before I.  A tie before each '>', so a line breaks only
# after one, as TeX breaks a formula.
[[note]]
at = "0:1.19"
after = "seven conceivable types"
origin = "82aaaea83279fe25"
credit = "block"
tex = '''The seven are Charles Hartshorne's, in his order \cite{Hartshorne}, p.~8, from his chapter ``The Formally Possible Doctrines'' about God's perfection. His symbols for them, A, AR, ARI, AI, R, RI and I, take one, two or all three of absolute perfection (A), relative perfection (R) and imperfection (I): the $2^3 - 1 = 7$ ways there are. Of his order he writes: ``The seven cases can be arranged, in several different ways, into three main groups. The following of the possible triadic arrangements seems the most useful''. This arrangement corresponds mathematically to the natural ordering A~> R~> I.'''

