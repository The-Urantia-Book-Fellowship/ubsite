tex = '''This may be a coined word from the Greek \textgreek{οὐρανός} ``heavens'' and the Latin suffix \textit{-tia}, signifying ``[y]our place in the heavens''. I pronounce it as \textit{oor\'anteeya}.'''

# F2, ruled: kept, Parts II-IV corrected (Part IV is the midwayers', not the system's),
