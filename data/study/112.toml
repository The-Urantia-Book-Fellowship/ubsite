# ---- 112:3.2

# B2, carried: the edition's note, which called the book "a propaganda leaflet
# to be read by the soldiers", the sentence "the 25th indictment of Germany"
# and its page 156.  The book is of 157 pages, "this little volume", prepared
# from his public addresses (Preface, pp. vii-viii, dated Jan. 1, 1918), and
# what it says of soldiers is the wish quoted here; the chapter is "The
# Indictment of Germany, or Twenty-five Reasons Why We Must Win the War", of
# which this is the twenty-fifth; and the sentence runs over to p. 157, the
# scan's last page.  The edition's inference is kept as the Editor's, on the
# assumption it names itself ("Assuming that there was no ``Sleeping
# Subject'' and that Dr Sadler himself was the direct and sole recipient of
# the Fifth Epochal Revelation"), with what the two sentences share said
# before it: not the two words only, but the court that pronounces on an
# insolvent.
[[note]]
at = "112:3.2"
after = "insolvent, morontially bankrupt"
origin = "059a33c8b52dea6d"
tex = '''The two words, and the figure of a court that winds up an insolvent, are in a book of Dr~William S. Sadler's of 1918, prepared from his public addresses on the war, which he hoped its readers would ``put it in the hands of our boys at the front'' (\cite{Sadler1918}, p.~ix). Its chapter XXIV is ``The Indictment of Germany, or Twenty-five Reasons Why We Must Win the War'', and the twenty-fifth reads: ``Because Germany has gone into moral bankruptcy---because she is spiritually insolvent---and the time has come for the civilized nations of the earth to sit as a solemn court of judgment to appoint a receiver either to reorganize or wind up the career of this brutal Germanic military establishment'' (pp.~156--157). Here the mortal is ``pronounced spiritually insolvent, morontially bankrupt'', and the finding is recorded and verified before the rulers of Orvonton act; \bibemph{morontially} stands where Sadler wrote \bibemph{moral}. On the present Editor's assumption that there was no ``Sleeping Subject'', the unnamed man through whom, by the usual account, the papers came, and that Dr~Sadler was himself the direct and sole recipient of the revelation, the new term would have been shaped from the English word already in his mind: see the note at \bibref[0:5.12]{p000 5:12}. The likeness of the two sentences stands whatever is assumed.'''
