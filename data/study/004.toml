[[note]]
at = "4:1.3"
after = "He is a faithful Creator.”"
origin = "none"
tex = '''Four of the five quotations of this paragraph stand in Nave's Topical Bible under \textsc{God}: \textsc{Faithfulness of} \cite{Nave}, pp.~440--443: 1~Corinthians~1:9 or 10:13, ``God is faithful'' (p.~443); Psalms~89:2, ``thy faithfulness shalt thou establish in the very heavens'' (p.~441); Psalms~119:89--90, ``For ever, O \textsc{Lord}, thy word is settled in heaven. Thy faithfulness is unto all generations: thou hast established the earth, and it abideth'' (p.~442, where Nave stops at ``generations'', and whole under \textsc{Immutable}, p.~457); and 1~Peter~4:19, ``as unto a faithful Creator'' (p.~443). No verse of the King James Version reads ``all his commandments are just'': under the same heading Nave has Psalms~111:7, ``all his commandments are sure'' (p.~442), and Romans~7:12 calls the commandment ``holy, and just, and good''.'''

# F1, ruled as proposed: kept; every verse checked in the edition's KJV.
[[note]]
at = "4:1.4"
after = "the everlasting arms.”"
origin = "a94cc30785d0de8a"
tex = '''Deuteronomy~33:27: ``The eternal God is thy refuge, and underneath are the everlasting arms: and he shall thrust out the enemy from before thee; and shall say, Destroy them.'' The other quotations of this paragraph are Psalms~91:1, Psalms~121:4 (``Behold, he that keepeth Israel shall neither slumber nor sleep''), Romans~8:28 (``to them that love God, to them who are the called according to his purpose'') and 1~Peter~3:12 (``his ears are open unto their prayers: but the face of the Lord is against them that do evil''). \textit{Thy} refuge and \textit{Israel} have become \textit{our} refuge and \textit{us}, and the destruction of the enemy, the face of the Lord against evildoers, and the called according to his purpose are left out.'''

