# F2, ruled as proposed: kept, with the rest of Psalms 104:30, which the next paragraph
# echoes.
[[note]]
at = "4:1.5"
after = "preserves them all.”"
origin = "3b79b4332cba40f2"
tex = '''Hebrews~1:3, of the Son: ``upholding all things by the word of his power''; Psalms~104:30: ``Thou sendest forth thy spirit, they are created''; Nehemiah~9:6: ``thou preservest them all''. The Son's upholding has become the Father's, and the Psalm's spirit has become the Sons, as the word of Psalms~33:6 did at \bibref[1:0.1]{p001 0:1}. The rest of the Psalm's verse, ``and thou renewest the face of the earth'', is in the next paragraph: ``all things are constantly being renewed''.'''

