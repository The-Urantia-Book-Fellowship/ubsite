# F10, ruled as proposed: corrected and extended.  Knudson's section on immutability
# begins on p. 314, where Block gives its first sentence for the paragraph's
# second; p. 315 quoted more fully, on the page Block gives.
[[note]]
at = "4:4.2"
after = "Lord, change not.”"
origin = "966be2f32bde792d"
credit = "block"
tex = '''Malachi~3:6: ``For I am the \textsc{Lord}, I change not''. It is quoted in that form at \bibref[2:2.1]{p002 2:1}; here it is in the wording of Knudson~\cite{Knudson}, p.~315, in the section on immutability that this paragraph follows (pp.~314--317). The section opens, ``As unity denies divisibility, so immutability denies change'' (p.~314), and the next page says that God's being unchangeable ``means, then, that he is self-existent and eternal'' and affirms ``an identity of being within God himself'' (p.~315): the two sentences before the quotation here.'''

# F11, ruled as proposed: corrected.  Knudson's unity to plurality is not added but
# recast; his "key" is self-identity.  The credit line corrects Block's
# quotation of p. 316.
[[note]]
at = "4:4.2"
after = "he is will."
origin = "f4f0265e864be469"
credit = "block"
corrects = '''``thought of as changeless substance'' for his ``thought as'''''
tex = '''Knudson~\cite{Knudson}, p.~316: ``Just as there is no way of passing from simplicity to complexity or from unity to plurality, so there is no way of passing from identity to change or from immutability to motion. If God be thought of as changeless substance, there would be no way of accounting for the advancing cosmic movement.'' He finds the immutable principle in ``the unique power of self-consciousness'', its ``capacity of self-identity'' being ``the key, and only key, to the divine immutability'', and concludes: ``Immutability is thus completely dissociated from immobility'' (pp.~316--317). Here the impossible transitions are the ones God makes; two are added, from infinity to finitude and from the divine to the human; Knudson's unity to plurality has become unity to duality and triunity; and the key is not self-consciousness but will.'''

# F11a, added, ruled as proposed: Block's finding, checked in the book, pp. 248 and 262.
[[note]]
at = "4:4.3"
after = "his eternal nature."
origin = "none"
credit = "block"
corrects = '''``dependent upon God'' for his ``dependent on God'''''
tex = '''Knudson~\cite{Knudson}, p.~248: ``Almightiness and creatorship mean absoluteness. They mean that the entire world is dependent upon God for its existence and that there are no limits to his power except those which he himself has imposed.'' And p.~262: ``We may distinguish two kinds of limitations---those that are imposed from without and those that are self-imposed or that inhere in the divine nature. It is only the latter that may be affirmed of God.'' Both of Knudson's kinds of limitation that may be affirmed of God are here: the self-imposed, and the qualities and attributes ``which inherently characterize his eternal nature''.'''

# F11b, added, ruled as proposed: Block's finding, checked in the book, pp. 242 and 248.
[[note]]
at = "4:4.4"
after = "will is his alone."
origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~242, opening his chapter ``The Absoluteness of God'': ``Personality and goodness are characteristics that God shares with men, but absoluteness sets him apart from all creaturely existence.'' And p.~248: ``The Christian God is absolute by virtue of the fact that he is `the Father Almighty, Maker of heaven and earth.'\,'' Here the Creed's Father Almighty is the Father-Absolute, creator of the central universe and Father of the Creators, and what sets him apart is not absoluteness but ``infinity of will''.'''

# F12, ruled as proposed: kept; checked in the book, p. 263.
[[note]]
at = "4:4.4"
after = "his volitional absoluteness."
origin = "613e25da3bc90e37"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~263: ``To deny to God the power of self-limitation would itself be to limit God, and that in an unworthy way.'' That the Father, choosing only the infinitely perfect, is the creator of the perfect central universe, while the Creator Sons, ``not altogether limited by that finality of wisdom'', have the more active free will, is not in Knudson.'''

