# F5a, added in review, ruled as proposed: checked in the book, pp. 346-347.
[[note]]
at = "4:3.2"
after = "man understands such reactions."
origin = "none"
tex = '''Knudson~\cite{Knudson}, pp.~346--347, on the wrath of God: ``Some theologians have rejected it as an unworthy anthropomorphism on the ground that it is inconsistent with the divine love''. He keeps it, as indignation at wrongdoing, in which there is ``nothing of the vindictive or vengeful. It stands closer to grief and compassion''. Here wrath ``in the sense of these human emotions'' is set aside, and grief is kept: the Father's heart ``is undoubtedly grieved'' (\bibref[4:3.5]{p004 3:5}).'''

# F6, ruled as proposed: corrected.  The Latin caligo has no sense "waste away": as a
# noun, mist, darkness, gloom; as a verb, to be in darkness, to grope about
# (Lewis and Short).
[[note]]
at = "4:3.3"
after = "and the Caligastia"
origin = "40eba5ba7dadb1a9"
tex = '''Possibly a coined word from the Latin \textit{caligo}, as a noun ``mist, darkness, gloom'', and as a verb ``to be in darkness, to grope about'', giving the meaning ``the one who is in darkness''.'''

# F6a, added in review, ruled as proposed: checked in Nave's page image, p. 457, and in
# Knudson, pp. 315-316.
[[note]]
at = "4:3.4"
after = "or ever will do."
origin = "none"
tex = '''Numbers~23:19: ``God is not a man, that he should lie; neither the son of man, that he should repent''; 1~Samuel~15:29: ``he is not a man, that he should repent''. Both stand first under \textsc{God}: \textsc{Immutable} in Nave's Topical Bible \cite{Nave}, p.~457. Knudson~\cite{Knudson} reads such verses as affirming God's ethical unchangeability, not his metaphysical immutability: ``The various passages that deny that God repents (for example, Num. 23. 19) \ldots{} are also to be so construed. This stress on the ethical constancy of God \ldots{} has to do with his `goodness,' which is the subject of the next chapter'' (pp.~315--316). The paper keeps the two apart as he does: this section, God's unchanging character, is of jealousy, wrath, repentance and goodness, and the metaphysical immutability is left to \bibref[4:4.2]{p004 4:2}, which follows Knudson's next pages.'''

# F7, ruled as proposed: kept; Genesis 6:6 checked in the edition's KJV.
[[note]]
at = "4:3.5"
after = "is undoubtedly grieved"
origin = "f868f997637192cf"
tex = '''Genesis~6:6: ``And it repented the \textsc{Lord} that he had made man on the earth, and it grieved him at his heart.'' Here the verse is divided: ``God repents of nothing'' (\bibref[4:3.4]{p004 3:4}), but his heart is grieved. Compare \bibref[3:6.6]{p003 6:6}, where a Divine Counselor does not know whether the Father suffers.'''

