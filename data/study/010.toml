# F7: checked in the Matthews scan, pp. 196 and 198, in the page images;
# 10:2.4 in the press text.
[[note]]
at = "10:2.2"
after = "completes the existential personalization of Deity."
origin = "none"
tex = '''Matthews~\cite{Matthews}, pp.~196--198, reaching for the Spirit by ``the analogy of society'': ``If then there is, in the very imperfect societies which are known to us, something which, transcending all individuals taken singly, can be called even metaphorically a social mind, we might expect that this characteristic would be perfectly developed in a perfect Society. Perhaps that would mean that, in this instance alone, the `social mind' would have passed beyond all metaphor and be `real mind'---fully personal will and intelligence. \ldots{} the relation between the First and Second Persons may itself be Personal.'' Here the Spirit is ``the unique personal consequence of the everlasting Father-Son union'' (\bibref[10:2.4]{p010 2:4}).'''

# F8: checked in the Matthews scan, p. 192, and in Simmel's first part,
# pp. 40 and 45, in the page images.
[[note]]
at = "10:2.3"
after = "Three persons are a minimum social group,"
origin = "none"
tex = '''The social analogy of the Trinity is the Cappadocian Fathers'. Matthews~\cite{Matthews}, p.~192: theology has used ``two classes of analogy \ldots{} that of the individual person and that of a society. The first of these has been the most common in the West and is employed by Augustine \ldots{} the second was used by the Cappadocian Fathers and has been revived by Dr.~Tennant and others in modern times.'' That three is the least number of a society is sociology's finding too. Simmel~\cite{Simmel}, p.~40, of a group of two: ``The departure of each single individual would destroy the whole, so that it does not come to such a superpersonal life of the whole that the individual feels himself independent; whereas, even in the case of an association of only three, if one individual departs, a group may still continue to exist''; and p.~45: ``Where three elements, A, B, C, constitute a community, there is added to the immediate relationship which exists, for example, between A and B, the immediate relationship which they gain by their common relation to C.'''''

# F9: checked in the Matthews scan, pp. 194-195, in the page images.
[[note]]
at = "10:2.3"
after = "inevitability of the Conjoint Actor."
origin = "none"
tex = '''Matthews~\cite{Matthews}, pp.~194--195: ``It has been said that no philosophical or theological argument has ever succeeded in showing why there should be three Persons in one God. The reality of distinctions within the Divine Experience may be shown to be a tenable proposition, but no ground can be discovered for the conclusion that these distinctions are not two or more than three. \ldots{} so far we have not, in our present discussion, gone beyond the `Binitarian' idea---the real being of Father and Son.'' The paper answers with the inevitability he doubted (the note at \bibref[10:0.3]{p010 0:3}), and counts the arithmetic of a social group ``least of all'' its reasons.'''

# F10: checked in the edition's KJV and the republication, p. 256 (PDF
# page 274).
[[note]]
at = "10:3.1"
after = "in our own image.”"
origin = "none"
tex = '''Genesis~1:26: ``And God said, Let us make man in our image, after our likeness''. \textit{Mortal} is added, \textit{after our likeness} left out. Dr~Sadler, on this paragraph \cite{Sadler2003}, p.~256: ``Plural Deity. The Creator addresses an equal---`us.' Thus, the first chapter of our Bible recognizes the Trinity.'' The paper reads it so too, of the Adjusters' bestowal.'''

# F11: checked in the edition's KJV; 8:2.2 in the press text.
[[note]]
at = "10:3.3"
after = "the “Word of God,”"
origin = "none"
tex = '''John~1:1 and 14; and Revelation~19:13: ``his name is called The Word of God''. ``The Act of God'' is the book's own, as ``the Divine Action'' is a title of the Spirit's (\bibref[8:2.2]{p008 2:2}).'''

# F12: checked in the Matthews scan, pp. 190 and 194, in the page images.
# The Nicene anathema is the creed's own text.
[[note]]
at = "10:3.5"
after = "are both coeternal with the Father."
origin = "none"
tex = '''Matthews~\cite{Matthews}, p.~190: ``It is assumed that the full knowledge of God would be that of God apart from creation, absolutely unrevealed, the solitary Absolute \ldots{} But the conception of God in Himself in this sense is probably unmeaning. At least we shall argue later that creation and revelation---the going forth into `otherness'---is no accidental or arbitrary characteristic of Deity, but, of the essence of the Divine Being''; and p.~194: ``the bare and solitary Absolute cannot be love''. The Council of Nicaea (325) put the same under anathema in Arius's words, \textgreek{ἦν ποτε ὅτε οὐκ ἦν}, ``there was when he was not''.'''

# F13: checked in Tigran's copy of Knudson, p. 416 (djvu page 418); 10:3.5,
# 0:12.1 and 10:3.7 in the press text.
[[note]]
at = "10:3.17"
after = "wholly voluntary and self-imposed."
origin = "none"
tex = '''Here the tradition is reversed. Knudson~\cite{Knudson}, p.~416, on the orthodox answer to the charge of tritheism: ``\,`Generation' and `procession,' we are told, are necessary processes; they are due to the divine nature rather than the divine will. There is, therefore, no possibility of one Person detaching himself from the others.'' In the paper the Son and the Spirit are the Father's ``self-willed divestment'' (\bibref[10:3.5]{p010 3:5}), the Trinity is ``inherent in the fact of the differentiation of the personal and the nonpersonal by the Father's unfettered will'' (\bibref[0:12.1]{p000 12:1}), and its interdependence is the price he chose (\bibref[10:3.7]{p010 3:7}).'''

# F14: checked in the Matthews scan, p. 198, and Simmel's first part, p. 45,
# in the page images.
[[note]]
at = "10:5.2"
after = "of the component individuals."
origin = "none"
tex = '''Matthews~\cite{Matthews}, p.~198: ``The association of human beings in any kind of group, whether family, club, or state, or even crowd, engenders some impulse to common action and hence some common thought and feeling. Nor can the common action, thought, or feeling be identified with that of any single person or class of persons within the group.'' And Simmel~\cite{Simmel}, p.~45, of two against three: when one of two fails, ``only the other remains, without any superindividual energy such as, even in the case of a combination of only three, is in some measure present''.'''

