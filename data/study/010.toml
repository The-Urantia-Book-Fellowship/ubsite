origin = "none"
tex = '''Isaiah~44:6: ``I \bibemph{am} the first, and I \bibemph{am} the last; and beside me \bibemph{there is} no God.'' Also 48:12; and of Christ, Revelation~1:17: ``I am the first and the last''.'''

# F21: checked in the edition's KJV; 3:5.5 in the press text.
[[note]]
at = "10:7.5"
after = "the welfare and progress of the universes."
origin = "none"
tex = '''Romans~8:28: ``And we know that all things work together for good to them that love God''. \textit{All things} are here the ``catastrophic physical events, appalling accidents, horrific disasters, painful illnesses, and world-wide scourges''; \textit{for good} has become ``for the welfare and progress of the universes''; and the Supreme is named as the hand in it, as \bibref[3:5.5]{p003 5:5} names ``the universal sovereignty of God'' over ``the vicissitudes of existence''.'''
