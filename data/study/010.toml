# note was found in review, with no credit line, checked against the press
# text, the edition's own KJV, the SBL Greek New Testament, and the originals:
# Matthews's God in Christian Thought and Experience, ch. VIII, The Holy
# Trinity, pp. 180-201 (../block-sources/originals/, the page images for every
# page quoted); Knudson's The Doctrine of God, ch. X, The Trinity, in Tigran's
# copy (originals/LIBRARY.tsv, the DjVu pages quoted); Aquinas's Summa, I,
# q. 32, a. 1 (originals/, p. 61); Sadler's Analytic Study of Part I,
# pp. 251-269 (originals/); and Georg Simmel's The Number of Members as
# Determining the Sociological Form of the Group, in The American Journal of
# Sociology, 1902, JSTOR's free text from the Archive (originals/
