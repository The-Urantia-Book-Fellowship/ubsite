# F16: checked in the edition's KJV.
[[note]]
at = "10:6.1"
after = "he is law."
origin = "none"
tex = '''Compare Isaiah~33:22: ``For the \textsc{Lord} \bibemph{is} our judge, the \textsc{Lord} \bibemph{is} our lawgiver, the \textsc{Lord} \bibemph{is} our king''; and James~4:12: ``There is one lawgiver''. Here the one law is shared out: its source the Father, its administration the Son's, its revelation the Spirit's, and its application, justice, the Trinity's.'''

# F17: checked in the edition's KJV; 10:6.4 and 10:6.16 in the press text.
[[note]]
at = "10:6.2"
after = "it is always a plural function."
origin = "none"
tex = '''Compare John~5:22: ``For the Father judgeth no man, but hath committed all judgment unto the Son''. Here neither judges: ``No one of the Paradise Deities fosters the administration of justice''; judgment is the work of the Stationary Sons of the Trinity (\bibref[10:6.4]{p010 6:4}), and the Censor who writes this is one of them (\bibref[10:6.16]{p010 6:16}).'''

# F18: 2:4.1 and 2:3.2 in the press text; checked in the edition's KJV.
[[note]]
at = "10:6.18"
after = "mercy is its personal expression."
origin = "none"
tex = '''\bibref[2:4.1]{p002 4:1}: ``Mercy is simply justice tempered by that wisdom which grows out of perfection of knowledge and the full recognition of the natural weaknesses and environmental handicaps of finite creatures''; and \bibref[2:3.2]{p002 3:2}: ``this divine justice is always tempered with mercy''. Compare Psalms~89:14: ``Justice and judgment \bibemph{are} the habitation of thy throne: mercy and truth shall go before thy face.'''''

# F19: checked in the edition's KJV; 1:7.6's note in data/study/001.toml.
[[note]]
