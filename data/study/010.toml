# F1: checked in the republication, pp. 267 and 269 (PDF pages 285 and 287);
# 93:2.5 in the press text.
[[note]]
at = "10:0.2"
after = "God the Father, God the Son, and God the Spirit."
origin = "none"
tex = '''The word is no Scripture's. Dr~Sadler, closing his study of this paper \cite{Sadler2003}, p.~267: ``The word `Trinity' is not found in the Bible''; and p.~269: ``The word `Trinity' first appears in Greek in A.D. 181, used by Theophilus of Antioch. The Latin word from which we derive our English was first used by Tertullian in A.D. 200.'' Theophilus says \textgreek{τριάς} of God, his Word and his Wisdom (\emph{To Autolycus}, II, 15); Tertullian's \emph{trinitas} is in his \emph{Against Praxeas}. The book's own sign for it is Melchizedek's, the three concentric circles (\bibref[93:2.5]{p093 2:5}).'''

# F2: checked in the Aquinas scan, p. 61, and Matthews, p. 195, in the page
# images; 0:12.1, 16:1.1 and 3:6.2 in the press text.
[[note]]
at = "10:0.3"
after = "deem the Trinity to have been inevitable."
origin = "none"
tex = '''The Censor's word has a history. Richard of St~Victor held that ``probable and even necessary arguments can be found'' for the Trinity, as Aquinas reports him, with those ``moved by the consideration that no good thing can be joyfully possessed without partnership'', before ruling that ``It is impossible to attain to the knowledge of the Trinity by natural reason'' \cite{Aquinas}, q.~32, a.~1, p.~61. Matthews~\cite{Matthews}, p.~195: ``Many philosophical interpretations of the doctrine of the Trinity have professed, at any rate, to show the inevitability of the number three, though it may be, as Dr.~Gore and Dr.~Kirk allege, their confidence is misplaced.'' The book takes Richard's side, by revelation: the Trinity ``was inevitable'' (\bibref[0:12.1]{p000 12:1}), ``the absolute inevitability'' (\bibref[16:1.1]{p016 1:1}), while ``The universe was not inevitable'' (\bibref[3:6.2]{p003 6:2}).'''

# F3: checked in the edition's KJV, the SBL Greek, and the Revised Version
# (its 1895 printing); 32:4.12's note in data/study/032.toml.
[[note]]
at = "10:1.2"
after = "except that of his central indwelling."
origin = "none"
tex = '''A kenosis before the Son's. Philippians~2:7, of Christ: ``But made himself of no reputation, and took upon him the form of a servant'', \textgreek{ἑαυτὸν ἐκένωσεν}, ``emptied himself'' in the Revised Version (1881). Said there of the incarnation; here of the Father in eternity, as at \bibref[32:4.12]{p032 4:12}, whose note gives the verse.'''

# F4: checked in Tigran's copy of Knudson, pp. 412-413 (djvu pages 414-415),
# and the Aquinas scan, p. 61; 1:7.6 in the press text.
[[note]]
at = "10:1.3"
after = "the Eternal Son and the Conjoint Actor."
origin = "none"
tex = '''Knudson~\cite{Knudson}, p.~413: ``It is at present, for instance, urged that personality is in its very nature social. It implies fellowship. There can, therefore, be no proper personality of God except on something like the Trinitarian basis.'' On p.~412 he gives the argument's roots: ``\,`Thou dost see the Trinity,' said Augustine, `if thou seest love' \ldots{} This idea of a trinity of love was elaborated at length during the medieval period by Richard St.~Victor in his six books de Trinitate''. Richard's own reason, as Aquinas gives it \cite{Aquinas}, p.~61: ``no good thing can be joyfully possessed without partnership''. The book has the fellowship at \bibref[1:7.6]{p001 7:6}: personality implies ``fellowship with other and equal personalities, such as exists in the personality associations of the Paradise Deities''.'''

