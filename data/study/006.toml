# F12: kept, with the book cited as a source; checked in Warrack's first
# printing, ch. LVIII, p. 145.
[[note]]
at = "6:8.1"
after = "the Universal Mother."
origin = "2f7c91c2eb39cf99"
tex = '''Compare Julian of Norwich~\cite{Julian}, chapter~58, p.~145: the Second Person ``is our Mother, Brother, and Saviour'', and ``the Second Person of the Trinity is our Mother in Nature''. Compare also \bibref[6:2.8]{p006 2:8}, where the Son looks upon all creatures ``both as father and as brother''; and \bibref[8:2.2]{p008 2:2}, where the Infinite Spirit is ``the Paradise Mother Spirit''.'''

# F12a, added in review: checked in the book, pp. 70-73.
[[note]]
at = "6:8.1"
after = "their universal family."
origin = "none"
tex = '''Illingworth~\cite{Illingworth}, in his lecture on the conception of divine personality, finds the triunity of personality first realized in the family, ``its abstract triunity being therein adequately, because personally, realized in father, mother, and child'' (p.~71); and goes on: ``the Christian Church did not press the family analogy, at any rate further than the doctrine of the Son. It probably saw early exhibited, among the Gnostic sects, the dangerous practical consequences which might ensue, from the introduction of a feminine principle into our thoughts about the Godhead; and therefore, while freely admitting feminine attributes, declined all thought of a feminine hypostasis, though possibly this may have involved some underestimate of an aspect of truth'' (pp.~72--73). Here the analogy is pressed: the Son is the Universal Mother, and ``all of us, high and low, constitute their universal family''.'''

# F13: kept, with the book cited as a source; checked in the second and revised
# edition, p. 9.
[[note]]
at = "6:8.3"
after = "the expressionful word."
origin = "485bd40ceaf807c0"
tex = '''Compare Thomas Aquinas~\cite{Aquinas}, I, q.~27, a.~3, p.~9: ``The procession of the Word is by way of an intelligible operation''; the other procession, of the Holy Spirit, is that of love. Here the mind of the universe belongs to the Third Person, ``the Infinite Mind'' (\bibref[8:2.2]{p008 2:2}).'''
