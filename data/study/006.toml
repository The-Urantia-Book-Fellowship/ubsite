# F0a, added in review: checked in the book, pp. 191-192.
[[note]]
at = "6:0.2"
after = "ever have had a beginning."
origin = "none"
tex = '''Matthews~\cite{Matthews}, p.~191, in his chapter ``The Holy Trinity'': ``God's thought of Himself, therefore, must be a completely adequate thought. We have no difficulty then in approving the proposition `In the beginning was the Thought'. God's thought of Himself is co\ae val with God's existence. In thinking Himself he `begets' the Son.'' And p.~192: ``the `me', the thought of God, is not passive object but active correlated subject---the perfect Image of the Father.'' Here the Son is ``the perfect and final expression'' of the Father's ``first'' concept (\bibref[6:0.1]{p006 0:1}), and as eternal as the Father: the Father ``never could have had a first thought, nor could the Eternal Son ever have had a beginning''. At \bibref[6:8.3]{p006 8:3}, ``God is the initiating thought and the Son is the expressionful word''.'''

# F0b, added in review: the verses checked in the edition's KJV, the Creed in
# Schaff's Creeds of Christendom (Tigran's library), Sadler's remark in the
# republication, p. 185.
[[note]]
at = "6:1.1"
after = "only-begotten Son of God."
origin = "none"
tex = '''John~1:18: ``the only begotten Son, which is in the bosom of the Father''; John~3:16: ``he gave his only begotten Son''; and the Nicene Creed: ``the only-begotten Son of God, begotten of the Father before all worlds''. In all three he is Jesus. The book gives the title twice: to the Eternal Son, here and at \bibref[10:1.4]{p010 1:4}, and to each Creator Son, ``the only-begotten and only-begettable offspring'' of one union of the Father's and the Son's concepts (\bibref[21:1.2]{p021 1:2}), Michael of Nebadon being the ``only-begotten Son'' of the 611,121st (\bibref[33:1.1]{p033 1:1}). Dr~Sadler set John~1:18 beside this paragraph, and wrote: ``How true: The Eternal Son enshrouds the Father. This is a direct attempt to separate the concepts of Michael and the Eternal Son'' \cite{Sadler2003}, p.~185.'''

# F1: kept; checked in the edition's KJV.
[[note]]
at = "6:1.3"
after = "that was made.”"
origin = "0b4a7fc16756482a"
tex = '''John~1:1--3: ``In the beginning was the Word, and the Word was with God, and the Word was God. The same was in the beginning with God. All things were made by him; and without him was not any thing made that was made.'' The second verse is left out, and the quotation stops before John~1:14, ``And the Word was made flesh'', which is not true of the Eternal Son; see \bibref[6:1.5]{p006 1:5}.'''

# F2: kept; checked in the edition's KJV.
[[note]]
at = "6:1.4"
after = "Word of life.”"
origin = "2a29910d50ae66bc"
tex = '''1~John~1:1 reads ``That which was from the beginning \ldots{} of the Word of life''. \textit{That which} has become \textit{He who}, and \textit{of the Word of life} has become \textit{even the Word of life}.'''

# F3: kept; checked in the edition's KJV.
[[note]]
at = "6:1.4"
after = "this world was.”"
origin = "8c78245b87ac25cc"
tex = '''John~17:5: ``And now, O Father, glorify thou me with thine own self with the glory which I had with thee before the world was.'' \textit{The world} has become \textit{this world}: the glory is Michael's before Urantia, not the Eternal Son's from eternity.'''

