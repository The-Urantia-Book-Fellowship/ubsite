after = "truly and spiritually moral."
origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~326: ``Faith in the responsiveness of the superworld to human need has always been the heart of religion, and the development of religion through the ages has consisted largely in the increasing clearness and thoroughness with which men have moralized this responsiveness.'' His first step was animism, which ``laid the foundation of a more distinctly ethical relation between the human and the divine''; his second, the prophets' ethical monotheism: ``Here it is that we have the essence of `revealed' religion.'' Knudson's two steps are here two kinds of religion, evolutionary and revealed, and his quotation marks round \textit{revealed} are gone.'''

