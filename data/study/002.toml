after = "loves only a good God."
origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~325: ``The bare absoluteness of God might awaken the sense of wonder and his metaphysical personality might elicit a spirit of inquiry with reference to the ultimate meaning of life; but these mental states belong only to the antechamber of religion. \ldots{} If God were a nonmoral Being, either intelligent or nonintelligent, he would not be a proper object of religious faith. It is only insofar as he is morally good, and so worthy of being trusted, that he is truly God in the religious sense of the term. At first the idea of divinity probably had very little ethical content; the gods were feared more than they were trusted.'' Knudson's antechamber of religion is here philosophy, and what he tells as history, gods feared before they were trusted, is here said of man at any time.'''

# F8b, added, ruled as proposed: Tigran's own find in Block's chart
# (2026-10-19); p. 326, as Block has it, checked in the DjVu.
[[note]]
