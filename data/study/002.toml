credit = "block"
tex = '''Knudson~\cite{Knudson}, pp.~347--350, makes the same point, that love and hate are properly directed only towards persons, but lets divine wrath, as ``an altered form'' of love, be ``properly vented'' on sin. Here ``God is never wrathful'' (\bibref[2:6.7]{p002 6:7}), and he strikes no personal attitude towards sin at all.'''

# F12a, added, ruled as proposed: Block's pp. 352-353, checked in the DjVu.
[[note]]
at = "2:6.9"
after = "volitional will of God."
origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~352: ``As over against a legalistic but theistic Pharisaism we would naturally say that God is personal love, but as over against an impersonal naturalism we would more fittingly say that God is a loving Person. At bottom the two expressions have virtually the same meaning.'' And p.~353: ``the attributes of personality and love agree in fixing attention on the volitional, as distinguished from the intellectual, side of the divine nature. The fundamental thing in personality is will, and this also is true of love.'' Knudson's two standpoints are a theologian's, against Pharisaism and against naturalism; here they are the two worlds God faces, of personality and of spirit, and in religious experience he is both.'''

