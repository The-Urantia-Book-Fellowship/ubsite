# F10a, added, ruled as proposed: Block sets pp. 336-338 beside the paragraph's
# first three sentences; checked in the DjVu ("what holds true of man" runs
# from p. 337 to p. 338).  F11 cites pp. 336-348 for the atonement; this is the
# attributes before it.
[[note]]
at = "2:6.5"
after = "between parent and child."
origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, on the divine attributes: righteousness ``brings out the thought that God is the ultimate source and ground of moral distinctions'', and truth ``takes special cognizance of God as Revealer'' (p.~336). Love ``in its human form'' is ``a craving and also a giving impulse. Both impulses are essential to true love'' (p.~337), and ``what holds true of man may properly be regarded as holding true also of God'' (pp.~337--338): in the divine love ``there must be \ldots{} more or less of the love of complacency, the love which takes pleasure in men and seeks fellowship with them. This is implied in the idea of the divine Fatherhood'' (p.~338). What Knudson grants with ``may properly'' and ``more or less'' is here said outright: love ``gives and craves affection''.'''

# F11, ruled as proposed: the dualism is in the belief Knudson rejects, not in
# the doctrine; "holds", the pages running backwards for "concludes"; Knudson's
# word is dualism, not assault; and the number after "free-willness of God.",
# not inside the word
[[note]]
at = "2:6.5"
after = "free-willness of God."
origin = "01402d982327c5fc"
credit = "block"
tex = '''The critique of the atonement doctrine is that of Knudson~\cite{Knudson}, pp.~336--348, who finds in the belief that God's righteousness and his love are opposed ``a deep-seated dualism, a dualism that in practice can be overcome only by an act of atonement'' (p.~348), and holds that ``No atonement in the ordinary sense of the term is necessary'' (p.~346). Knudson saw a dualism in God; here it is ``a philosophic assault upon both the unity and the free-willness of God''.'''

