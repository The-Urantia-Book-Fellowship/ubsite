origin = "none"
credit = "block"
tex = '''Knudson~\cite{Knudson}, p.~346: ``The divine righteousness, in other words, does not involve strict retributive justice.'' Here it ``is not dominated by'' it: not absent, as for Knudson, but not the master. Compare the justice of \bibref[2:3.1]{p002 3:1}.'''

