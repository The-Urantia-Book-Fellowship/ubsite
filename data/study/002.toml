# F17a, added, ruled as proposed: Block's pp. 167 and 169, checked in the DjVu,
# with the insane person of p. 167, which Block does not give.  P. 169
# misprints "educaton", so the note quotes round it.
[[note]]
at = "2:7.12"
after = "his expanding experience."
origin = "none"
credit = "block"
tex = '''This paragraph and the end of the one before follow Overstreet's ``Principle of Integration'' \cite{Overstreet}, pp.~166--169. The insane person ``is a little world in isolation. That world, in itself, may be a unified one, but it is futile, since it cannot relate itself to the larger world to which the individual belongs. Health is integration, the parts linked in harmonious working relation. \ldots{} A truth-system, in short, as we noted in a previous chapter, is a coherence system'' (p.~167). ``Human life, in brief, grows more adequate as it grows increasingly competent in the linking of itself with the various realities of its environment'', and life's basic education ``should be a training in unification or integration'' (p.~169). Overstreet's insane person, ``a little world in isolation'', is here ``the isolated child of the worlds'', whom education is to co-ordinate ``with the larger realities of his expanding experience''.'''
