after = "a faithful Creator.”"
origin = "1f225dce62a1e995"
credit = "block"
corrects = '''``Wisdom'' for his ``Purpose'' in the title of Hume's second chapter'''
tex = '''This paragraph is a chain of quotations from Hume~\cite{Hume}, one or two lines per religion, most from his first chapter, ``The One Supreme God'', and in its order but for Hinduism, which comes before Confucianism here: Christianity (1~Corinthians~8:6 and 1~Peter~4:19, p.~3), Hinduism (pp.~3, 16 and 4), Confucianism (p.~3), Islam (p.~4), Sikhism (p.~5), Taoism (p.~6) and Zoroastrianism (p.~6); then, from his second, ``The Divine Power and Wisdom'', Christianity (Matthew~19:26, p.~7) and Sikhism (p.~10). The impersonal is made personal: ``Great Heaven makes no mistakes'' becomes ``The great Controller makes no mistakes'', and Laozi's ``It is only the Supreme that excels in imparting itself to men'' becomes ``The Infinite is most excellent in that he imparts himself to men''. Laozi's ``How pure and still is the Supreme Being! How deep and unfathomable, as if the Honored Ancestor of all things!'' loses its \textit{as if}. And the one phrase of the Sikh Mul Mantar left out is the name: ``There is but one God, Whose name is True''.'''

