# Paper 7, Relation of the Eternal Son to the Universe: the British Study
# Edition has no notes on it at 2474116, and Block has no chart for it.  Every
# note here was found in review, with no credit line, checked against the press
# text, the edition's own KJV, and the originals: Strong's New World-Religion,
# Rufus Jones's The World Within and Sadler's Physiology of Faith and Fear in
# Tigran's copies (originals/LIBRARY.tsv), and Matthews's God in Christian
# Thought and Experience and Hendrix's The Religion of the Incarnation
# (../block-sources/originals/).  The review, numbered F1-F17 in the order of
# the text, each added note after the one before it (F2a), is
# var/study/review-007.md.  All 17 ruled by Tigran on 2026-10-21 and carried
# as proposed, with no credit line: the ten Bible notes kept (question 1),
# Jones's four (question 2), and no note added at 4:2.1, the fuller one on
# Strong to come at 12:7.2 with Paper 12 (question 3).  Three more, F2a, F2b
# and F3a, from Hendrix's chapter "Spiritual Gravitation", found once the
# Internet Archive's search answered again, ruled Yes the same day.

