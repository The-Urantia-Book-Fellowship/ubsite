# Paper 13, The Sacred Spheres of Paradise: the British Study Edition has two
# notes on it at d6c3206, both Tigran's own and both carried, rewritten: the
# luminescence of 13:0.4, now citing Vavilov's book as the Bibliography cites a
# work (the 1961 Academy volume, 159 pages, whose p. 138 the note gives), with
# Sadler's "(Firefly?)" and the book's own suns that shine without heat; and the
# reckoning of "nineteen hundred years ago" at 13:1.8, now from the papers' own
# dates (A.D. 1934; August 21, 7 B.C.) so that it does not age.  Block has no
# chart for the paper, and the press has no 1955 reading in it.  Everything
# else was found in review, with no credit line: the Bible behind the paper's
# quoted phrases (John 1:18, Galatians 4:4, 1 Timothy 3:16, Hebrews 1:14,
# Matthew 5:48, Deuteronomy 29:29, the creeds' right hand of the Father, James
# 4:8 and 2 Chronicles 15:2, the Deities' light); the seven worlds as the seven
# associations of three persons, in the Master Spirits' order; the names in
# -ington, from Mills's dictionary in Tigran's library (originals/LIBRARY.tsv);
# the book's own fuller words elsewhere on the Secrets of Supremacy, the
# Perfectors of Wisdom and Divinington, the Adjusters' home, the Gravity
# Messengers, the Master Spirits' three addresses, reflectivity, trinitization,
# the Solitary Messengers and the Power Directors, seraphic transport, the
# reversion directors, the soul, sixth- and seventh-stage spirits, the Most
# Holy Sphere, the Paradise cycle and the seven levels; one of Tigran's
# Russian notes in ud carried into English (13:0.3); and one remark of Dr
# Sadler's.  Sadler's Analytic Study of Part I, pp. 324-338 on this paper
# (originals/), was read whole.  The review, numbered F1-F30 in the order of
# the text, is var/study/review-013.md.  Ruled by Tigran on 2026-11-08, in
# chat: all approved but F13, the edition's reckoning of "nineteen hundred
# years ago", dropped as useless, so 29 notes; and F30 corrected the same day
# at his question, since the book nowhere connects the Foreword's seven levels
# of Deity function with any seven levels of reality: the note now says what
# the book says and no more.  Question 2 (Vavilov's publisher and his p. 138)
# stays open until he looks at his copy.

paper = 13
chart = "none"

