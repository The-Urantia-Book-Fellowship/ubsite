# ---- 103:8.6

# A1, added: Block's chart, p. 55, sets Knudson pp. 161 and 169-70 beside the
# paragraph's two sentences.  His "it...." after "no alliance with it" leaves
# out "We need, therefore, take no account of it."; his "[C]ausality" is
# "For causality" in the book.  The chapter is IV, Philosophy and Theology
# (his "IV: PHILOSOPHY AND THEOLOGY (Knudson 146)", and the running head).
[[note]]
at = "103:8.6"
after = "materialism and pantheism"
origin = "none"
credit = "block"
tex = '''Compare Knudson~\cite{Knudson}, ch.~IV, ``Philosophy and Theology'', which the paragraph follows. On the two extremes, p.~161: ``Materialism denies both the reality and worth of spirit and thus negates religion. Faith can form no alliance with it. \ldots\ Pantheism also in its more radical and distinctive form is destructive of faith, for it denies freedom and reduces spirit to the level of things.'' On personality, pp.~169--70: ``causality implies change and it also implies permanence. There must be some abiding being that produces the change; otherwise the change would not be accounted for. And this union of permanence and change inherent in causality is found, as we have seen, only in personality. A personalistic philosophy thus solves the problem of metaphysical causality and at the same time furnishes a foundation for the Christian belief in the divine creatorship and providence''.'''

# A2, carried: the edition's note, "This definition of personality (see
# 0:5.11) comes from the book ``Slavery and Freedom'' by N.A. Berdyaev,
# published in Russian in Paris in 1939.  The English translation was first
# published in 1943 (London) and 1944 (New York).  See also 112:0.1."  Now
# with Berdyaev's two sentences and their pages, which the edition did not
# quote, and "compare" for "comes from": the paragraph is made of Knudson's
# chapter (A1), whose p. 168, two pages before the passage Block quotes and
# not on his chart, has both halves of the Foreword's sentence, and whose
# word is "permanence"; and each writer gives the thought as another's.  The
# Russian of 1939 was not seen in its printing (an e-text of it in his
# library has "Личность есть неизменность в изменении. Это одно из
# существенных определений личности" and "Личность есть неизменное в
# изменении, единство в многообразии"); that it was published in Paris in
# 1939 is the edition's.  His book of 1934 is in the note at Tigran's word
# (2026-11-15, asked whether he wanted it: "Yes on all"): p. 147 of his scan
# of the Paris printing, in the old orthography, "Личность можетъ быть
# опредѣлена, какъ единство въ многообразіи ... Личность есть также
# сохраненіе цѣльности и единсва [sic], сохраненіе все того же единаго,
# неповторимаго образа въ постоянномъ измѣненіи, творчествѣ и активности",
# and p. 150, of William Stern, "личность есть unitas multiplex", each read
# in the page image and put into English here ("unity in the manifold" for
# единство въ многообразіи, which is how R. M. French has the same words of
# the 1939 book).  That its English is Solitude and Society is by the list
# "By the same author" in the London Slavery and Freedom; the English itself
# (1938 by the bibliographies) is not in his library and was not seen.
[[note]]
at = "103:8.6"
after = "presence of change"
origin = "ef504cb0f6385874"
tex = '''The same definition closes \bibref[112:0.1]{p112 0:1}; \bibref[112:0.9]{p112 0:9} has it as ``Personality is changeless in the presence of change'', and the Foreword as ``the one changeless reality in an otherwise ever-changing creature experience; and it unifies all other associated factors of individuality'' (\bibref[0:5.11]{p000 5:11}). Compare Berdyaev~\cite{Berdyaev1943}, p.~8: ``Personality is changelessness in change. That is one of the essential definitions of personality''; and p.~22: ``Personality is the unchanging in change, unity in the manifold.'' The wording is very close. His book was published in Russian in Paris in 1939, and this translation in London in February 1943 and in New York in 1944; but he had said the same in his Russian book of 1934, which is \emph{Solitude and Society} in English: personality ``may be defined as unity in the manifold'' and is ``the preservation of one and the same unrepeatable image in constant change'' (\cite{Berdyaev1934}, p.~147, translated here). The thought is neither his own nor Knudson's. Berdyaev names William Stern there, for whom ``personality is \textit{unitas multiplex}'' (p.~150), and in the later book has ``as Poulain correctly says'' (\cite{Berdyaev1943}, p.~23); and Knudson, whose chapter this paragraph follows (see the preceding note), calls it ``the modern insight into the fact that personality alone fills out the notion of being or reality. The real must provide for change, for this is a changing world; but if it is truly real, it must also in some sense abide and remain identical with itself. In a word, it must combine in itself identity and change, unity and plurality; and this, as a matter of fact, is done only in personality'' (\cite{Knudson}, p.~168). Those are both halves of the Foreword's sentence, the changeless in the changing and the one in the many; and \bibemph{permanence}, the word of this paragraph, is Knudson's (pp.~169--70).'''
