# Paper 16, The Seven Master Spirits: the British Study Edition has no note on
# it at d6c3206, and two sources, Griffiths and Schoen, both carried.  The press
# has no 1955 reading in the paper, and Tigran's Russian translation no note,
# so nothing is dropped and nothing carried from either.  Block's chart of
# March 4, 2020 covers sections 6, 7 and 9, from Griffiths's God in Idea and
# Experience and Max Schoen's article of March 1939, with two bracketed
# comparisons from Sadler's Mind at Mischief: his parallels are added as
# sixteen notes of their own, credited to him, each checked in the original
# (Schoen in the Internet Archive's scan of the issue, read in the page images;
# Sadler in Tigran's facsimile; Griffiths, which the Archive only lends,
# through its full-text search, six words at a time, as for Paper 5).  The
# rest was found in review, with no credit line.  Sources: Hocking's Meaning of
# God in Human Experience, which Griffiths is expounding, behind 16:9.4 and
# 16:9.14; Plato's Protagoras in Jowett's version, which Schoen quotes, behind
# "the art of measurement"; the Stoic definition of virtue, from Diogenes
# Laertius; Kant, Troeltsch and Otto behind the three a priori; St Paul, whom
# Griffiths himself quotes, behind "known as it knows".  The Bible where the
# paper quotes or echoes it (Revelation 5:6, Colossians 1:15, Hebrews 1:1-2
# and 11:6, Romans 8:21, the second commandment).  And, as Tigran asked of
# every paper from 15 on, the places that are interesting or hard: the three
# persons acting together "but not as the Trinity" (16:1.2); the Master Spirit
# who advises the chief of the Adjusters and yet has "nothing whatever to do"
# with them (16:4.16); the stamp of a superuniverse seen in who fails at the
# Deity adventure (16:5.5, from 26:8.4); the three insights followed through
# the paper (16:6.10) until they become four (16:9.13); the one-sentence
# description of the Urantia type of personality taken a phrase at a time
# (16:8.15); "dualize" (16:9.2); what is kept of a nonsurvivor (16:9.3).
# Sadler's Analytic Study of Part I, pp. 366-378 on this paper, was read whole.
# The review, numbered F1-F53 in the order of the text, is
# var/study/review-016.md.  RULED by Tigran on 2026-11-16, all 53 as proposed
# ("all is accepted, please apply everything, commit, push and deploy"), with
# the questions taken as recommended, and as he read: F40's 2,134th with its
# superscript ("you forgot the superscript in '2,134th'"), and F42 enlarged at
# his questions, his reading of 49:6.12 in the first person at his word.

