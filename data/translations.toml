# What a reader is told about each translation the site shows beside the text
# (ROADMAP item 15, step 2; build/translation.py).  The table's name is its key
# in sources.toml, where its repository and the commit read are, and what a
# reader's Settings store: it never changes once deployed.
#
#   title   the work's own title, as it calls itself: never translated
#   lang    the language it is in, as a tag (BCP 47)
#   by      who made it, and who publishes it, in each language of the interface
#   label   its short name, the same in every language of the interface, never
#           translated: a fold names it so, in its tab and over its text, where
#           who made it would take two lines on a phone, and Settings puts it
#           after the title, "Книга Урантии (USGNY)", so that the one can be
#           known by the other (Tigran, 2026-10-26).  A Foundation translation's
#           is the head of its text id, UF-RUS, which the build holds it to: the
#           year would not tell one language's from another's (Tigran,
#           2026-10-27)
#   credit  where its owner asks it, the words a reader is shown with who made
#           it, in each language of the interface (Settings); none, nothing
#
# What it covers ("the whole book", "Papers 0–39 ...") is counted from the
# data, never written here.  Words from the mockup Tigran settled on 2026-10-26.

[ud]
title = "Урантийские документы"
lang  = "ru"
by    = { en = "translated by Tigran Aivazian", ru = "перевод Тиграна Айвазяна" }
label = "Aivazian"

[urantia-ru]
title = "Книга Урантии"
lang  = "ru"
label = "USGNY"         # the Urantia Book Society of Greater New York
[urantia-ru.by]
en = "translated by Lila Dogim, corrected by Sergey Prokopov; Urantia Book Society of Greater New York"
ru = "перевод Лилы Догим, с исправлениями Сергея Прокопова; Общество Книги Урантии Большого Нью-Йорка"

# The Urantia Foundation's own, its 2024 release, from its HTML (sources.toml):
# the whole book.  Its copyright, shown by its written permission, credited as
# Tigran worded it (2026-10-27).  Its title is the same as urantia-ru's, as each
# calls itself, and the short names tell them apart.
[uf-ru]
title  = "Книга Урантии"
lang   = "ru"
label  = "UF-RUS"
by     = { en = "translated by the Urantia Foundation, 2024 release", ru = "перевод Фонда Урантия, выпуск 2024 года" }
credit = { en = "Copyright © Urantia Foundation and used by permission", ru = "© Фонд Урантия; используется с разрешения" }
