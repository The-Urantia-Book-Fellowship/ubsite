# Unit conversions (/units): the units of time, distance, speed, weight and
# temperature the Urantia Papers define or use, beside the familiar ones
# (Tigran, 2026-11-22: "a table-like conversion calculator for distances,
# weights and time units, as described in the Urantia Papers ... in both
# directions").  build/units.py reads this into var/ub.db, the tables unit_*,
# and holds it to the text; DECISIONS.md, Unit conversions, has the rulings.
#
# [[group]]   a table of the page: its names, the unit and value it opens at,
#             and the headword of the index that gathers its units, if any.
# [[band]]    a heading inside a table: the realm a book's unit belongs to, or
#             the system of the familiar ones.
# [[unit]]    a row.  `size` is the unit in others: terms `number unit` joined
#             by + and -, a number a decimal, an exponent (2e27) or a fraction
#             (5/9), a term with no number one of the unit; the group's base
#             has `size = "base"`.  `offset` is added before scaling (the
#             temperatures: base = (value + offset) x size).
#             A unit the book defines names its paragraph (`ref`) and its words
#             there, exactly, once and whole (`words`), and the same words of
#             the Foundation's Russian translation (`words_ru`, the paragraph
#             of uf-ru; Tigran, 2026-11-22: the Foundation's terms).  `about`
#             where the book says about, almost, a trifle: its figure is taken
#             as written and the row is marked so, and so is every unit made
#             from it.  A familiar unit has `def`, its standard, in each
#             language.
# [[example]] a figure of the text, under its table: the words (exactly, as
#             for a unit), the value and unit they give, which a tap puts in
#             the table.  `says` is where the book itself gives the figure in
#             another unit: the build fails unless the table agrees within
#             `within`, a fraction, which the book's own "about" sets.
#
# The Russian names are from uf-ru's wording of the defining paragraph, for
# Tigran's review; «десятитысячелетие» is ours, uf-ru saying «десять
# тысячелетий».

