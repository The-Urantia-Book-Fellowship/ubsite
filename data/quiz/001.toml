[[question]]
id = 823
q = 'Mortals can hardly hope to be perfect in the infinite sense. What, then, does the command “Be you perfect, even as I am perfect” ask of them?'
a = [
  'to become as perfect as God himself, in the infinite sense',
  'to become as perfect in their own finite sphere as God is in his sphere of infinity',
  'to strive for an ideal that no mortal ever reaches, here or hereafter',
  'to become flawless in body and in intellectual grasp before death',
]
right = ['to become as perfect in their own finite sphere as God is in his sphere of infinity']
refs = ['1:0.5 «Such perfection may not be universal in the material sense, unlimited in intellectual grasp, or final in spiritual experience, but it is final and complete in all finite aspects of divinity of will, perfection of personality motivation, and God-consciousness.»']

[[question]]
id = 824
q = 'Why do we call the First Source and Center “Father”?'
a = [
  'it is the name he revealed for himself',
  'it is his name throughout all the universes',
  'the prophets of old gave him that name',
  'it is a name of our own choosing, from our personal relationship with him',
]
right = ['it is a name of our own choosing, from our personal relationship with him']
refs = ['1:1.1 «The First Source and Universe Center has never revealed himself by name, only by nature. If we believe that we are the children of this Creator, it is only natural that we should eventually call him Father. But this is the name of our own choosing, and it grows out of the recognition of our personal relationship with the First Source and Center.»']

[[question]]
id = 58
q = 'What is man’s choicest (in fact, the only possible) gift to God?'
a = [
  'consecration of will',
  'prayer',
  'meditation',
  'helping the poor',
]
right = ['consecration of will']
refs = ['1:1.2 «The affectionate dedication of the human will to the doing of the Father’s will is man’s choicest gift to God; in fact, such a consecration of creature will constitutes man’s only possible gift of true value to the Paradise Father.»']

